<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang giáo viên · IVY Word Quest</title>
<style>
:root{--ink:#1F2B3A;--soft:#54627A;--paper:#F2EEE3;--card:#FBF8F0;--line:#E5DDCB;--rust:#C0562C;--moss:#2C8443;--danger:#B0463C;--navy:#22344A;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
a{color:var(--rust)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.top h1{font-size:26px} .top h1 em{color:var(--rust)}
.top .grow{flex:1}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:9px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.small{font-size:12.5px;padding:6px 12px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.login{max-width:420px;margin:60px auto}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px;font-weight:600}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:10px 12px;border:1.5px solid #D5CCB8;border-radius:10px;background:#fff}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
.ok{color:var(--moss)}
.classbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.classbar select{width:auto;min-width:240px}
.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{font:inherit;font-weight:700;border:none;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--soft)}
.tabs button.on{background:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpis b{display:block;font-family:Georgia,serif;font-size:26px}
.kpis span{font-size:12.5px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid #EEE7D6;text-align:left;vertical-align:top}
th{background:#22344A;color:#fff;font-weight:600;font-size:12.5px;position:sticky;top:0;cursor:pointer;white-space:nowrap}
tr.click:hover td{background:#FFF7EC;cursor:pointer}
.bar{height:8px;background:#EEE7D6;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--moss)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.g{background:#DDF3E2;color:#226B38}.pill.r{background:#F8DAD6;color:#8F2E24}.pill.y{background:#FFF0C2;color:#8A6510}.pill.n{background:#EEE;color:#666}
.muted{color:var(--soft);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:20}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:18px;max-width:900px;width:100%;padding:22px}
.tscroll{overflow:auto;max-height:70vh;border-radius:12px}
.chips label{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0;font-size:14px}
.chips input{width:auto}
.topicpick{max-height:260px;overflow:auto;background:#fff;border:1.5px solid #D5CCB8;border-radius:10px;padding:8px 12px}
.topicpick h4{margin:10px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust)}
.topicpick label{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.topicpick input{width:auto}
details.rdo{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:#fff}
details.rdo summary{cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rdo-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.rdo-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.rdo-row:hover{background:#F4F6F9}.rdo-row.on{background:#EAF6EE}
.rdo-row input{width:18px;height:18px}
.gfilters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px}.gfilters .grow{flex:1}
.gfilters select{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.gchip{font:inherit;font-size:13.5px;font-weight:700;padding:7px 12px;margin:2px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.gchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.gwatch{display:flex;flex-direction:column;gap:4px;background:#FFF8E6;border-color:#F0D58A}.gwatch a{cursor:pointer;text-decoration:underline}
.gwrap{overflow:auto;max-height:70vh;border-radius:12px;border:1px solid var(--line)}
.gtable{font-size:14px;border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.gtable th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:12.5px;padding:8px 6px;white-space:nowrap;z-index:2;cursor:help}
.gtable td{border-bottom:1px solid #EFEAE0;padding:5px 4px;text-align:center;background:#fff}
.gtable .gname{position:sticky;left:0;z-index:1;text-align:left;min-width:170px;padding-left:12px;background:#fff;border-right:1px solid var(--line)}
.gtable th.gname{z-index:3;background:var(--navy)}
.gtable .gname a{color:var(--ink);font-weight:700;cursor:pointer}.gtable .gname a:hover{color:var(--rust)}
.gtable .gavg{background:#FBF8F0;font-weight:800}.gtable th.gavg{background:#2E4763}
.gtable .gdone{color:var(--soft);font-size:12.5px}
.gv{display:inline-block;min-width:44px;padding:5px 6px;border-radius:8px;font-weight:800;font-size:14px;border:none;font-family:inherit;line-height:1.1}
button.gv{cursor:pointer}button.gv:hover{outline:2px solid var(--navy)}
.gv sup{font-size:9px;margin-left:1px}
.gv.g{background:#CFEFD8;color:#1D6234}.gv.b{background:#DCEBFA;color:#1F4E80}.gv.y{background:#FFF0C2;color:#7D5A08}.gv.r{background:#F8D3CE;color:#8F2E24}.gv.e{background:transparent;color:#B9B3A6;font-weight:600}
.gt,.bt{color:#1D6234}.yt{color:#9A6B00}.rt{color:#B0463C}.et{color:#888}
.gfoot td{background:#F4F1E8 !important;font-weight:700;border-top:2px solid var(--line)}.gfoot small{display:block;font-size:11px;color:var(--soft);font-weight:500}
.glegend{font-size:12.5px;color:var(--soft);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.glegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px}.glegend i.g{background:#CFEFD8}.glegend i.b{background:#DCEBFA}.glegend i.y{background:#FFF0C2}.glegend i.r{background:#F8D3CE}
.gnum{font-weight:700;font-size:14px}.gdate{font-size:12.5px;white-space:nowrap}
.gmini{width:auto;min-width:320px}.gmini td{padding:6px 10px;border-bottom:1px solid #EFEAE0}
.asgparts{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.asgparts>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.asgparts .chips{margin-top:6px}.asgparts label.alt{opacity:.8;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>IVY <em>Word Quest</em> · Trang giáo viên</h1>
    <div class="grow"></div>
    <a class="btn" href="./">← Về trang học</a>
    <span id="who" class="muted"></span>
    <button class="btn small" id="btnOut" style="display:none">Đăng xuất</button>
  </div>

  <div id="viewSetup" class="card" style="display:none">
    <h2>Chưa kết nối lớp học trực tuyến</h2>
    <p class="muted">Web chưa có cấu hình Firebase. Cô gửi đoạn <code>firebaseConfig</code> cho Claude để kết nối.</p>
  </div>

  <div id="viewLogin" class="card login" style="display:none">
    <h2>Đăng nhập giáo viên</h2>
    <p class="muted">Dùng email giáo viên đã được cấp quyền. Lần đầu, bấm <b>Tạo tài khoản</b> và tự đặt mật khẩu (ít nhất 6 ký tự).</p>
    <label class="f"><span>Email</span><input id="tEmail" type="email" autocomplete="username"></label>
    <label class="f"><span>Mật khẩu</span><input id="tPass" type="password" autocomplete="current-password"></label>
    <div class="err" id="tErr"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn primary" id="tIn">Đăng nhập</button>
      <button class="btn" id="tUp">Tạo tài khoản</button>
      <button class="btn small" id="tReset">Quên mật khẩu</button>
    </div>
  </div>

  <div id="viewMain" style="display:none">
    <div class="card classbar">
      <b>Lớp:</b>
      <select id="clsSel"></select>
      <button class="btn small dark" id="btnNewCls">＋ Tạo lớp mới</button>
      <button class="btn small" id="btnRefresh">↻ Tải lại</button>
      <div style="flex:1"></div>
      <span class="muted" id="clsInfo"></span>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="students">👩‍🎓 Học sinh</button>
      <button data-t="grades" class="on">🏆 Bảng điểm</button>
      <button data-t="assign">📌 Giao bài</button>
      <button data-t="stats">📊 Thống kê</button>
      <button data-t="accounts">🔑 Tài khoản học sinh</button>
      <button data-t="reading">🔒 Mở bài & bài làm</button>
      <button data-t="classes">🏫 Quản lý lớp</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

const ASG_LEGACY = {learn:'learn', game:'gameall', practice:'practiceall', review:'review'};
function asgItems(a){ return (a.items && a.items.length) ? a.items : ((a.parts && a.parts.length) ? a.parts : Object.keys(PARTS)).map(p=> ASG_LEGACY[p] || p); }
function asgItemName(it){
  if(it.startsWith('game:')){ const m = (ASGCAT.games||[]).find(x=>x.id===it.slice(5)); return m ? `${m.icon} ${m.title}` : it.slice(5); }
  if(it.startsWith('act:')){ const id = it.slice(4); for(const k in (ASGCAT.acts||{})){ const x = ASGCAT.acts[k].find(y=>y.id===id); if(x) return x.title; } return id; }
  return ({learn:'Learn', review:'Review (thuộc từ)', gameall:'Game (mọi game)', practiceall:'Practice (tất cả)', test:'Vocabulary Test', pre:'Pre-Reading', post:'Post-Reading'})[it] || it;
}
function asgItemVal(s, it, tid){
  const tp = (sumOf(s).topics||[]).find(x=> x.id===tid) || {sec:{}, games:{}, acts:{}};
  const sec = tp.sec || {};
  if(it==='learn') return sec.learn||0; if(it==='review') return sec.review||0; if(it==='gameall') return sec.game||0; if(it==='practiceall') return sec.practice||0;
  if(it.startsWith('game:')) return (tp.games||{})[it.slice(5)] ? 100 : 0;
  if(it.startsWith('act:')){ const id = it.slice(4); if(!((ASGCAT.acts||{})[tid]||[]).some(x=>x.id===id)) return null; return (tp.acts||{})[id] ?? 0; }
  if(it==='test' || it==='pre' || it==='post'){
    const ps = (RT_LIST[tid]||{})[it] || []; if(!ps.length) return null;

}

}

async function boot(){
  if(!FIREBASE_CONFIG){ show('viewSetup'); return; }
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'), loadScript(base+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FIREBASE_CONFIG);
  T.auth = firebase.auth(); T.db = firebase.firestore();
  T.auth.onAuthStateChanged(async u=>{
    if(!u || /@hocsinh\./.test(u.email||'')){ $('who').textContent=''; $('btnOut').style.display='none'; show('viewLogin'); return; }
    $('who').textContent = u.email; $('btnOut').style.display = '';
    show('viewMain');
    await loadClasses();
  });
  $('tIn').onclick = ()=> T.auth.signInWithEmailAndPassword($('tEmail').value.trim(), $('tPass').value).catch(e=> tErr(authMsg(e)));
  $('tUp').onclick = ()=> T.auth.createUserWithEmailAndPassword($('tEmail').value.trim(), $('tPass').value).catch(e=> tErr(authMsg(e)));
  $('tReset').onclick = ()=>{ const em = $('tEmail').value.trim(); if(!em) return tErr('Cô nhập email trước.'); T.auth.sendPasswordResetEmail(em).then(()=> tErr('Đã gửi email đặt lại mật khẩu.', true)).catch(e=> tErr(authMsg(e))); };
  $('tPass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('tIn').click(); });
  $('btnOut').onclick = ()=> T.auth.signOut();
  $('btnNewCls').onclick = newClassDialog;
  $('btnRefresh').onclick = ()=> loadClass(T.cls && T.cls.code);
  $('clsSel').onchange = ()=> loadClass($('clsSel').value);
  $('tabs').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ T.tab = b.dataset.t; $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); render(); });
}

async function loadClasses(sel){
  try{
    const qs = await T.db.collection('classes').get();
    T.classes = qs.docs.map(d=>({code:d.id, ...d.data()})).sort((a,b)=> a.code.localeCompare(b.code));
  }catch(e){
    $('panel').innerHTML = `<div class="card"><h3>Tài khoản này chưa có quyền giáo viên</h3><p class="muted">Email <b>${esc(T.auth.currentUser.email)}</b> chưa nằm trong danh sách giáo viên của Firestore. Cô nhắn Claude để thêm email này vào quy tắc bảo mật.</p></div>`;
    return;
  }
  $('clsSel').innerHTML = T.classes.length ? T.classes.map(c=>`<option value="${esc(c.code)}">${esc(c.code)} — ${esc(c.name||'')}</option>`).join('') : '<option value="">(chưa có lớp)</option>';
  const code = sel || (T.cls && T.cls.code) || localStorage.getItem('ivyT_cls') || (T.classes[0]||{}).code;
  if(code && T.classes.some(c=>c.code===code)){ $('clsSel').value = code; await loadClass(code); }
  else { T.cls = null; T.students = []; T.assignments = []; render(); }
}
async function loadClass(code){
  if(!code){ T.cls = null; render(); return; }
  localStorage.setItem('ivyT_cls', code);
  T.cls = T.classes.find(c=>c.code===code);
  $('panel').innerHTML = '<div class="card muted">Đang tải dữ liệu lớp…</div>';
  const [st, as] = await Promise.all([
    T.db.collection('students').where('classCode','==',code).get(),
    T.db.collection('classes').doc(code).collection('assignments').get()
  ]);
  T.students = st.docs.map(d=>({uid:d.id, ...d.data()}));
  T.assignments = as.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> String(b.due||'').localeCompare(String(a.due||'')));
  $('clsInfo').textContent = `${T.students.length} học sinh · ${T.assignments.length} bài giao`;
  render();
}

function asgPct(s, a){

  return Math.round(d.reduce((x,y)=>x+y.v,0)/d.length);
}
function lastMs(s){ return s.clientUpdatedAt || (s.updatedAt && s.updatedAt.toMillis ? s.updatedAt.toMillis() : 0); }
function bar(p){ return p==null ? '<span class="muted">—</span>' : `<div style="display:flex;gap:6px;align-items:center"><div class="bar"><i style="width:${p}%"></i></div><small>${p}%</small></div>`; }

function rdOf(s){ return (sumOf(s).reading) || {}; }
function rdDur(sec){ sec = sec||0; return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function rdFlags(r){
  const f = [];
  if(r.viol) f.push(`<span class="pill r">rời trang ${r.viol} lần</span>`);
  if(r.end==='viol') f.push('<span class="pill r">tự nộp do rời trang</span>');
  if(r.end==='abandoned') f.push('<span class="pill r">bỏ dở / tải lại trang</span>');
  if(r.end==='left') f.push('<span class="pill y">thoát giữa chừng</span>');
  if(r.paste) f.push(`<span class="pill y">thử dán ${r.paste} lần</span>`);
  return f.join(' ') || '<span class="pill g">bình thường</span>';
}
function rdKeys(){
  const m = {};
  T.students.forEach(s=> Object.entries(rdOf(s)).forEach(([k,r])=>{ if(!m[k]) m[k] = r; }));
  return Object.keys(m).sort().map(k=>({k, r:m[k]}));
}

    ${(x.open||[]).map((o,i)=>`<div style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0">

const STUDENT_EMAIL_DOMAIN = 'hocsinh.ivy-word-quest.app';
function normUser(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'').slice(0,40); }
function managedEmail(code, user){ return `${code.toLowerCase()}.${normUser(user)}@${STUDENT_EMAIL_DOMAIN}`; }
function studentPass(code, pin){ return `IVY#${pin}#${code}`; }
function newPw(){ return String(Math.floor(100000 + Math.random()*900000)); }
function creatorApp(){
  let app = (firebase.apps||[]).find(a=>a && a.name==='creator');
  if(!app){ app = firebase.initializeApp(FIREBASE_CONFIG, 'creator'); try{ app.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(e){} }
  return app;
}
function siteUrl(){ return location.href.replace(/teacher\.html.*$/,'').replace(/[?#].*$/,''); }
async function loadRoster(){
  const qs = await T.db.collection('classes').doc(T.cls.code).collection('roster').get();
  T.roster = qs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'vi'));
}
async function createStudentAccount(code, name, used){
  const base = normUser(name) || 'hocsinh';
  let u = base, i = 2; while(used.has(u)) u = base + (i++);
  const pw = newPw(), app = creatorApp(), a = app.auth();
  let cred;
  try{ cred = await a.createUserWithEmailAndPassword(managedEmail(code, u), studentPass(code, pw)); }
  catch(e){ if(e.code==='auth/email-already-in-use'){ used.add(u); return createStudentAccount(code, name, used); } throw e; }
  const uid = cred.user.uid;
  await app.firestore().collection('students').doc(uid).set({name, classCode: code, username: u, createdAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
  await a.signOut();
  await T.db.collection('classes').doc(code).collection('roster').doc(u).set({name, username: u, password: pw, uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  used.add(u);
  return {name, username: u, password: pw, uid};
}

/* ---------- Bảng điểm (sổ điểm) ---------- */
const GR_SKILL = {L:'Listening', R:'Reading', P:'Listening Part 1', S:'Speaking', W:'Writing Task 1', I:'IELTS'};
const GR_LEARN_METRIC = {done:'Hoàn thành (TB 4 phần)', learn:'Learn %', game:'Game %', practice:'Practice %', review:'Review (đã thuộc) %', pr:'Practice – tỉ lệ đúng', gm:'Game – tỉ lệ đúng', dc:'Chính tả (Listening) – điểm', st:'Đặt câu (Writing) – điểm', us:'Dùng từ – tỉ lệ đúng'};
function grTen(x){ if(!x || !x.tot) return null; return x.test && x.ten!=null ? +x.ten : Math.round(x.sc/x.tot*40)/4; }
function grCls(v, pct){ if(v==null) return 'e'; if(pct) v = v/10; return v>=8 ? 'g' : v>=6.5 ? 'b' : v>=5 ? 'y' : 'r'; }
function grFmt(v, pct){ if(v==null) return '–'; return pct ? Math.round(v) + '%' : (Math.round(v*100)/100).toString().replace('.', ','); }
function grSkillOf(id){ const m = /^PRE-([LRPSW])\d+$/.exec(id); return m ? m[1] : 'I'; }
function grUnitsOf(sk){ return CATALOG.filter(c=> grSkillOf(c.id)===sk).sort((a,b)=> (+(a.id.match(/\d+$/)||[0])[0]) - (+(b.id.match(/\d+$/)||[0])[0])); }
function grTopic(s, id){ return (sumOf(s).topics||[]).find(t=> t.id===id); }
function grLearnVal(tp, m){
  if(!tp) return null;
  if(m==='done'){ const sc = tp.sec||{}; return Math.round(((sc.learn||0)+(sc.game||0)+(sc.practice||0)+(sc.review||0))/4); }
  if(['learn','game','practice','review'].includes(m)) return (tp.sec||{})[m] ?? null;
  return (tp.acc||{})[m] ?? null;
}
function grAvg(a){ const v = a.filter(x=> x!=null); return v.length ? v.reduce((p,q)=>p+q,0)/v.length : null; }
function grTestCols(part, skill, unit){
  const cols = [];
  Object.keys(RT_LIST).filter(tid=> /^PRE-[LRW]\d+$/.test(tid)).sort((a,b)=> a[4]===b[4] ? +a.slice(5) - +b.slice(5) : 'LRW'.indexOf(a[4]) - 'LRW'.indexOf(b[4])).forEach(tid=>{
    const sk = tid[4], un = tid.slice(5);
    if(skill!=='all' && skill!==sk) return;
    if(unit!=='all' && unit!==tid) return;
    (RT_LIST[tid][part]||[]).forEach((p,i)=> cols.push({key:`${tid}|${part}|${p.id}`, tid, short: part==='test' ? `${sk}${un}` : `${sk}${un}·${i+1}`, title: part==='test' ? `${GR_SKILL[sk]} Unit ${un} – Vocabulary Test` : `${topicName(tid)} – ${p.title}`, n:p.n}));
  });
  return cols;
}
function renderGrades(){
  if(!T.cls) return;
  const g = T.gr; g.mode = g.mode || 'overview'; g.lskill = g.lskill || 'L'; g.metric = g.metric || 'done';
  const chip = (k,v,l)=> `<button class="gchip${g[k]===v?' on':''}" data-gk="${k}" data-gv="${v}">${l}</button>`;
  let cols = [], rows = [], pct = false, filters = '', note = '';
  const studs = T.students.slice();
  if(g.mode==='overview'){
    pct = true;
    cols = [
      {short:'Từ đã học', title:'Số từ đã học (Learn/Game)', fmt:'n', get:s=> sumOf(s).learned ?? null},
      {short:'Đã thuộc', title:'Số từ đã thuộc', fmt:'n', get:s=> sumOf(s).mastered ?? null},
      {short:'Learn', title:'Learn – % trung bình các unit đã học', get:s=> grAvg((sumOf(s).topics||[]).map(t=>(t.sec||{}).learn))},
      {short:'Game', title:'Game – % trung bình các unit đã học', get:s=> grAvg((sumOf(s).topics||[]).map(t=>(t.sec||{}).game))},
      {short:'Practice', title:'Practice – % hoàn thành trung bình', get:s=> grAvg((sumOf(s).topics||[]).map(t=>(t.sec||{}).practice))},
      {short:'Review', title:'Review – % từ đã thuộc trung bình', get:s=> grAvg((sumOf(s).topics||[]).map(t=>(t.sec||{}).review))},
      {short:'Practice đúng', title:'Tỉ lệ làm đúng ở Practice', get:s=> grAvg((sumOf(s).topics||[]).map(t=>(t.acc||{}).pr))},
      {short:'Game đúng', title:'Tỉ lệ đúng khi chơi game', get:s=> sumOf(s).gameAcc ?? grAvg((sumOf(s).topics||[]).map(t=>(t.acc||{}).gm))},
      {short:'Vocab Test', title:'Vocabulary Test – điểm TB /10', ten:true, get:s=> grAvg(Object.values(rdOf(s)).filter(x=>x.part==='test').map(grTen))},
      {short:'Pre-Reading', title:'Pre-Reading – điểm TB /10', ten:true, get:s=> grAvg(Object.values(rdOf(s)).filter(x=>x.part==='pre').map(grTen))},
      {short:'Post-Reading', title:'Post-Reading – điểm TB /10', ten:true, get:s=> grAvg(Object.values(rdOf(s)).filter(x=>x.part==='post').map(grTen))},
      {short:'Chuỗi ngày', title:'Số ngày học liên tiếp', fmt:'n', get:s=> sumOf(s).streak ?? null},
      {short:'Học gần nhất', title:'Lần học gần nhất', fmt:'date', get:s=> lastMs(s) || null},
    ];
    rows = studs.map(s=>({s, cells: cols.map(c=>({v: c.get(s), c}))}));
    note = 'Phần trăm Learn/Game/Practice/Review là trung bình các unit em đã bắt đầu học. Điểm bài test và Reading là lần làm đầu tiên, thang 10.';
  } else if(g.mode==='asg'){
    pct = true;
    cols = T.assignments.slice().sort((a,b)=> String(a.due||'').localeCompare(String(b.due||''))).map((a,i)=>({short: (a.title || `Bài ${i+1}`).slice(0,18), title: `${a.title || (a.topicIds||[]).map(topicName).join(', ')} — hạn ${(a.due||'').split('-').reverse().join('/')} — ${asgItems(a).map(asgItemName).join(', ')}`, a}));
    rows = studs.map(s=>({s, cells: cols.map(c=>({v: asgPct(s, c.a), c, asg:c.a}))}));
    note = 'Mỗi cột là một bài đã giao: % hoàn thành tính <b>chỉ trên các phần cô chọn</b> khi giao bài. <b>≥ 80% là hoàn thành</b> (ô xanh lá). Bấm vào ô để xem em đó còn thiếu phần nào.';
  } else if(g.mode==='learn'){
    pct = true;
    const units = grUnitsOf(g.lskill);
    filters = `<div>${Object.keys(GR_SKILL).filter(k=> grUnitsOf(k).length).map(k=> chip('lskill', k, GR_SKILL[k])).join('')}</div>
      <div><select id="grMetric">${Object.entries(GR_LEARN_METRIC).map(([k,l])=>`<option value="${k}" ${g.metric===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
    cols = units.map(u=>({short: (u.id.match(/\d+$/)||[''])[0] ? `${g.lskill==='I'?'':g.lskill}${(u.id.match(/\d+$/)||[''])[0]}` : u.id, title: u.label, id:u.id}));
    if(g.lskill==='I') cols.forEach((c,i)=> c.short = String(i+1));
    rows = studs.map(s=>({s, cells: cols.map(c=>({v: grLearnVal(grTopic(s, c.id), g.metric), tp: grTopic(s, c.id), c}))}));
    note = `Đang xem: <b>${GR_LEARN_METRIC[g.metric]}</b> theo từng unit. Ô “–” là em chưa học unit đó (hoặc chưa làm phần này).`;
  } else {
    filters = `<div>${g.mode==='test' ? chip('skill','all','Tất cả')+chip('skill','L','🎧 Listening')+chip('skill','R','📖 Reading')+chip('skill','W','📊 Writing') : ''}</div>`;
    cols = grTestCols(g.mode, g.mode==='test' ? g.skill : 'R', g.unit);
    rows = studs.map(s=>{ const R = rdOf(s); return {s, cells: cols.map(c=>{ const x = R[c.key]; return {x, v: grTen(x), c}; })}; });
    const unitOpts = [...new Set(cols.map(c=>c.tid))];
    if(g.unit==='all' || unitOpts.length>1 || g.unit!=='all') filters += `<div><select id="grUnit"><option value="all">Tất cả unit</option>${[...new Set(grTestCols(g.mode, g.mode==='test' ? g.skill : 'R', 'all').map(c=>c.tid))].map(tid=>`<option value="${tid}" ${g.unit===tid?'selected':''}>${esc(topicName(tid))}</option>`).join('')}</select></div>`;
    note = 'Điểm là <b>lần làm đầu tiên</b>, quy về thang 10. 🚫 = rời trang hoặc bỏ dở khi làm bài. Bấm vào ô điểm để xem chi tiết.';
  }
  // trung bình mỗi học sinh (chỉ cột điểm/%; bỏ cột số lượng, ngày)
  const scoreCols = cols.map(c=> !c.fmt);
  rows.forEach(r=>{
    const vs = r.cells.filter((c,i)=> scoreCols[i] && c.v!=null).map(c=> (g.mode==='overview' && c.c.ten) ? c.v*10 : c.v);
    r.avg = vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null; r.done = r.cells.filter((c,i)=> scoreCols[i] && c.v!=null).length;
    r.viol = r.cells.reduce((a,c)=> a + (c.x ? (c.x.viol||0) + (c.x.end && c.x.end!=='done' ? 1 : 0) : 0), 0);
  });

async function grExport(cols, rows, colAvg, classAvg, avgPct){
  const val = (v, c)=> v==null ? '' : c && c.fmt==='date' ? fmtDate(v) : Math.round(v*100)/100;
  const head = ['Học sinh', avgPct ? 'TB (%)' : 'TB (/10)', ...cols.map(c=> c.title)];
  const data = [head, ...rows.map(r=> [r.s.name, val(r.avg), ...r.cells.map((c,i)=> val(c.v, cols[i]))]),
    ['Trung bình lớp', val(classAvg), ...colAvg.map((c,i)=> cols[i].fmt==='date' ? '' : val(c.avg))]];
  const name = `BangDiem_${T.cls.code}_${({asg:'BaiDaGiao', overview:'TongQuan', learn:'HocTu_'+T.gr.lskill+'_'+T.gr.metric, test:'VocabTest', pre:'PreReading', post:'PostReading'})[T.gr.mode]}`;
  try{
    if(!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
    const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:24},{wch:9}, ...cols.map(()=>({wch:14}))];
    XLSX.utils.book_append_sheet(wb, ws, 'Bảng điểm'); XLSX.writeFile(wb, name + '.xlsx');
  }catch(e){
    const csv = '﻿' + data.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = name + '.csv'; a.click();
  }
}

      <div class="card"><h3>Từ cả lớp hay sai</h3><p class="muted">Xếp theo số học sinh sai nhiều.</p>
        ${topWeak.length ? `<table><thead><tr><th>Từ</th><th>Unit</th><th>Số em sai</th><th>Tổng lần sai</th></tr></thead><tbody>
        ${topWeak.map(w=>`<tr><td><b>${esc(w.w)}</b></td><td class="muted">${esc(topicName(w.t))}</td><td>${w.who}</td><td>${w.n}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Chưa có dữ liệu.</p>'}
      </div>
      <div class="card"><h3>Chưa học từ 7 ngày trở lên (${idle.length})</h3>
        ${idle.length ? idle.map(s=>`<div>${esc(s.name)} <span class="muted">— ${lastMs(s)?fmtDate(lastMs(s)):'chưa học lần nào'}</span></div>`).join('') : '<p class="muted">Cả lớp đều học đều. 👏</p>'}
      </div>
    </div>
    <div class="card"><h3>Tiến độ trung bình theo unit</h3>
      ${units.length ? `<div class="tscroll"><table><thead><tr><th>Unit</th><th>Số em đã học</th><th>Learn</th><th>Game</th><th>Practice</th><th>Review</th></tr></thead><tbody>
      ${units.map(u=>`<tr><td>${esc(topicName(u.id))}</td><td>${u.n}/${T.students.length}</td>${Object.keys(PARTS).map(p=>`<td>${bar(Math.round(u[p]/u.n))}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">Chưa có dữ liệu.</p>'}
      <div style="margin-top:10px"><button class="btn small" id="xls2">⬇ Xuất Excel cả lớp</button></div>
    </div>`;
  $('xls2').onclick = exportExcel;
}

/* ---------- Quản lý lớp ---------- */
function renderClasses(){
  $('panel').innerHTML = `<div class="card"><h3>Các lớp của trung tâm</h3>
    ${T.classes.length ? `<table><thead><tr><th>Mã lớp</th><th>Tên lớp</th><th>Ghi chú</th><th></th></tr></thead><tbody>
    ${T.classes.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.name||'')}</td><td class="muted">${esc(c.note||'')}</td>
      <td style="white-space:nowrap"><button class="btn small" data-open="${esc(c.code)}">Mở</button> <button class="btn small" data-edit="${esc(c.code)}">Sửa</button> <button class="btn small danger" data-delc="${esc(c.code)}">Xóa</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="muted">Chưa có lớp nào.</p>'}
    <div style="margin-top:12px"><button class="btn dark" id="btnNew2">＋ Tạo lớp mới</button></div></div>`;
  $('btnNew2').onclick = newClassDialog;
  $('panel').querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{ $('clsSel').value = b.dataset.open; T.tab='students'; $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.t==='students')); loadClass(b.dataset.open); });
  $('panel').querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> newClassDialog(T.classes.find(c=>c.code===b.dataset.edit)));
  $('panel').querySelectorAll('[data-delc]').forEach(b=> b.onclick = async ()=>{
    if(!confirm(`Xóa lớp ${b.dataset.delc}? Học sinh sẽ không vào lớp này được nữa (tiến độ của các em vẫn giữ trong mục Học sinh).`)) return;
    await T.db.collection('classes').doc(b.dataset.delc).delete(); loadClasses();
  });
}
function newClassDialog(edit){
  edit = edit && edit.code ? edit : null;
  modal(`<h2>${edit ? 'Sửa lớp ' + esc(edit.code) : 'Tạo lớp mới'}</h2>
    <label class="f"><span>Mã lớp (học sinh nhập mã này, viết liền không dấu)</span><input id="cCode" maxlength="20" placeholder="VD: TH-K1" ${edit?'disabled':''} value="${esc(edit?edit.code:'')}" style="text-transform:uppercase"></label>
    <label class="f"><span>Tên lớp</span><input id="cName" maxlength="60" placeholder="VD: Pre-IELTS Tiền Hải K1 – Tối 2-4-6" value="${esc(edit?edit.name||'':'')}"></label>
    <label class="f"><span>Ghi chú</span><input id="cNote" maxlength="120" value="${esc(edit?edit.note||'':'')}"></label>
    <label class="f" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="cManaged" ${!edit || edit.managed!==false ? 'checked' : ''} style="width:auto;margin-top:4px"><span><b>Cô cấp tài khoản cho học sinh</b> (khuyên dùng). Bỏ chọn nếu muốn học sinh tự đăng ký bằng họ tên + PIN.</span></label>
    <div class="err" id="cErr"></div>
    <div style="display:flex;gap:8px"><button class="btn primary" id="cSave">Lưu</button><button class="btn" onclick="closeModal()">Hủy</button></div>`);
  $('cSave').onclick = async ()=>{
    const code = edit ? edit.code : $('cCode').value.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/Đ/g,'D').replace(/[^A-Z0-9-]/g,'');
    if(code.length < 3) return $('cErr').textContent = 'Mã lớp cần ít nhất 3 ký tự (chữ, số, gạch nối).';
    if(!edit && T.classes.some(c=>c.code===code)) return $('cErr').textContent = 'Mã lớp này đã có.';
    await T.db.collection('classes').doc(code).set({name: $('cName').value.trim(), note: $('cNote').value.trim(), managed: $('cManaged').checked,
      ...(edit ? {} : {createdAt: firebase.firestore.FieldValue.serverTimestamp()})}, {merge:true});
    closeModal(); loadClasses(code);
  };
}

/* ---------- Xuất Excel ---------- */
async function exportExcel(){
  const rows = [['Học sinh','Lớp','Học gần nhất','Đã học','Đã thuộc','Learn %','Game %','Practice %','Review %','Chuỗi ngày','Level','Điểm']];
  T.students.forEach(s=>{ const m = sumOf(s); rows.push([s.name, s.classCode, fmtDate(lastMs(s)), m.learned||0, m.mastered||0, avgSec(s,'learn')||0, avgSec(s,'game')||0, avgSec(s,'practice')||0, avgSec(s,'review')||0, m.streak||0, m.level||1, m.score||0]); });
  const unitRows = [['Học sinh','Unit','Đã học','Tổng từ','Đã thuộc','Learn %','Game %','Practice %','Review %']];
  T.students.forEach(s=> (sumOf(s).topics||[]).forEach(t=> unitRows.push([s.name, topicName(t.id), t.learned, t.total, t.mastered, t.sec.learn||0, t.sec.game||0, t.sec.practice||0, t.sec.review||0])));
  const asgRows = [['Bài giao','Hạn','Học sinh','Tiến độ %','Trạng thái']];
  T.assignments.forEach(a=> T.students.forEach(s=>{ const p = asgPct(s,a); asgRows.push([a.title || (a.topicIds||[]).map(topicName).join(', '), a.due, s.name, p, p>=80?'Hoàn thành':(a.due && a.due<today())?'Trễ hạn':'Chưa xong']); }));
  const rdRows = [['Học sinh','Unit','Phần','Bài','Số câu đúng','Tổng','%','Điểm /10','Thời gian (giây)','Rời trang','Kết thúc','Số lần làm','Tự luận']];
  T.students.forEach(s=> Object.values(rdOf(s)).forEach(x=> rdRows.push([s.name, topicName(x.tid), RT_PART[x.part]||x.part, x.title, x.sc, x.tot, x.tot?Math.round(x.sc/x.tot*100):0, x.test ? x.ten : '', x.dur||0, x.viol||0,
    ({done:'Nộp bình thường', viol:'Tự nộp do rời trang', abandoned:'Bỏ dở', left:'Thoát giữa chừng'})[x.end]||x.end, x.tries||1, (x.open||[]).map((o,i)=>`${i+1}. ${o.a||'(trống)'}`).join(' | ')])));
  try{
    if(!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Tổng quan');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(unitRows), 'Theo unit');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(asgRows), 'Bài giao');
    if(rdRows.length>1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rdRows), 'Pre-Post Reading');
    XLSX.writeFile(wb, `IVY-Word-Quest_${T.cls.code}_${today()}.xlsx`);
  }catch(e){
    const csv = '﻿' + rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = `IVY-Word-Quest_${T.cls.code}.csv`; a.click();
  }
}

function modal(html){ $('modalBox').innerHTML = html; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
boot().catch(e=>{ document.body.insertAdjacentHTML('beforeend', `<div class="wrap"><div class="card err">Không tải được Firebase (${esc(e.message)}). Kiểm tra mạng rồi tải lại trang.</div></div>`); });
</script>
</body>
</html>
