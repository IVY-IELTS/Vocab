<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang giáo viên · IVY Word Quest</title>
<style>
:root{--ink:#1F2B3A;--soft:#54627A;--paper:#F2EEE3;--card:#FBF8F0;--line:#E5DDCB;--rust:#C0562C;--moss:#2C8443;--danger:#B0463C;--navy:#22344A;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
a{color:var(--rust)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.top h1{font-size:26px} .top h1 em{color:var(--rust)}
.top .grow{flex:1}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:9px 16px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.small{font-size:12.5px;padding:6px 12px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.login{max-width:420px;margin:60px auto}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px;font-weight:600}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:10px 12px;border:1.5px solid #D5CCB8;border-radius:10px;background:#fff}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
.ok{color:var(--moss)}
.classbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.classbar select{width:auto;min-width:240px}
.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{font:inherit;font-weight:700;border:none;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--soft)}
.tabs button.on{background:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpis b{display:block;font-family:Georgia,serif;font-size:26px}
.kpis span{font-size:12.5px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid #EEE7D6;text-align:left;vertical-align:top}
th{background:#22344A;color:#fff;font-weight:600;font-size:12.5px;position:sticky;top:0;cursor:pointer;white-space:nowrap}
tr.click:hover td{background:#FFF7EC;cursor:pointer}
.bar{height:8px;background:#EEE7D6;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--moss)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.g{background:#DDF3E2;color:#226B38}.pill.r{background:#F8DAD6;color:#8F2E24}.pill.y{background:#FFF0C2;color:#8A6510}.pill.n{background:#EEE;color:#666}
.muted{color:var(--soft);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:20}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:18px;max-width:900px;width:100%;padding:22px}
.tscroll{overflow:auto;max-height:70vh;border-radius:12px}
.chips label{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0;font-size:14px}
.chips input{width:auto}
.topicpick{max-height:260px;overflow:auto;background:#fff;border:1.5px solid #D5CCB8;border-radius:10px;padding:8px 12px}
.topicpick h4{margin:10px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust)}
.topicpick label{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.topicpick input{width:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>IVY <em>Word Quest</em> · Trang giáo viên</h1>
    <div class="grow"></div>
    <a class="btn" href="./">← Về trang học</a>
    <span id="who" class="muted"></span>
    <button class="btn small" id="btnOut" style="display:none">Đăng xuất</button>
  </div>

  <div id="viewSetup" class="card" style="display:none">
    <h2>Chưa kết nối lớp học trực tuyến</h2>
    <p class="muted">Web chưa có cấu hình Firebase. Cô gửi đoạn <code>firebaseConfig</code> cho Claude để kết nối.</p>
  </div>

  <div id="viewLogin" class="card login" style="display:none">
    <h2>Đăng nhập giáo viên</h2>
    <p class="muted">Dùng email giáo viên đã được cấp quyền. Lần đầu, bấm <b>Tạo tài khoản</b> và tự đặt mật khẩu (ít nhất 6 ký tự).</p>
    <label class="f"><span>Email</span><input id="tEmail" type="email" autocomplete="username"></label>
    <label class="f"><span>Mật khẩu</span><input id="tPass" type="password" autocomplete="current-password"></label>
    <div class="err" id="tErr"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn primary" id="tIn">Đăng nhập</button>
      <button class="btn" id="tUp">Tạo tài khoản</button>
      <button class="btn small" id="tReset">Quên mật khẩu</button>
    </div>
  </div>

  <div id="viewMain" style="display:none">
    <div class="card classbar">
      <b>Lớp:</b>
      <select id="clsSel"></select>
      <button class="btn small dark" id="btnNewCls">＋ Tạo lớp mới</button>
      <button class="btn small" id="btnRefresh">↻ Tải lại</button>
      <div style="flex:1"></div>
      <span class="muted" id="clsInfo"></span>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="students" class="on">👩‍🎓 Học sinh</button>
      <button data-t="assign">📌 Giao bài</button>
      <button data-t="stats">📊 Thống kê</button>
      <button data-t="reading">📖 Pre/Post-Reading</button>
      <button data-t="classes">🏫 Quản lý lớp</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const FIREBASE_CONFIG = {"apiKey":"AIzaSyBbCCN3nxizNFFT6IIXGaJrqoUdz9s6D2g","authDomain":"ivy-ielts.firebaseapp.com","projectId":"ivy-ielts","storageBucket":"ivy-ielts.firebasestorage.app","messagingSenderId":"769366720144","appId":"1:769366720144:web:b8985b867c51f73bdca215"};
const CATALOG = [{"id":"Environment","label":"IELTS Reading · Environment","n":8,"group":"IELTS · Chủ đề"},{"id":"Education","label":"IELTS Reading · Education","n":8,"group":"IELTS · Chủ đề"},{"id":"Health","label":"IELTS Reading · Health","n":8,"group":"IELTS · Chủ đề"},{"id":"Technology","label":"IELTS Reading · Technology","n":8,"group":"IELTS · Chủ đề"},{"id":"Society","label":"IELTS Reading · Society","n":8,"group":"IELTS · Chủ đề"},{"id":"Family","label":"IELTS Reading · Family","n":44,"group":"IELTS · Chủ đề"},{"id":"PRE-L1","label":"Pre-IELTS Listening · Unit 1 Friends Abroad","n":34,"group":"Pre-IELTS · Listening"},{"id":"PRE-L2","label":"Pre-IELTS Listening · Unit 2 Hobbies, Interests and Sports","n":24,"group":"Pre-IELTS · Listening"},{"id":"PRE-L3","label":"Pre-IELTS Listening · Unit 3 Academic and Personal Interests","n":34,"group":"Pre-IELTS · Listening"},{"id":"PRE-L4","label":"Pre-IELTS Listening · Unit 4 On-Campus Services","n":39,"group":"Pre-IELTS · Listening"},{"id":"PRE-L5","label":"Pre-IELTS Listening · Unit 5 Studying, Exams and Revision","n":60,"group":"Pre-IELTS · Listening"},{"id":"PRE-L6","label":"Pre-IELTS Listening · Unit 6 Work","n":56,"group":"Pre-IELTS · Listening"},{"id":"PRE-L7","label":"Pre-IELTS Listening · Unit 7 Shopping and Spending","n":37,"group":"Pre-IELTS · Listening"},{"id":"PRE-L8","label":"Pre-IELTS Listening · Unit 8 Comparing Cultures","n":41,"group":"Pre-IELTS · Listening"},{"id":"PRE-L9","label":"Pre-IELTS Listening · Unit 9 Work-Life Balance","n":62,"group":"Pre-IELTS · Listening"},{"id":"PRE-L10","label":"Pre-IELTS Listening · Unit 10 Food and Cooking","n":52,"group":"Pre-IELTS · Listening"},{"id":"PRE-R1","label":"Pre-IELTS Reading · Unit 1 Family and Friends","n":40,"group":"Pre-IELTS · Reading"},{"id":"PRE-R2","label":"Pre-IELTS Reading · Unit 2 Traveling Around the World","n":41,"group":"Pre-IELTS · Reading"},{"id":"PRE-R3","label":"Pre-IELTS Reading · Unit 3 Being Human","n":47,"group":"Pre-IELTS · Reading"},{"id":"PRE-R4","label":"Pre-IELTS Reading · Unit 4 Business and Finance","n":63,"group":"Pre-IELTS · Reading"},{"id":"PRE-R5","label":"Pre-IELTS Reading · Unit 5 Conservation","n":54,"group":"Pre-IELTS · Reading"},{"id":"PRE-R6","label":"Pre-IELTS Reading · Unit 6 Transportation and Infrastructure","n":58,"group":"Pre-IELTS · Reading"},{"id":"PRE-R7","label":"Pre-IELTS Reading · Unit 7 Nature","n":57,"group":"Pre-IELTS · Reading"},{"id":"PRE-R8","label":"Pre-IELTS Reading · Unit 8 Job","n":49,"group":"Pre-IELTS · Reading"},{"id":"PRE-R9","label":"Pre-IELTS Reading · Unit 9 Education","n":55,"group":"Pre-IELTS · Reading"},{"id":"PRE-R10","label":"Pre-IELTS Reading · Unit 10 Food","n":58,"group":"Pre-IELTS · Reading"},{"id":"PRE-P1","label":"Listening Part 1 · Student Life · Phần 1","n":42,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P2","label":"Listening Part 1 · Student Life · Phần 2","n":46,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P3","label":"Listening Part 1 · Student Life · Phần 3","n":16,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P4","label":"Listening Part 1 · Travel and Transport · Phần 1","n":48,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P5","label":"Listening Part 1 · Travel and Transport · Phần 2","n":33,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P6","label":"Listening Part 1 · Services and Amenities · Phần 1","n":44,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P7","label":"Listening Part 1 · Services and Amenities · Phần 2","n":35,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P8","label":"Listening Part 1 · Daily Activities · Phần 1","n":32,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P9","label":"Listening Part 1 · Daily Activities · Phần 2","n":32,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P10","label":"Listening Part 1 · Daily Activities · Phần 3","n":34,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P11","label":"Listening Part 1 · Daily Activities · Phần 4","n":37,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P12","label":"Listening Part 1 · Daily Activities · Phần 5","n":35,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P13","label":"Listening Part 1 · Daily Activities · Phần 6","n":35,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P14","label":"Listening Part 1 · Daily Activities · Phần 7","n":18,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-P15","label":"Listening Part 1 · Health and Medical","n":42,"group":"Pre-IELTS · Listening Part 1"},{"id":"PRE-S1","label":"Pre-IELTS Speaking · Unit 1 Hobbies and Interests","n":60,"group":"Pre-IELTS · Speaking"},{"id":"PRE-W1","label":"Pre-IELTS Writing Task 1 · Unit 1 Introduction to Writing Task 1","n":83,"group":"Pre-IELTS · Writing Task 1"},{"id":"PRE-W2","label":"Pre-IELTS Writing Task 1 · Unit 2 Interpreting Charts & Comparing Data","n":52,"group":"Pre-IELTS · Writing Task 1"},{"id":"PRE-W3","label":"Pre-IELTS Writing Task 1 · Unit 3 Static Charts - Describing Data","n":64,"group":"Pre-IELTS · Writing Task 1"},{"id":"PRE-W4","label":"Pre-IELTS Writing Task 1 · Unit 4 Dynamic Charts: Trends and Overviews","n":84,"group":"Pre-IELTS · Writing Task 1"},{"id":"PRE-W5","label":"Pre-IELTS Writing Task 1 · Unit 5 Dynamic Charts: Line, Bar & Table","n":78,"group":"Pre-IELTS · Writing Task 1"},{"id":"PRE-W6","label":"Pre-IELTS Writing Task 1 · Unit 6 Dynamic Charts: Pie & Table","n":62,"group":"Pre-IELTS · Writing Task 1"}];
const FB_VER = '10.12.2';
const PARTS = {learn:'Learn', game:'Game', practice:'Practice', review:'Review'};
const T = {db:null, auth:null, classes:[], cls:null, students:[], assignments:[], tab:'students', sort:{k:'name', d:1}};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topicName = id => { const t = CATALOG.find(x=>x.id===id); return t ? t.label : id; };
const fmtDate = ms => { if(!ms) return '—'; const d = new Date(ms); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); };
const daysAgo = ms => ms ? Math.floor((Date.now()-ms)/86400000) : null;
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(src)); document.head.appendChild(s); }); }
function show(id){ ['viewSetup','viewLogin','viewMain'].forEach(v=> $(v).style.display = v===id ? '' : 'none'); }
function tErr(m, ok){ $('tErr').className = 'err' + (ok ? ' ok' : ''); $('tErr').textContent = m; }
function authMsg(e){
  const c = e && e.code || '';
  return ({'auth/invalid-email':'Email không hợp lệ.','auth/email-already-in-use':'Email này đã có tài khoản, cô bấm Đăng nhập.',
    'auth/weak-password':'Mật khẩu cần ít nhất 6 ký tự.','auth/invalid-credential':'Email hoặc mật khẩu chưa đúng.',
    'auth/wrong-password':'Mật khẩu chưa đúng.','auth/user-not-found':'Chưa có tài khoản với email này, cô bấm Tạo tài khoản.',
    'auth/too-many-requests':'Thử sai nhiều lần, đợi vài phút rồi thử lại.','auth/network-request-failed':'Không có mạng.'})[c] || ('Lỗi: ' + (c || e.message));
}

async function boot(){
  if(!FIREBASE_CONFIG){ show('viewSetup'); return; }
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'), loadScript(base+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FIREBASE_CONFIG);
  T.auth = firebase.auth(); T.db = firebase.firestore();
  T.auth.onAuthStateChanged(async u=>{
    if(!u || /@hocsinh\./.test(u.email||'')){ $('who').textContent=''; $('btnOut').style.display='none'; show('viewLogin'); return; }
    $('who').textContent = u.email; $('btnOut').style.display = '';
    show('viewMain');
    await loadClasses();
  });
  $('tIn').onclick = ()=> T.auth.signInWithEmailAndPassword($('tEmail').value.trim(), $('tPass').value).catch(e=> tErr(authMsg(e)));
  $('tUp').onclick = ()=> T.auth.createUserWithEmailAndPassword($('tEmail').value.trim(), $('tPass').value).catch(e=> tErr(authMsg(e)));
  $('tReset').onclick = ()=>{ const em = $('tEmail').value.trim(); if(!em) return tErr('Cô nhập email trước.'); T.auth.sendPasswordResetEmail(em).then(()=> tErr('Đã gửi email đặt lại mật khẩu.', true)).catch(e=> tErr(authMsg(e))); };
  $('tPass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('tIn').click(); });
  $('btnOut').onclick = ()=> T.auth.signOut();
  $('btnNewCls').onclick = newClassDialog;
  $('btnRefresh').onclick = ()=> loadClass(T.cls && T.cls.code);
  $('clsSel').onchange = ()=> loadClass($('clsSel').value);
  $('tabs').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ T.tab = b.dataset.t; $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); render(); });
}

async function loadClasses(sel){
  try{
    const qs = await T.db.collection('classes').get();
    T.classes = qs.docs.map(d=>({code:d.id, ...d.data()})).sort((a,b)=> a.code.localeCompare(b.code));
  }catch(e){
    $('panel').innerHTML = `<div class="card"><h3>Tài khoản này chưa có quyền giáo viên</h3><p class="muted">Email <b>${esc(T.auth.currentUser.email)}</b> chưa nằm trong danh sách giáo viên của Firestore. Cô nhắn Claude để thêm email này vào quy tắc bảo mật.</p></div>`;
    return;
  }
  $('clsSel').innerHTML = T.classes.length ? T.classes.map(c=>`<option value="${esc(c.code)}">${esc(c.code)} — ${esc(c.name||'')}</option>`).join('') : '<option value="">(chưa có lớp)</option>';
  const code = sel || (T.cls && T.cls.code) || localStorage.getItem('ivyT_cls') || (T.classes[0]||{}).code;
  if(code && T.classes.some(c=>c.code===code)){ $('clsSel').value = code; await loadClass(code); }
  else { T.cls = null; T.students = []; T.assignments = []; render(); }
}
async function loadClass(code){
  if(!code){ T.cls = null; render(); return; }
  localStorage.setItem('ivyT_cls', code);
  T.cls = T.classes.find(c=>c.code===code);
  $('panel').innerHTML = '<div class="card muted">Đang tải dữ liệu lớp…</div>';
  const [st, as] = await Promise.all([
    T.db.collection('students').where('classCode','==',code).get(),
    T.db.collection('classes').doc(code).collection('assignments').get()
  ]);
  T.students = st.docs.map(d=>({uid:d.id, ...d.data()}));
  T.assignments = as.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> String(b.due||'').localeCompare(String(a.due||'')));
  $('clsInfo').textContent = `${T.students.length} học sinh · ${T.assignments.length} bài giao`;
  render();
}
function sumOf(s){ return s.summary || {}; }
function avgSec(s, part, ids){
  const tp = (sumOf(s).topics||[]).filter(t=> !ids || ids.includes(t.id));
  if(!ids && !tp.length) return null;
  const list = ids ? ids.map(id=> (tp.find(t=>t.id===id)||{sec:{}}).sec[part]||0) : tp.map(t=> t.sec[part]||0);
  return list.length ? Math.round(list.reduce((a,b)=>a+b,0)/list.length) : 0;
}
function asgPct(s, a){
  const parts = (a.parts && a.parts.length) ? a.parts : Object.keys(PARTS);
  const ids = a.topicIds || [];
  if(!ids.length) return 0;
  return Math.round(parts.reduce((x,p)=> x + avgSec(s, p, ids), 0) / parts.length);
}
function lastMs(s){ return s.clientUpdatedAt || (s.updatedAt && s.updatedAt.toMillis ? s.updatedAt.toMillis() : 0); }
function bar(p){ return p==null ? '<span class="muted">—</span>' : `<div style="display:flex;gap:6px;align-items:center"><div class="bar"><i style="width:${p}%"></i></div><small>${p}%</small></div>`; }

function render(){
  const P = $('panel');
  if(!T.cls && T.tab!=='classes'){ P.innerHTML = `<div class="card"><h3>Chưa có lớp nào</h3><p class="muted">Bấm <b>＋ Tạo lớp mới</b> để tạo lớp đầu tiên, rồi gửi <b>mã lớp</b> cho học sinh.</p></div>`; return; }
  ({students:renderStudents, assign:renderAssign, stats:renderStats, reading:renderReading, classes:renderClasses})[T.tab]();
}

/* ---------- Học sinh ---------- */
function renderStudents(){
  const S = T.students.slice();
  const k = T.sort.k, d = T.sort.d;
  const val = s => ({name: s.name||'', last: lastMs(s), learned: sumOf(s).learned||0, mastered: sumOf(s).mastered||0,
    learn: avgSec(s,'learn')||0, game: avgSec(s,'game')||0, practice: avgSec(s,'practice')||0, review: avgSec(s,'review')||0, streak: sumOf(s).streak||0})[k];
  S.sort((a,b)=>{ const x = val(a), y = val(b); return (typeof x==='string' ? x.localeCompare(y,'vi') : x-y) * d; });
  const active7 = T.students.filter(s=> daysAgo(lastMs(s))!==null && daysAgo(lastMs(s))<=7).length;
  const avgLearned = T.students.length ? Math.round(T.students.reduce((a,s)=>a+(sumOf(s).learned||0),0)/T.students.length) : 0;
  $('panel').innerHTML = `
    <div class="kpis">
      <div><b>${T.students.length}</b><span>học sinh trong lớp</span></div>
      <div><b>${active7}</b><span>học trong 7 ngày qua</span></div>
      <div><b>${T.students.length-active7}</b><span>chưa học ≥ 7 ngày</span></div>
      <div><b>${avgLearned}</b><span>từ đã học (trung bình)</span></div>
    </div>
    <div class="card" style="padding:12px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
        <b>Mã lớp gửi học sinh: <span style="color:var(--rust);font-size:18px">${esc(T.cls.code)}</span></b>
        <span class="muted">Học sinh vào web → 🔑 Đăng nhập → nhập mã lớp, họ tên, PIN 4 số.</span>
        <div style="flex:1"></div><button class="btn small" id="xls1">⬇ Xuất Excel</button>
      </div>
      ${S.length ? `<div class="tscroll"><table><thead><tr>

/* ---------- Pre/Post-Reading ---------- */
const RT_PART = {pre:'Pre-Reading', post:'Post-Reading'};
function rdOf(s){ return (sumOf(s).reading) || {}; }
function rdDur(sec){ sec = sec||0; return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function rdFlags(r){
  const f = [];
  if(r.viol) f.push(`<span class="pill r">rời trang ${r.viol} lần</span>`);
  if(r.end==='viol') f.push('<span class="pill r">tự nộp do rời trang</span>');
  if(r.end==='abandoned') f.push('<span class="pill r">bỏ dở / tải lại trang</span>');
  if(r.end==='left') f.push('<span class="pill y">thoát giữa chừng</span>');
  if(r.paste) f.push(`<span class="pill y">thử dán ${r.paste} lần</span>`);
  return f.join(' ') || '<span class="pill g">bình thường</span>';
}
function rdKeys(){
  const m = {};
  T.students.forEach(s=> Object.entries(rdOf(s)).forEach(([k,r])=>{ if(!m[k]) m[k] = r; }));
  return Object.keys(m).sort().map(k=>({k, r:m[k]}));
}
function renderReading(){
  const keys = rdKeys();
  if(!keys.length){ $('panel').innerHTML = `<div class="card"><h3>Chưa có kết quả Pre/Post-Reading</h3><p class="muted">Học sinh vào unit Reading → mục <b>05 Pre-Reading</b> hoặc <b>06 Post-Reading</b> để làm bài. Kết quả <b>lần làm đầu tiên</b> của mỗi em sẽ hiện ở đây.</p></div>`; return; }
  $('panel').innerHTML = keys.map(({k,r})=>{
    const done = T.students.filter(s=> rdOf(s)[k]);
    const avg = done.length ? Math.round(done.reduce((a,s)=>{ const x = rdOf(s)[k]; return a + (x.tot ? x.sc/x.tot*100 : 0); },0)/done.length) : null;
    const flagged = done.filter(s=>{ const x = rdOf(s)[k]; return x.viol || (x.end && x.end!=='done'); }).length;
    return `<div class="card">
      <h3 style="margin:0 0 4px">${esc(r.title)}</h3>
      <p class="muted" style="margin:0 0 10px">${esc(topicName(r.tid))} · ${RT_PART[r.part]||r.part} · ${done.length}/${T.students.length} em đã làm${avg!=null?` · điểm TB ${avg}%`:''}${flagged?` · <b style="color:#8F2E24">${flagged} em cần chú ý</b>`:''}</p>
      <div class="tscroll"><table><thead><tr><th>Học sinh</th><th>Điểm lần đầu</th><th>Thời gian</th><th>Làm lúc</th><th>Chống gian lận</th><th>Số lần làm</th><th>Tự luận</th></tr></thead><tbody>
      ${T.students.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','vi')).map(s=>{ const x = rdOf(s)[k];
        if(!x) return `<tr><td><b>${esc(s.name)}</b></td><td colspan="6"><span class="pill n">chưa làm</span></td></tr>`;
        return `<tr><td><b>${esc(s.name)}</b></td><td>${x.sc}/${x.tot} ${bar(x.tot?Math.round(x.sc/x.tot*100):0)}</td><td>${rdDur(x.dur)}</td><td>${fmtDate(x.at)}</td><td>${rdFlags(x)}</td><td>${x.tries||1}${x.best!=null&&x.best>x.sc?` · tốt nhất ${x.best}/${x.tot}`:''}</td>
          <td>${(x.open||[]).length?`<button class="btn small" data-rd="${s.uid}|${esc(k)}">Xem ${(x.open||[]).length} câu</button>`:'—'}</td></tr>`; }).join('')}
      </tbody></table></div></div>`; }).join('') + `<p class="muted">Điểm chỉ tính câu trắc nghiệm, True/False và nối từ. Câu tự luận cô bấm "Xem" để đọc và chấm. "Rời trang" là số lần em chuyển tab hoặc mở ứng dụng khác khi đang làm bài.</p>`;
  $('panel').querySelectorAll('[data-rd]').forEach(b=> b.onclick = ()=>{ const [uid, ...rest] = b.dataset.rd.split('|'); rdOpen(T.students.find(s=>s.uid===uid), rest.join('|')); });
}
function rdOpen(s, k){
  const x = rdOf(s)[k]; if(!x) return;
  modal(`<div style="display:flex;align-items:center"><h2 style="flex:1">${esc(s.name)} · ${esc(x.title)}</h2><button class="btn small" onclick="closeModal()">Đóng</button></div>
    <p class="muted">${RT_PART[x.part]||x.part} · ${esc(topicName(x.tid))} · ${x.sc}/${x.tot} câu trắc nghiệm đúng · ${rdDur(x.dur)} · ${rdFlags(x)}</p>
    ${(x.open||[]).map((o,i)=>`<div style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0">
      <b>${i+1}. ${esc(o.q)}</b>
      <p style="margin:6px 0">${o.a ? esc(o.a) : '<i class="muted">(bỏ trống / hết giờ)</i>'}</p>
      <p class="muted" style="margin:0">Gợi ý đáp án: ${esc(o.m)}</p></div>`).join('')}
    ${(x.tf||[]).length ? `<h3>Câu True/False em sửa lại</h3><ul>${x.tf.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>` : ''}`);
}

/* ---------- Thống kê ---------- */
function renderStats(){
  const weak = {};
  T.students.forEach(s=> (sumOf(s).weak||[]).forEach(w=>{ const k = w.w; weak[k] = weak[k] || {w:k, t:w.t, n:0, who:0}; weak[k].n += w.n; weak[k].who++; }));
  const topWeak = Object.values(weak).sort((a,b)=> b.who-a.who || b.n-a.n).slice(0,25);
  const unitAgg = {};
  T.students.forEach(s=> (sumOf(s).topics||[]).forEach(t=>{
    const u = unitAgg[t.id] = unitAgg[t.id] || {id:t.id, n:0, learn:0, game:0, practice:0, review:0};
    u.n++; Object.keys(PARTS).forEach(p=> u[p] += t.sec[p]||0);
  }));
  const units = Object.values(unitAgg).sort((a,b)=> a.id.localeCompare(b.id));
  const idle = T.students.filter(s=> daysAgo(lastMs(s))===null || daysAgo(lastMs(s))>=7);
  $('panel').innerHTML = `
    <div class="grid2">
      <div class="card"><h3>Từ cả lớp hay sai</h3><p class="muted">Xếp theo số học sinh sai nhiều.</p>
        ${topWeak.length ? `<table><thead><tr><th>Từ</th><th>Unit</th><th>Số em sai</th><th>Tổng lần sai</th></tr></thead><tbody>
        ${topWeak.map(w=>`<tr><td><b>${esc(w.w)}</b></td><td class="muted">${esc(topicName(w.t))}</td><td>${w.who}</td><td>${w.n}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Chưa có dữ liệu.</p>'}
      </div>
      <div class="card"><h3>Chưa học từ 7 ngày trở lên (${idle.length})</h3>
        ${idle.length ? idle.map(s=>`<div>${esc(s.name)} <span class="muted">— ${lastMs(s)?fmtDate(lastMs(s)):'chưa học lần nào'}</span></div>`).join('') : '<p class="muted">Cả lớp đều học đều. 👏</p>'}
      </div>
    </div>
    <div class="card"><h3>Tiến độ trung bình theo unit</h3>
      ${units.length ? `<div class="tscroll"><table><thead><tr><th>Unit</th><th>Số em đã học</th><th>Learn</th><th>Game</th><th>Practice</th><th>Review</th></tr></thead><tbody>
      ${units.map(u=>`<tr><td>${esc(topicName(u.id))}</td><td>${u.n}/${T.students.length}</td>${Object.keys(PARTS).map(p=>`<td>${bar(Math.round(u[p]/u.n))}</td>`).join('')}</tr>`).join('')}

    </div>`;

}

  $('cSave').onclick = async ()=>{
    const code = edit ? edit.code : $('cCode').value.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/Đ/g,'D').replace(/[^A-Z0-9-]/g,'');
    if(code.length < 3) return $('cErr').textContent = 'Mã lớp cần ít nhất 3 ký tự (chữ, số, gạch nối).';
    if(!edit && T.classes.some(c=>c.code===code)) return $('cErr').textContent = 'Mã lớp này đã có.';
    await T.db.collection('classes').doc(code).set({name: $('cName').value.trim(), note: $('cNote').value.trim(),
      ...(edit ? {} : {createdAt: firebase.firestore.FieldValue.serverTimestamp()})}, {merge:true});
    closeModal(); loadClasses(code);
  };
}

/* ---------- Xuất Excel ---------- */
async function exportExcel(){
  const rows = [['Học sinh','Lớp','Học gần nhất','Đã học','Đã thuộc','Learn %','Game %','Practice %','Review %','Chuỗi ngày','Level','Điểm']];
  T.students.forEach(s=>{ const m = sumOf(s); rows.push([s.name, s.classCode, fmtDate(lastMs(s)), m.learned||0, m.mastered||0, avgSec(s,'learn')||0, avgSec(s,'game')||0, avgSec(s,'practice')||0, avgSec(s,'review')||0, m.streak||0, m.level||1, m.score||0]); });
  const unitRows = [['Học sinh','Unit','Đã học','Tổng từ','Đã thuộc','Learn %','Game %','Practice %','Review %']];
  T.students.forEach(s=> (sumOf(s).topics||[]).forEach(t=> unitRows.push([s.name, topicName(t.id), t.learned, t.total, t.mastered, t.sec.learn||0, t.sec.game||0, t.sec.practice||0, t.sec.review||0])));
  const asgRows = [['Bài giao','Hạn','Học sinh','Tiến độ %','Trạng thái']];
  T.assignments.forEach(a=> T.students.forEach(s=>{ const p = asgPct(s,a); asgRows.push([a.title || (a.topicIds||[]).map(topicName).join(', '), a.due, s.name, p, p>=80?'Hoàn thành':(a.due && a.due<today())?'Trễ hạn':'Chưa xong']); }));
  const rdRows = [['Học sinh','Unit','Phần','Bài','Điểm','Tổng','%','Thời gian (giây)','Rời trang','Kết thúc','Số lần làm','Tự luận']];
  T.students.forEach(s=> Object.values(rdOf(s)).forEach(x=> rdRows.push([s.name, topicName(x.tid), RT_PART[x.part]||x.part, x.title, x.sc, x.tot, x.tot?Math.round(x.sc/x.tot*100):0, x.dur||0, x.viol||0,
    ({done:'Nộp bình thường', viol:'Tự nộp do rời trang', abandoned:'Bỏ dở', left:'Thoát giữa chừng'})[x.end]||x.end, x.tries||1, (x.open||[]).map((o,i)=>`${i+1}. ${o.a||'(trống)'}`).join(' | ')])));
  try{
    if(!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Tổng quan');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(unitRows), 'Theo unit');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(asgRows), 'Bài giao');
    if(rdRows.length>1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rdRows), 'Pre-Post Reading');
    XLSX.writeFile(wb, `IVY-Word-Quest_${T.cls.code}_${today()}.xlsx`);
  }catch(e){
    const csv = '﻿' + rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = `IVY-Word-Quest_${T.cls.code}.csv`; a.click();
  }
}

function modal(html){ $('modalBox').innerHTML = html; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
boot().catch(e=>{ document.body.insertAdjacentHTML('beforeend', `<div class="wrap"><div class="card err">Không tải được Firebase (${esc(e.message)}). Kiểm tra mạng rồi tải lại trang.</div></div>`); });
</script>
