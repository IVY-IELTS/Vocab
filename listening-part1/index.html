ích","But we realise that there are things which the council, but also employers, might do to help encourage workers to cycle to work."],["employer (n)","người chủ, công ty thuê mình làm","But we realise that there are things which the council, but also employers, might do to help encourage workers to cycle to work."],["uphill (adv)","lên dốc","And also, I'd have to cycle uphill and on a hot day I'd arrive at work pretty sweaty so I think I'd need a shower somewhere at work."],["sweaty (adj)","đẫm mồ hôi","And also, I'd have to cycle uphill and on a hot day I'd arrive at work pretty sweaty so I think I'd need a shower somewhere at work."],["confident (adj)","tự tin","And I suppose the last thing is that I wouldn't be all that confident about cycling on such busy roads."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Excuse me…","to":"…Is the postcode GT7?","lines":[["Interviewer","The survey is on [behalf] of the local [council]."],["Interviewer","Can I [start] by [asking] you how you [travelled] to town today?"],["Luisa","It's [19], White [Stone] [Road]."],["Luisa","It's [actually] [G-T-8], [2-L-C]."]],"mcq":[["Who is the survey for?",["A local university","A bus company","The city authorities"],2,"Audio: 'on behalf of the local council' = cho chính quyền thành phố (city authorities)."],["How did Luisa get to town today?",["She drove her own car","She took public transport","She travelled on foot"],1,"Audio: 'I came on the bus' = đi phương tiện công cộng."],["What happens when the interviewer guesses her postcode?",["She can't remember it","She says he is right","She corrects the number"],2,"Audio: 'Is the postcode GT7? It's actually...' = cô ấy sửa lại số cho đúng."]],"transcript":[["Interviewer","Excuse me."],["Luisa","Yes?"],["Interviewer","I wonder if you could spare a few minutes to do a survey on transport. It won't take long."],["Luisa","No, that's fine."],["Interviewer","Lovely. The survey is on behalf of the local council. They'd like to know about what transport you use and any suggestions for improvement. Can I start by asking you how you travelled to town today?"],["Luisa","Sure. I came on the bus."],["Interviewer","Great. Now can I get a few details about yourself? What's your name?"],["Luisa","It's Luisa...."],["Interviewer","Yes."],["Luisa","Hardie. ( )"],["Interviewer","Can you spell that, please?"],["Luisa","Yes, it's H-A-R-D-I-E."],["Interviewer","Great. Thanks. And can I have your address?"],["Luisa","It's 19, White Stone Road. ( )"],["Interviewer","Oh, right. I know that area. It's Bradfield, isn't it?"],["Luisa","That's right."],["Interviewer","Is the postcode GT7?"],["Luisa","It's actually G-T-8, 2-L-C. ( )"]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"Great. And could I ask what your job is?…","to":"…you have to wait so long.","lines":[["Luisa","I've actually just [finished] my [training]. I'm a [hairdresser]."],["Luisa","Actually it's not for shopping today, which would be my [normal] [reason], but to see the [dentist]."],["Luisa","Well, something I've thought about for some time is that when I do walk and I'm doing a later [shift], I think the [lighting] should be better."],["Luisa","And, I don't think there are [enough] [trains]."]],"mcq":[["What is Luisa's usual reason for coming into town?",["To go to work","To meet friends","To buy things"],2,"Audio: 'shopping... would be my normal reason' = thường vào thành phố để mua đồ."],["When does walking feel like a problem for Luisa?",["When it rains a lot","When she goes shopping early","When she finishes work late"],2,"Audio: 'when I'm doing a later shift' = khi tan ca muộn."],["What does Luisa say about footpaths?",["People never walk on them","There are fewer walking paths now","There are too many footpaths"],1,"Audio: 'cutting down on the number of footpaths' = lối đi bộ ngày càng ít đi (fewer)."]],"transcript":[["Interviewer","Great. And could I ask what your job is? Are you a student?"],["Luisa","I've actually just finished my training. I'm a hairdresser. ( )"],["Interviewer","Oh, right. And one more question in this section. What is the reason for you coming into town today?"],["Luisa","Actually it's not for shopping today, which would be my normal reason, but to see the dentist. ( )"],["Interviewer","Right. Thanks."],["Interviewer","Now in this last section I'd like you to give us some ideas about the facilities and arrangements in the city for getting to and from work, er, any suggestions you have for improvements."],["Luisa","Well, something I've thought about for some time is that when I do walk and I'm doing a later shift, I think the lighting should be better. ( )"],["Interviewer","Yes, good point."],["Luisa","And of course, I think it's a real shame they've been cutting down on the number of footpaths. They should have more of those. Then people would walk more."],["Interviewer","Yes, right."],["Luisa","And, I don't think there are enough trains. That's why I don't use them - you have to wait so long. ( )"]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"Thanks. And finally I'd like to ask your opinion on cycling…","to":"hết Part 1","lines":[["Interviewer","As you may know, there's a [drive] in the city to get more [people] to cycle to work."],["Luisa","Well, I have thought about it and where I work there are no [safe] places to leave your [bikes]."],["Luisa","And also, I'd have to cycle uphill and on a [hot] day I'd arrive at work pretty [sweaty] so I think I'd need a [shower] somewhere at work."],["Luisa","I think I'd like to see you offering [training] for that, you know, I'd feel a lot [better] about starting if that was the case."]],"mcq":[["What is the city trying to do?",["Get more workers to ride bikes","Sell bikes more cheaply","Build more roads for cars"],0,"Audio: 'a drive... to get more people to cycle to work' = khuyến khích người lao động đạp xe đi làm."],["What is Luisa's journey to work like?",["It goes up a hill","It is always hot","It is flat and short"],0,"Audio: 'I'd have to cycle uphill' = đường đi lên dốc (up a hill)."],["How does Luisa feel about cycling on busy roads?",["Very confident","A bit nervous","Quite bored"],1,"Audio: 'I wouldn't be all that confident' = hơi lo lắng (nervous)."]],"transcript":[["Interviewer","Thanks. And finally I'd like to ask your opinion on cycling. As you may know, there's a drive in the city to get more people to cycle to work."],["Luisa","Right."],["Interviewer","But we realise that there are things which the council, but also employers, might do to help encourage workers to cycle to work."],["Luisa","Yep. Well, I have thought about it and where I work there are no safe places to leave your bikes. ( )"],["Interviewer","OK."],["Luisa","And also, I'd have to cycle uphill and on a hot day I'd arrive at work pretty sweaty so I think I'd need a shower somewhere at work. ( )"],["Interviewer","Right."],["Luisa","And I suppose the last thing is that I wouldn't be all that confident about cycling on such busy roads. I think I'd like to see you offering training for that, you know, I'd feel a lot better about starting if that was the case. ( )"],["Interviewer","Well, that's very helpful. Thank you very much for your time."],["Luisa","No problem. Bye."]]}],"key":[["Hardie"],["19"],["GT8 2LC","GT82LC"],["hairdresser"],["dentist"],["lighting"],["trains"],["safe"],["shower"],["training"]],"anyOrder":[],"keyNote":"Q1: tên riêng viết hoa, đánh vần H-A-R-D-I-E. Q3: GT8 2LC (người phỏng vấn đoán GT7 nhưng sai). Q7: số nhiều 'trains'. Q10: 'training' (danh từ), không phải 'trains'.","answerLines":[["LUISA","[Hardie]."],["LUISA","It's [19], White Stone Road."],["LUISA","It's actually [G-T-8], [2-L-C]."],["LUISA","I'm a [hairdresser]."],["LUISA","Actually it's not for shopping today, which would be my normal reason, but to see the [dentist]."],["LUISA","Well, something I've thought about for some time is that when I do walk and I'm doing a later shift, I think the [lighting] should be better."],["LUISA","And, I don't think there are enough [trains]."],["LUISA","Well, I have thought about it and where I work there are no [safe] places to leave your bikes."],["LUISA","And also, I'd have to cycle uphill and on a hot day I'd arrive at work pretty sweaty so I think I'd need a [shower] somewhere at work."],["LUISA","I think I'd like to see you offering [training] for that, you know, I'd feel a lot better about starting if that was the case."]],"para":[["Occupation","what your job is"],["Reason for visit to town","the reason for you coming into town today"],["more frequent …","I don't think there are enough … - you have to wait so long"],["parking places for bicycles","places to leave your bikes"],["the opportunity to have cycling …","offering … for that"]],"answerSource":"transcript","audio":{"src":"audio/tt-c10t2.mp3","segs":{"A":[141.1,187.9],"B":[186.5,293.4],"C":[292,350.2]},"conv":[142,348.9]},"phrases":[["I wonder if you could + V","Nhờ vả rất lịch sự: Không biết bạn có thể … không? Hay dùng khi làm khảo sát, hỏi người lạ.","I wonder if you could spare a few minutes to do a survey on transport.","Không biết chị có thể dành vài phút để làm một cuộc khảo sát về giao thông không?"],["on behalf of + somebody","Thay mặt / đại diện cho ai đó làm việc gì.","The survey is on behalf of the local council.","Cuộc khảo sát này được thực hiện thay mặt cho hội đồng thành phố."],["Can I start by + V-ing?","Tôi xin bắt đầu bằng việc …; dùng để mở đầu khi hỏi nhiều câu.","Can I start by asking you how you travelled to town today?","Tôi xin bắt đầu bằng việc hỏi hôm nay chị đến thị trấn bằng cách nào nhé?"],["It's actually …","Thật ra là … Dùng để sửa lại thông tin sai một cách lịch sự.","It's actually G-T-8, 2-L-C.","Thật ra là G-T-8, 2-L-C."],["it's a (real) shame (that) …","Thật đáng tiếc là … Dùng để bày tỏ sự tiếc nuối, không hài lòng.","And of course, I think it's a real shame they've been cutting down on the number of footpaths.","Và tất nhiên, tôi nghĩ thật đáng tiếc là họ đang cắt giảm số lượng đường đi bộ."],["cut down on + N","Cắt giảm, giảm bớt số lượng cái gì (phrasal verb).","And of course, I think it's a real shame they've been cutting down on the number of footpaths.","Và tất nhiên, tôi nghĩ thật đáng tiếc là họ đang cắt giảm số lượng đường đi bộ."],["I'd like to see you + V-ing","Tôi muốn thấy các anh/chị làm gì — cách đưa ra đề xuất, góp ý.","I think I'd like to see you offering training for that, you know, I'd feel a lot better about starting if that was the case.","Tôi nghĩ tôi muốn thấy các anh tổ chức lớp tập luyện cho việc đó, tôi sẽ thấy yên tâm hơn nhiều khi bắt đầu nếu có lớp như vậy."],["feel better about + V-ing","Cảm thấy yên tâm, thoải mái hơn khi làm gì.","I think I'd like to see you offering training for that, you know, I'd feel a lot better about starting if that was the case.","Tôi nghĩ tôi muốn thấy các anh tổ chức lớp tập luyện cho việc đó, tôi sẽ thấy yên tâm hơn nhiều khi bắt đầu nếu có lớp như vậy."]],"synonyms":[["on behalf of the local council","for the city authorities","thay mặt hội đồng thành phố"],["I came on the bus","by public transport","đi bằng xe buýt / phương tiện công cộng"],["what your job is","occupation","nghề nghiệp"],["my normal reason","usually comes into town to","lý do thường ngày"],["the lighting should be better","better street lights","cần chiếu sáng tốt hơn"],["cutting down on the number of footpaths","fewer walking paths","cắt giảm số lối đi bộ"],["no safe places to leave your bikes","secure bike parking","chỗ để xe đạp an toàn"],["I wouldn't be all that confident","feel nervous","không tự tin lắm, hơi lo"]],"spellnum":[["A","Yes, it's [H-A-R-D-I-E].",["Hardie"],"Họ của người phụ nữ",[170.3,180.8]],["A","It's [19], White Stone Road.",["19"],"Số nhà",[175.5,186]],["A","It's actually [G-T-8, 2-L-C].",["GT8 2LC","GT82LC"],"Mã bưu chính",[184.2,188.9]]],"newtest":{"type":"notes","title":"TRANSPORT SURVEY","instruction":"Complete the notes below.","limit":"ONE WORD AND/OR A NUMBER","maxWords":1,"example":["Survey topic:","transport"],"sections":[{"heading":"Personal details","lines":[["Travelled to town today by","",["bus"]],["Name: Luisa Hardie","",null],["Address: 19","Stone Road",["White"]],["Area:","",["Bradfield"]],["Usual reason for coming to town:","",["shopping"]]]},{"heading":"Suggestions for walking and public transport","lines":[["Better lighting needed when walking after a","shift",["later"]],["Should stop reducing the number of","",["footpaths"]],["Not enough trains","",null]]},{"heading":"Cycling","lines":[["City wants more people to cycle to","",["work"]],["The council and","could help",["employers"]],["Her journey to work is","",["uphill"]],["Not confident cycling on","roads",["busy"]]]}]}},{"id":"tt-c11t3","topic":"Travel and Transport","code":"Cam 11 · Test 3 · Part 1","title":"Free Activities in the Burnham Area","intro":"Chị Sue gọi điện cho anh Martin ở văn phòng du lịch Burnham để hỏi về các hoạt động miễn phí cho gia đình trong khu vực.","testPdf":"https://drive.google.com/file/d/12lqrJy6DZKyNXgXseb8KnBAhP6iEv03j/view","vocab":[["tourist office (n)","văn phòng thông tin du lịch","This is Burnham tourist office, Martin speaking."],["trail (n)","lộ trình khám phá (theo chỉ dẫn)","The art gallery is holding an event called 'Family Welcome' that day, when there are activities and trails to use throughout the gallery."],["ceramics (n)","đồ gốm","It demonstrates how ceramics are made, and there'll be equipment and materials for children to have a go themselves."],["equipment (n)","dụng cụ, thiết bị","It demonstrates how ceramics are made, and there'll be equipment and materials for children to have a go themselves."],["sculpture (n)","điêu khắc, tượng","Last time they ran the event, there was a film about painting, which went down very well with the children, and they're now working on one about sculpture."],["marina (n)","bến du thuyền","The race starts at Offord Marina, to the north of Burnham, and goes as far as Summer Pool."],["crowded (adj)","đông đúc","The best place to watch it from is Charlesworth Bridge, though that does get rather crowded."],["regional championship (n)","giải vô địch khu vực","One of them came first in the West of England regional championship in May this year - it was the first time a team from Burnham has won."],["represent (v)","đại diện cho","It means that next year they'll be representing the region in the national championship."],["nature reserve (n)","khu bảo tồn thiên nhiên","Now I've heard something about Paxton Nature Reserve."],["spot (v)","nhìn thấy, phát hiện","It's a good place for spotting unusual birds, isn't it?"],["habitat (n)","môi trường sống (của động vật)","There is a lake there, as well as a river, and they provide a very attractive habitat."],["binoculars (n)","ống nhòm","So it's a good idea to bring binoculars if you have them."],["soil (n)","đất (trồng)","And just at the moment you can see various flowers that are pretty unusual - the soil at Paxton isn't very common."],["shallow (adj)","nông, cạn","It's very shallow, and there's a lifeguard on duty whenever it's open."],["lifeguard (n)","nhân viên cứu hộ","It's very shallow, and there's a lifeguard on duty whenever it's open."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Good morning. This is Burnham tourist office…","to":"…they range from pop music to Latin American.","lines":[["Sue","I saw a [poster] about [free] things to do in the area, and it said people should phone you for information."],["Martin","The gallery opens at [10], and the 'Family Welcome' event runs from [10.30] until 2 o'clock."],["Martin","It demonstrates how [ceramics] are made, and there'll be [equipment] and materials for children to have a go themselves."],["Martin","Well there are several free concerts taking place at different times - one or two in the [morning], the majority at [lunchtime], and a couple in the [evening]."]],"mcq":[["How did Sue find out about the free activities?",["She saw a printed notice","A friend phoned her","She read a guidebook"],0,"Audio: 'I saw a poster' = cô ấy thấy một tấm thông báo in (printed notice)."],["What is the gallery working on now?",["A painting exhibition","A film about statues","A new children's trail"],1,"Audio: 'they're now working on one about sculpture' = phim về tượng (statues)."],["What kinds of music are at the concerts?",["Many different styles","Only pop music","Only classical music"],0,"Audio: 'they range from pop music to Latin American' = nhiều thể loại (styles) khác nhau."]],"transcript":[["Martin","Good morning. This is Burnham tourist office, Martin speaking."],["Sue","Oh, hello. I saw a poster about free things to do in the area, and it said people should phone you for information. I'm coming to Burnham with my husband and two children for a few days on June the 27th, or possibly the 28th, and I'd like some ideas for things to do on the 29th."],["Martin","Yes, of course. OK. Then let's start with a couple of events especially for children. The art gallery is holding an event called 'Family Welcome' that day, when there are activities and trails to use throughout the gallery."],["Sue","That sounds interesting. What time does it start?"],["Martin","The gallery opens at 10, and the 'Family Welcome' event runs from 10.30 until 2 o'clock. ( ) The gallery stays open until 5. And several times during the day, they're going to show a short film that the gallery has produced. It demonstrates how ceramics are made, and there'll be equipment and materials for children to have a go themselves. ( ) Last time they ran the event, there was a film about painting, which went down very well with the children, and they're now working on one about sculpture."],["Sue","I like the sound of that. And what other events happen in Burnham?"],["Martin","Well, do you all enjoy listening to music?"],["Sue","Oh, yes."],["Martin","Well there are several free concerts taking place at different times - one or two in the morning, the majority at lunchtime, and a couple in the evening. ( ) And they range from pop music to Latin American."]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"The Latin American could be fun…","to":"…in the national championship.","lines":[["Martin","They're performing in the central [library] at 1 o'clock, then at 4 it's in the City [Museum], and in the evening, at 7.30, there's a longer concert, in the theatre."],["Martin","The race starts at [Offord] [Marina], to the north of Burnham, and goes as far as Summer Pool."],["Martin","The best place to [watch] it from is Charlesworth Bridge, though that does get rather [crowded]."],["Martin","One of them came first in the West of England [regional] [championship] in May this year - it was the first time a team from Burnham has won."]],"mcq":[["What is the problem with Charlesworth Bridge?",["It is too far north","It is closed in June","Lots of people go there"],2,"Audio: 'that does get rather crowded' = rất nhiều người đến đó."],["Who takes part in the race?",["Schools from other countries","Teams from the area","Tourists in hired boats"],1,"Audio: 'local boat clubs' = các đội trong vùng (from the area)."],["What does Martin say about the clubs?",["Their standard is quite low","They are very skilled","They only race in May"],1,"Audio: 'the standard is very high' = họ rất giỏi (skilled)."]],"transcript":[["Sue","The Latin American could be fun. What time is that?"],["Martin","It's being repeated several times, in different places. They're performing in the central library at 1 o'clock, then at 4 it's in the City Museum, and in the evening, at 7.30, there's a longer concert, in the theatre. ( )"],["Sue","Right. I'll suggest that to the rest of the family."],["Martin","Something else you might be interested in is the boat race along the river."],["Sue","Oh, yes, do tell me about that."],["Martin","The race starts at Offord Marina, to the north of Burnham, and goes as far as Summer Pool. ( ) The best place to watch it from is Charlesworth Bridge, though that does get rather crowded."],["Sue","And who's taking part?"],["Martin","Well, local boat clubs, but the standard is very high. One of them came first in the West of England regional championship in May this year - it was the first time a team from Burnham has won. ( ) It means that next year they'll be representing the region in the national championship."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"Now I've heard something about Paxton Nature Reserve…","to":"hết Part 1","lines":[["Sue","It's a good place for [spotting] unusual [birds], isn't it?"],["Martin","And just at the moment you can see various [flowers] that are pretty unusual - the [soil] at Paxton isn't very common."],["Martin","And there's going to be a [talk] and slide show about [mushrooms] - and you'll be able to go out and pick some afterwards and study the different varieties."],["Sue","And is it possible for children to [swim] in the [river]?"]],"mcq":[["What should visitors bring to Paxton?",["A map of the reserve","A boat for the lake","Glasses for seeing far away"],2,"Audio: 'bring binoculars' = ống nhòm, kính để nhìn xa."],["Why is swimming not allowed in the lake?",["There is no lifeguard","It is too cold","The water is very deep"],2,"Audio: 'The lake is too deep' = nước rất sâu."],["Why is the bus a better way to get there?",["It is much faster than a car","It is free for children","There are few car spaces"],2,"Audio: 'parking is very limited' = có rất ít chỗ đậu xe (few car spaces)."]],"transcript":[["Sue","Now I've heard something about Paxton Nature Reserve. It's a good place for spotting unusual birds, isn't it? ( )"],["Martin","That's right throughout the year. There is a lake there, as well as a river, and they provide a very attractive habitat. So it's a good idea to bring binoculars if you have them. And just at the moment you can see various flowers that are pretty unusual - the soil at Paxton isn't very common. They're looking good right now. ( )"],["Sue","Right. My husband will be particularly interested in that."],["Martin","And there's going to be a talk and slide show about mushrooms - and you'll be able to go out and pick some afterwards and study the different varieties. ( )"],["Sue","Uhuh. And is it possible for children to swim in the river?"],["Martin","Yes. Part of it has been fenced off to make it safe for children to swim in. ( ) It's very shallow, and there's a lifeguard on duty whenever it's open. The lake is too deep, so swimming isn't allowed there."],["Sue","OK, we must remember to bring their swimming things, in case we go to Paxton. How long does it take to get there by car from Burnham?"],["Martin","About 20 minutes, but parking is very limited, so it's usually much easier to go by bus - and it takes about the same time."],["Sue","Right. Well, I'll discuss the options with the rest of the family. Thanks very much for all your help."],["Martin","You're welcome."],["Sue","Goodbye."],["Martin","Bye."]]}],"key":[["B"],["C"],["B"],["A"],["C"],["A"],["birds"],["flowers"],["mushrooms"],["river"]],"anyOrder":[],"keyNote":"Q1–6: chỉ ghi chữ cái A, B hoặc C. Q7–9: danh từ số nhiều (birds, flowers, mushrooms). Q10: river (không phải lake – hồ quá sâu, không được bơi).","answerLines":[["MARTIN","The gallery opens at 10, and the 'Family Welcome' event runs from [10.30] until 2 o'clock."],["MARTIN","It demonstrates how [ceramics] are made, and there'll be equipment and materials for children to have a go themselves."],["MARTIN","Well there are several free concerts taking place at different times - one or two in the morning, the majority at [lunchtime], and a couple in the evening."],["MARTIN","They're performing in the central library at 1 o'clock, then at 4 it's in the City [Museum], and in the evening, at 7.30, there's a longer concert, in the theatre."],["MARTIN","The race starts at [Offord] [Marina], to the north of Burnham, and goes as far as Summer Pool."],["MARTIN","One of them came first in the West of England [regional] [championship] in May this year - it was the first time a team from Burnham has won."],["SUE","It's a good place for spotting unusual [birds], isn't it?"],["MARTIN","And just at the moment you can see various [flowers] that are pretty unusual - the soil at Paxton isn't very common."],["MARTIN","And there's going to be a talk and slide show about [mushrooms] - and you'll be able to go out and pick some afterwards and study the different varieties."],["SUE","And is it possible for children to swim in the [river]?"]],"para":[["won a regional competition earlier this year","came first in the West of England regional championship in May this year"],["rare … all year round","unusual … throughout the year"],["a particularly good time","just at the moment … They're looking good right now"],["learn about … and then collect some","a talk and slide show about … pick some afterwards"],["has been made suitable for swimming","has been fenced off to make it safe for children to swim in"]],"answerSource":"transcript","audio":{"src":"audio/tt-c11t3.mp3","segs":{"A":[181.7,270.1],"B":[268.7,325],"C":[323.6,439.3]},"conv":[182.6,438]},"phrases":[["I like the sound of that. / That sounds interesting.","Nghe hay đấy. Dùng để phản hồi tích cực khi ai đó giới thiệu, gợi ý điều gì.","I like the sound of that.","Nghe hay đấy."],["have a go","Thử làm gì đó (thường là lần đầu).","It demonstrates how ceramics are made, and there'll be equipment and materials for children to have a go themselves.","Phim cho thấy đồ gốm được làm thế nào, và sẽ có dụng cụ, nguyên liệu để trẻ em tự làm thử."],["go down well with + somebody","Được ai đó thích, đón nhận nhiệt tình.","Last time they ran the event, there was a film about painting, which went down very well with the children, and they're now working on one about sculpture.","Lần trước tổ chức sự kiện, có một bộ phim về hội họa rất được bọn trẻ yêu thích, và giờ họ đang làm một phim về điêu khắc."],["range from … to …","Trải dài từ … đến …; dùng để nói các loại khác nhau trong một nhóm.","And they range from pop music to Latin American.","Và chúng đa dạng từ nhạc pop đến nhạc Mỹ Latinh."],["Something else you might be interested in is …","Một thứ khác bạn có thể sẽ thích là … — cách giới thiệu thêm gợi ý lịch sự.","Something else you might be interested in is the boat race along the river.","Một thứ khác có lẽ chị sẽ thích là cuộc đua thuyền dọc con sông."],["take part","Tham gia (một cuộc thi, hoạt động).","And who's taking part?","Vậy ai sẽ tham gia?"],["It's a good idea to + V","Nên làm gì — cách khuyên nhẹ nhàng.","So it's a good idea to bring binoculars if you have them.","Vì vậy nếu có ống nhòm thì nên mang theo."],["in case + clause","Phòng khi, đề phòng trường hợp …","OK, we must remember to bring their swimming things, in case we go to Paxton.","Được, chúng tôi phải nhớ mang đồ bơi cho bọn trẻ, phòng khi chúng tôi đi Paxton."]],"synonyms":[["I saw a poster","a printed notice","thấy tờ áp phích, thông báo"],["my husband and two children","her partner and kids","chồng và hai con"],["have a go themselves","try it out","tự tay thử làm"],["went down very well with the children","the children enjoyed it","được bọn trẻ rất thích"],["the majority at lunchtime","most are in the middle of the day","phần lớn vào giờ trưa"],["that does get rather crowded","lots of people go there","khá đông người"],["the standard is very high","they are very skilled","trình độ rất cao"],["parking is very limited","few car spaces","chỗ đỗ xe rất ít"]],"spellnum":[["A","I'm coming to Burnham with my husband and two children for a few days on June the [27th], or possibly the 28th, and I'd like some ideas for things to do on the 29th.",["27th","27","27th June","June 27th","27 June"],"Ngày gia đình đến Burnham",[190.7,201.2]],["A","I'm coming to Burnham with my husband and two children for a few days on June the 27th, or possibly the 28th, and I'd like some ideas for things to do on the [29th].",["29th","29","29th June","June 29th","29 June"],"Ngày muốn đi chơi",[190.7,201.2]],["A","The gallery opens at [10], and the 'Family Welcome' event runs from 10.30 until 2 o'clock.",["10","10.00","10 am"],"Giờ mở cửa phòng tranh",[216.2,226.7]],["A","The gallery stays open until [5].",["5","5 o'clock","5.00","5 pm"],"Giờ đóng cửa phòng tranh",[221.3,231.8]],["B","They're performing in the central library at [1 o'clock], then at 4 it's in the City Museum, and in the evening, at 7.30, there's a longer concert, in the theatre.",["1","1 o'clock","1.00","1 pm"],"Giờ biểu diễn ở thư viện",[271.8,282.3]],["B","They're performing in the central library at 1 o'clock, then at 4 it's in the City Museum, and in the evening, at [7.30], there's a longer concert, in the theatre.",["7.30","7:30","7.30 pm"],"Giờ buổi hòa nhạc ở nhà hát",[271.8,282.3]],["C","About [20] minutes, but parking is very limited, so it's usually much easier to go by bus - and it takes about the same time.",["20","twenty"],"Số phút đi ô tô đến Paxton",[419.8,430.3]]],"newtest":{"type":"notes","title":"Free events in Burnham on 29 June","instruction":"Complete the notes below.","limit":"NO MORE THAN TWO WORDS AND/OR A NUMBER","maxWords":2,"example":["Information from:","Burnham tourist office"],"sections":[{"heading":"Art gallery – 'Family Welcome'","lines":[["Event ends at","",["2","2 o'clock","2.00","2 pm","two"]],["Film shown last time was about","",["painting"]],["Next film will be about","",["sculpture"]]]},{"heading":"Concerts","lines":[["Music ranges from","music to Latin American",["pop"]],["Latin American: longer concert at 7.30 in the","",["theatre","theater"]]]},{"heading":"Boat race","lines":[["Starts at Offord Marina, ends at","",["Summer Pool"]],["Next year a Burnham team will compete in the","championship",["national"]]]},{"heading":"Paxton Nature Reserve","lines":[["Has a river and a lake","",null],["Bring","if possible",["binoculars"]],["Children can swim in the river: a","is on duty",["lifeguard"]],["Best way to get there: by","(parking is limited)",["bus"]]]}]}},{"id":"tt-c12t5","topic":"Travel and Transport","code":"Cam 12 · Test 5 · Part 1","title":"Family Excursions","intro":"Một du khách hỏi nhân viên trung tâm du lịch về các chuyến tham quan cho gia đình: đi du thuyền trên hồ, thăm trang trại và đạp xe.","testPdf":"https://drive.google.com/file/d/1TcDqPoGYRF8ZsND3U-t4TCdHV4gbZRhW/view","vocab":[["excursion (n)","chuyến tham quan ngắn","I'd like to find out if you have any excursions suitable for families."],["suitable for (adj)","phù hợp với","I'd like to find out if you have any excursions suitable for families."],["cruise (n)","chuyến du ngoạn bằng tàu","How about taking your family for a cruise?"],["steamship (n)","tàu chạy bằng hơi nước","We have a steamship that takes passengers out several times a day - it's over 100 years old."],["on board","trên tàu","And I assume there's a café or something on board?"],["trek (n)","chuyến đi dài (đi bộ/cưỡi ngựa)","Well, there's also a 40-minute trek round the farm on a horse, if he wants."],["complete beginner (n)","người mới hoàn toàn, chưa biết gì","It's suitable for complete beginners."],["explore (v)","khám phá","And again, visitors are welcome to explore the farm on their own, as long as they take care to close gates and so on."],["scenery (n)","phong cảnh","There's a trail there called the Back Road - you could easily spend three or four hours exploring it, and the scenery's wonderful."],["challenging (adj)","khó, đòi hỏi nhiều sức/kỹ năng","Quite challenging in places."],["rent (v)","thuê","But we don't have bikes here... is there somewhere we could rent them?"],["repair kit (n)","bộ dụng cụ sửa chữa","You'd also need to pick up a repair kit for the bike from there to take along with you, and you'd need to take along a snack and some water - it'd be best to get those in the city."],["helmet (n)","mũ bảo hiểm","And I assume I can rent a helmet from the bike place?"],["remote (adj)","hẻo lánh, xa xôi","It's a great ride, but you want to be well prepared because it's very remote - you won't see any shops round there, or anywhere to stay, so you need to get back in time for the last boat."],["fare (n)","giá vé","Then I'm afraid it's $267 because she has to pay the adult fare, which is $75 instead of the child fare which is $22 - sorry about that."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hi. Can I help you?…","to":"…You could easily spend an hour or two there.","lines":[["Tc Employee","About an [hour] and a [half]."],["Tc Employee","And don't forget to take [pictures] of the [mountains]."],["Tc Employee","Well, there's also a [40-minute] trek round the farm on a [horse], if he wants."],["Tc Employee","There are some very beautiful [gardens] along the side of the [lake] which also belong to the farm - they'll be just at their best now."]],"mcq":[["What does the woman say about the steamship?",["It is more than a century old","It sails only once a day","It is too small for families"],0,"Audio: 'it's over 100 years old' = hơn một thế kỷ (century)."],["What do children love doing at the farm?",["Giving food to the sheep","Riding the sheep","Closing the gates"],0,"Audio: 'Children love feeding them' = cho cừu ăn (giving food)."],["Can the boy do the trek round the farm?",["No, it is too long for him","Yes, even total learners can","Only if he has done it before"],1,"Audio: 'suitable for complete beginners' = người mới hoàn toàn (total learners) cũng làm được."]],"transcript":[["Tc Employee","Hi. Can I help you?"],["Visitor","I'd like to find out if you have any excursions suitable for families."],["Tc Employee","Sure. How about taking your family for a cruise? We have a steamship that takes passengers out several times a day - it's over 100 years old."],["Visitor","That sounds interesting. How long is the trip?"],["Tc Employee","About an hour and a half. And don't forget to take pictures of the mountains. They're all around you when you're on the boat and they look fantastic. ( )"],["Visitor","OK. And I assume there's a café or something on board?"],["Tc Employee","Sure. How old are your children?"],["Visitor","Er, my daughter's fifteen and my son's seven."],["Tc Employee","Right. Well there are various things you can do once you've crossed the lake, to make a day of it. One thing that's very popular is a visit to the Country Farm. You're met off the boat by the farmer and he'll take you to the holding pens, where the sheep are kept. Children love feeding them!"],["Visitor","My son would love that. He really likes animals."],["Tc Employee","Well, there's also a 40-minute trek round the farm on a horse, if he wants. ( )"],["Visitor","Do you think he'd manage it? He hasn't done that before."],["Tc Employee","Sure. It's suitable for complete beginners."],["Visitor","Ah, good."],["Tc Employee","And again, visitors are welcome to explore the farm on their own, as long as they take care to close gates and so on. There are some very beautiful gardens along the side of the lake which also belong to the farm - they'll be just at their best now. ( ) You could easily spend an hour or two there."]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"OK. Well that all sounds good…","to":"…It wouldn't be suitable for your seven-year-old.","lines":[["Visitor","And can we [get] [lunch] there?"],["Tc Employee","You can, and it's very [good], though it's not [included] in the basic cost."],["Tc Employee","They'll give you a [map] when you get your [ticket] for the cruise - there's no extra [charge]."],["Tc Employee","It [needs] someone who's got a bit more [experience]."]],"mcq":[["What can visitors take with them on the ship?",["Their own car","Their own bicycles","Their own farm animals"],1,"Audio: 'take a bike over on the ship' = mang xe đạp (bicycles) lên tàu."],["How long can you spend exploring the Back Road?",["Three or four days","About forty minutes","Several hours"],2,"Audio: 'three or four hours' = vài tiếng (several hours)."],["How difficult is the trail?",["Fine for seven-year-olds","Quite hard in some parts","Easy for everyone"],1,"Audio: 'Quite challenging in places' = khá khó ở một số đoạn (hard in some parts)."]],"transcript":[["Visitor","OK. Well that all sounds good. And can we get lunch there?"],["Tc Employee","You can, and it's very good, though it's not included in the basic cost. You pay when you get there. ( )"],["Visitor","Right."],["Visitor","So is there anything else to do over on that side of the lake?"],["Tc Employee","Well, what you can do is take a bike over on the ship and then go on a cycling trip. There's a trail there called the Back Road - you could easily spend three or four hours exploring it, and the scenery's wonderful. They'll give you a map when you get your ticket for the cruise - there's no extra charge. ( )"],["Visitor","What's the trail like in terms of difficulty?"],["Tc Employee","Quite challenging in places. It wouldn't be suitable for your seven-year-old. It needs someone who's got a bit more experience. ( )"]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"Hmm. Well, my daughter loves cycling…","to":"hết Part 1","lines":[["Tc Employee","Yes, there's a [place] here in the [city]. It's called [Ratchesons]."],["Visitor","And I assume I can [rent] a [helmet] from the bike place?"],["Tc Employee","It's a great ride, but you want to be well prepared because it's very [remote] - you won't see any [shops] round there, or anywhere to [stay], so you need to get back in time for the last boat."],["Tc Employee","Then I'm afraid it's $[267] because she has to pay the [adult] fare, which is $75 instead of the child fare which is $22 - sorry about that."]],"mcq":[["Where is the bike rental place?",["On the farm","Next to where the boat leaves","Outside the city"],1,"Audio: 'just by the cruise ship terminal' = ngay cạnh bến tàu (where the boat leaves)."],["What should they buy in the city?",["A place to stay","A new bike","Something to eat and drink"],2,"Audio: 'a snack and some water' = đồ ăn và đồ uống."],["Why must they get back for the last boat?",["The bike place closes early","There is nowhere to spend the night","The ride is very short"],1,"Audio: 'you won't see... anywhere to stay' = không có chỗ nào để ngủ qua đêm."]],"transcript":[["Visitor","Hmm. Well, my daughter loves cycling and so do I, so maybe the two of us could go, and my wife and son could stay on the farm."],["Tc Employee","That might work out quite well."],["Visitor","But we don't have bikes here... is there somewhere we could rent them?"],["Tc Employee","Yes, there's a place here in the city. It's called Ratchesons."],["Visitor","I'll just make a note of that - er, how do you spell it?"],["Tc Employee","R-A-T-C-H-E-S-O-N-S. ( ) It's just by the cruise ship terminal."],["Visitor","OK."],["Tc Employee","You'd also need to pick up a repair kit for the bike from there to take along with you, and you'd need to take along a snack and some water - it'd be best to get those in the city."],["Visitor","Fine. That shouldn't be a problem. And I assume I can rent a helmet from the bike place? ( )"],["Tc Employee","Sure, you should definitely get that. It's a great ride, but you want to be well prepared because it's very remote - you won't see any shops round there, or anywhere to stay, so you need to get back in time for the last boat. ( )"],["Visitor","Yeah. So what sort of prices are we looking at here?"],["Tc Employee","Let's see, that'd be one adult and one child for the cruise with farm tour, that's $117, and an adult and a child for the cruise only so that's $214 dollars altogether. Oh, wait a minute, how old did you say your daughter was?"],["Visitor","Fifteen."],["Tc Employee","Then I'm afraid it's $267 because she has to pay the adult fare, which is $75 instead of the child fare which is $22 - sorry about that. ( )"],["Visitor","That's OK. Er, so how do..."]]}],"key":[["mountains"],["horse"],["gardens"],["lunch"],["map"],["experience"],["Ratchesons"],["helmet"],["shops"],["267"]],"anyOrder":[],"keyNote":"Q1, Q3, Q9: số nhiều (mountains, gardens, shops). Q7: tên riêng viết hoa, đánh vần R-A-T-C-H-E-S-O-N-S. Q10: 267 (không phải 214 – con số bị sửa lại).","answerLines":[["TC EMPLOYEE","And don't forget to take pictures of the [mountains]."],["TC EMPLOYEE","Well, there's also a 40-minute trek round the farm on a [horse], if he wants."],["TC EMPLOYEE","There are some very beautiful [gardens] along the side of the lake which also belong to the farm - they'll be just at their best now."],["VISITOR","And can we get [lunch] there?"],["TC EMPLOYEE","They'll give you a [map] when you get your ticket for the cruise - there's no extra charge."],["TC EMPLOYEE","It needs someone who's got a bit more [experience]."],["TC EMPLOYEE","It's called [Ratchesons]."],["VISITOR","And I assume I can rent a [helmet] from the bike place?"],["TC EMPLOYEE","It's a great ride, but you want to be well prepared because it's very remote - you won't see any [shops] round there, or anywhere to stay, so you need to get back in time for the last boat."],["TC EMPLOYEE","Then I'm afraid it's $[267] because she has to pay the adult fare, which is $75 instead of the child fare which is $22 - sorry about that."]],"para":[["take photos of","take pictures of"],["a 40-minute ride on a …","a 40-minute trek round the farm on a …"],["is available at extra cost","not included in the basic cost. You pay when you get there"],["A … is provided","They'll give you a … - there's no extra charge"],["food and drink","a snack and some water"]],"answerSource":"transcript","audio":{"src":"audio/tt-c12t5.mp3","segs":{"A":[168.3,265.2],"B":[263.8,360.3],"C":[358.9,453.4]},"conv":[169.2,452.1]},"phrases":[["I'd like to find out if …","Tôi muốn hỏi xem … có không. Mở đầu lịch sự khi hỏi thông tin.","I'd like to find out if you have any excursions suitable for families.","Tôi muốn hỏi xem ở đây có chuyến tham quan nào phù hợp cho gia đình không."],["How about + V-ing?","Gợi ý: Thế c en open a couple of months."],["aspect (n)","khía cạnh, mặt","There are lots of really good aspects to living here."],["estate agent (n)","người/công ty môi giới nhà đất","We want to make some appointments with estate agents."],["preferable (adj)","tốt hơn, được ưu tiên hơn","Thursday's preferable - Tuesday I need to get home before 6 pm."],["opposite (prep)","đối diện","It's opposite the station and next to the museum."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello, Linda speaking…","to":"…the traffic during the rush hour can be bad.","lines":[["Linda","Well, I live in Dalton, which is a really nice [suburb] - not too [expensive], and there's a nice park."],["Linda","Yeah, you should be able to get something [reasonable] for [850] pounds per [month]."],["Linda","I work in the city centre so I don't have to use [public] [transport]. I go by [bike]."],["Linda","Anyway, driving to work in the city centre would be a [nightmare] because there's [hardly] any [parking]."]],"mcq":[["What does Linda say about Dalton?",["Very expensive but nice","Far from any park","Fair prices and some green space"],2,"Audio: 'not too expensive, and there's a nice park' = giá hợp lý và có công viên (green space)."],["What does the rent NOT include?",["The two bedrooms","Gas and electricity costs","The flat's furniture"],1,"Audio: 'That doesn't include bills' = không gồm tiền điện, gas (hóa đơn)."],["What else is bad about driving in the centre?",["Petrol is very expensive","Heavy traffic at busy times","Too many cyclists on the road"],1,"Audio: 'the traffic during the rush hour can be bad' = kẹt xe vào giờ cao điểm."]],"transcript":[["Linda","Hello, Linda speaking."],["Matt","Oh hi, Linda. This is Matt Brooks. Alex White gave me your number. He said you'd be able to give me some advice about moving to Banford."],["Linda","Yes, Alex did mention you. How can I help?"],["Matt","Well, first of all - which area to live in?"],["Linda","Well, I live in Dalton, which is a really nice suburb - not too expensive, and there's a nice park."],["Matt","Sounds good. Do you know how much it would be to rent a two bedroom flat there?"],["Linda","Yeah, you should be able to get something reasonable for 850 pounds per month. ( ) That's what people typically pay. You certainly wouldn't want to pay more than 900 pounds. That doesn't include bills or anything."],["Matt","No. That sounds alright. I'll definitely have a look there. Are the transport links easy from where you live?"],["Linda","Well, I'm very lucky. I work in the city centre so I don't have to use public transport. I go by bike. ( )"],["Matt","Oh, I wish I could do that. Is it safe to cycle around the city?"],["Linda","Yes, it's fine. And it keeps me fit. Anyway, driving to work in the city centre would be a nightmare because there's hardly any parking. ( ) And the traffic during the rush hour can be bad."]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"I'd be working from home…","to":"…There's a good arts centre too.","lines":[["Matt","I'd be working from [home] but I'd have to go to [London] one or two days a week."],["Linda","There's a fast train every [30] [minutes] which only takes 45 minutes."],["Linda","It's [weekends] that are a [problem]."],["Linda","There are some nice [restaurants] in the city centre and a brand new [cinema] which has only been open a couple of months."]],"mcq":[["How often will Matt need to go to London?",["Every single day","Once or twice weekly","Once a month"],1,"Audio: 'one or two days a week' = một hai lần mỗi tuần (weekly)."],["What sometimes happens because of engineering work?",["Passengers must take a bus first","The station closes at night","Trains are cancelled all week"],0,"Audio: 'you have to take a bus to Hadham and pick up the train there' = hành khách phải đi xe buýt trước."],["How does Linda feel about living in Banford?",["She has never been happy there","She wants to leave soon","She is very pleased with it"],2,"Audio: 'I've never been happier' = cô ấy rất hài lòng (pleased)."]],"transcript":[["Matt","I'd be working from home but I'd have to go to London one or two days a week."],["Linda","Oh, that's perfect. Getting to London is no problem. There's a fast train every 30 minutes which only takes 45 minutes. ( )"],["Matt","That's good."],["Linda","Yeah, the train service isn't bad during the week. And they run quite late at night. It's weekends that are a problem. ( ) They're always doing engineering work and you have to take a bus to Hadham and pick up the train there, which is really slow."],["Linda","But other than that, Banford's a great place to live. I've never been happier. There are some nice restaurants in the city centre and a brand new cinema which has only been open a couple of months. ( ) There's a good arts centre too."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"Sounds like Banford's got it all…","to":"hết Part 1","lines":[["Linda","The schools are good and the [hospital] here is one of the [best] in the country."],["Linda","Oh, I can give you the name of my [dentist] too in Bridge [Street], if you're interested."],["Matt","[Thursday]'s [preferable] - [Tuesday] I need to get home before 6 pm."],["Linda","Let me know which [train] you're catching and I'll meet you in the [café] outside."]],"mcq":[["What will Linda send to Matt?",["Some photos of the city","A map of Bridge Street","His contact details"],2,"Audio: 'I'll find his number and send it to you' = thông tin liên lạc (contact details)."],["Why is Matt coming to Banford next week?",["To visit his wife","To meet people about finding a home","To start his new job"],1,"Audio: 'make some appointments with estate agents' = gặp người môi giới để tìm nhà."],["How will Matt contact Linda next week?",["He will visit her at home","He will phone her office","He will send her a message"],2,"Audio: 'I'll text you next week' = gửi tin nhắn (message)."]],"transcript":[["Matt","Sounds like Banford's got it all."],["Linda","Yes! We're really ies","lines":[["A good","centre",["arts"]],["The","are good",["schools"]]]},{"heading":"Meeting Linda","lines":[["Linda is free after","",["5.30","5:30","5.30 pm"]],["Meeting place: opposite the station, next to the","",["museum"]]]}]}},{"id":"sa-c15t4","topic":"Services and Amenities","code":"Cam 15 · Test 4 · Part 1","title":"Customer Satisfaction Survey","intro":"Một nhân viên khảo sát hỏi chị Sophie Bird ở nhà ga về mức độ hài lòng với chuyến tàu hôm nay và các tiện ích của nhà ga.","testPdf":"https://drive.google.com/file/d/1Na-Htk7GIZlouQtTMjyNwuht3oRskMOu/view","vocab":[["customer satisfaction survey (n)","khảo sát mức độ hài lòng của khách hàng","We're doing a customer satisfaction survey."],["day trip (n)","chuyến đi trong ngày","I'm on a day trip."],["journalist (n)","nhà báo","I'm a journalist."],["day off (n)","ngày nghỉ","Actually, it's my day off."],["season ticket (n)","vé tháng / vé dài hạn","I assume it wasn't a season ticket, as you don't travel every day."],["return ticket (n)","vé khứ hồi","No, I just got a normal return ticket."],["rail card (n)","thẻ giảm giá đi tàu","I don't have a rail card so I didn't get any discount."],["discount (n)","sự giảm giá","I don't have a rail card so I didn't get any discount."],["value for money (n)","đáng đồng tiền","Do you think that's good value for money?"],["complaint (n)","lời phàn nàn, khiếu nại","Yes, that's one of the main complaints we get."],["in advance","trước (thời điểm nào đó)","So, you didn't buy your ticket in advance?"],["out of order","bị hỏng, không hoạt động","There's always a queue for the machines and they're often out of order."],["reliable (adj)","đáng tin cậy","Well, normally, the trains run on time and are pretty reliable but today there was a delay; the train was about 15 minutes behind schedule."],["behind schedule","trễ so với lịch","Well, normally, the trains run on time and are pretty reliable but today there was a delay; the train was about 15 minutes behind schedule."],["upgrade (v)","nâng cấp","You've probably noticed that the whole station's been upgraded."],["frustrating (adj)","gây bực mình","I think the best thing is that they've improved the amount of information about train times etc. that's given to passengers — it's much clearer — before there was only one board and I couldn't always see it properly — which was frustrating."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello. Do you mind if I ask you…","to":"…Can I just check the spelling?","lines":[["Sophie","I've got about ten [minutes] before my [train] home leaves. I'm on a day [trip]."],["Sophie","Actually, it's my [day] [off]. I came here to do some [shopping]."],["Man","Right, so can you tell me which [station] you're travelling [back] to?"],["Sophie","[Staunfirth], where I [live]."]],"mcq":[["How much time does Sophie have before her train?",["More than an hour","Less than a quarter of an hour","About two minutes"],1,"Audio: 'about ten minutes before my train home leaves' = chưa tới mười lăm phút (quarter of an hour)."],["What kind of trip is Sophie on?",["She is going home this evening","A work trip for several days","A long holiday"],0,"Audio: 'I'm on a day trip' = đi về trong ngày, tối nay về nhà."],["Is Sophie working today?",["No, it's a free day for her","Yes, she has a meeting","Yes, she is writing a story"],0,"Audio: 'it's my day off' = hôm nay là ngày nghỉ (free day)."]],"transcript":[["Man","Hello. Do you mind if I ask you some questions about your journey today? We're doing a customer satisfaction survey."],["Sophie","Yes. OK. I've got about ten minutes before my train home leaves. I'm on a day trip."],["Man","Great. Thank you. So first of all, could you tell me your name?"],["Sophie","It's Sophie Bird."],["Man","Thank you. And would you mind telling me what you do?"],["Sophie","I'm a journalist."],["Man","Oh really? That must be interesting."],["Sophie","Yes. It is."],["Man","So was the reason for your visit here today work?"],["Sophie","Actually, it's my day off. I came here to do some shopping."],["Man","Oh right."],["Sophie","But I do sometimes come here for work."],["Man","OK. Now I'd like to ask some questions about your journey today, if that's OK."],["Sophie","Yes. No problem."],["Man","Right, so can you tell me which station you're travelling back to?"],["Sophie","Staunfirth, where I live."],["Man","Can I just check the spelling? S-T-A-U-N-F-I-R-T-H?"],["Sophie","That's right."],["Man","And you travelled from there this morning?"],["Sophie","Yes."]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"OK, good. Next, can I ask what kind of ticket you bought?…","to":"…So to answer your question…","lines":[["Sophie","No, I just got a normal [return] [ticket]."],["Sophie","I don't have a [rail] [card] so I didn't get any [discount]."],["Sophie","I [paid] £[23.70]."],["Sophie","So to answer your question... I got an [e-ticket] [online]."]],"mcq":[["Why didn't Sophie get a discount?",["The ticket office was closed","She bought it a week early","She doesn't own a rail card"],2,"Audio: 'I don't have a rail card' = cô ấy không sở hữu (own) thẻ đường sắt."],["What does Sophie think about the price?",["It is good value","It is fine for the journey","It is too expensive"],2,"Audio: 'Not really. I think it's too much' = quá đắt (expensive)."],["Why didn't Sophie buy her ticket a week before?",["It is cheaper to buy on the day","She decided to come later","The ticket machines were broken"],1,"Audio: 'I didn't know I was coming then' = cô ấy quyết định đi muộn hơn (decided later)."]],"transcript":[["Man","OK, good. Next, can I ask what kind of ticket you bought? I assume it wasn't a season ticket, as you don't travel every day."],["Sophie","That's right. No, I just got a normal return ticket. I don't have a rail card so I didn't get any discount. I keep meaning to get one because it's a lot cheaper."],["Man","Yes — you'd have saved 20% on your ticket today. So you paid the full price for your ticket?"],["Sophie","I paid £23.70."],["Man","OK. Do you think that's good value for money?"],["Sophie","Not really. I think it's too much for a journey that only takes 45 minutes."],["Man","Yes, that's one of the main complaints we get. So, you didn't buy your ticket in advance?"],["Sophie","No. I know it's cheaper if you buy a week in advance but I didn't know I was coming then."],["Man","I know. You can't always plan ahead. So, did you buy it this morning?"],["Sophie","No, it was yesterday."],["Man","Right. And do you usually buy your tickets at the station?"],["Sophie","Well, I do usually but the ticket office closes early and I hate using ticket machines. I think ticket offices should be open for longer hours. There's always a queue for the machines and they're often out of order."],["Man","A lot of customers are saying the same thing."],["Sophie","So to answer your question... I got an e-ticket online."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"OK. Thank you. Now I'd like to ask you about your satisfaction…","to":"hết Part 1","lines":[["Sophie","Well, normally, the trains run on [time] and are pretty [reliable] but today there was a [delay]; the train was about 15 minutes behind schedule."],["Sophie","I think the best thing is that they've improved the amount of [information] about train [times] etc. that's given to [passengers] — it's much clearer."],["Sophie","But one thing is that there aren't [enough] places to [sit] down, especially on the [platforms]."],["Man","What about the [parking] at the [station]?"]],"mcq":[["What is Sophie most satisfied with on the train?",["The work desks","The internet connection","The friendly staff"],1,"Audio: 'I like the wifi on the train' = kết nối internet."],["What are the trains usually like?",["They are normally punctual","They are often behind schedule","They are very old"],0,"Audio: 'the trains run on time and are pretty reliable' = thường đúng giờ (punctual)."],["What does Sophie think about the station overall?",["Things are mostly better now","The café is too small","Nothing has really improved"],0,"Audio: 'things have generally improved a lot' = nhìn chung mọi thứ tốt hơn (mostly better)."]],"transcript":[["Man","OK. Thank you. Now I'd like to ask you about your satisfaction with your journey. So what would you say you were most satisfied with today?"],["Sophie","Well, I like the wifi on the train. It's improved a lot. It makes it easier for me to work if I want to."],["Man","That's the first time today anyone's mentioned that. It's good to get some positive feedback on that."],["Sophie","Mmm."],["Man","And, is there anything you weren't satisfied with?"],["Sophie","Well, normally, the trains run on time and are pretty reliable but today there was a delay; the train was about 15 minutes behind schedule."],["Man","OK. I'll put that down. Now I'd also like to ask about the facilities at this station. You've probably noticed that the whole station's been upgraded. What are you most satisfied with?"],["Sophie","I think the best thing is that they've improved the amount of information about train times etc. that's given to passengers — it's much clearer — before there was only one board and I couldn't always see it properly — which was frustrating."],["Man","That's good. And is there anything you're not satisfied with?"],["Sophie","Let's see ... I think things have generally improved a lot. The trains are much more modern and I like the new café. But one thing is that there aren't enough places to sit down, especially on the platforms."],["Man","OK — so I'll put 'seating' down, shall I, as the thing you're least satisfied with?"],["Sophie","Yes. OK."],["Man","Can I ask your opinion about some of the other facilities? We'd like feedback on whether people are satisfied, dissatisfied or neither satisfied nor dissatisfied."],["Sophie","OK."],["Man","What about the parking at the station?"],["Sophie","Well to be honest, I don't really have an opinion as I never use it."],["Man","So, neither satisfied nor dissatisfied for that then."],["Sophie","Yes, I suppose so ..."],["Man","OK, and what about ...?"]]}],"key":[["journalist"],["shopping"],["Staunfirth"],["return"],["23.70","£23.70"],["online"],["delay"],["information"],["platforms","platform"],["parking"]],"anyOrder":[],"keyNote":"Q3: tên riêng viết hoa, đánh vần S-T-A-U-N-F-I-R-T-H. Q5: viết đúng 23.70 (dấu £ đã có sẵn trên đề). Q9: platforms (số nhiều như trong bài nghe).","answerLines":[["SOPHIE","I'm a [journalist]."],["SOPHIE","I came here to do some [shopping]."],["SOPHIE","[Staunfirth], where I live."],["SOPHIE","No, I just got a normal [return] ticket."],["SOPHIE","I paid £[23.70]."],["SOPHIE","So to answer your question... I got an e-ticket [online]."],["SOPHIE","Well, normally, the trains run on time and are pretty reliable but today there was a [delay]; the train was about 15 minutes behind schedule."],["SOPHIE","I think the best thing is that they've improved the amount of [information] about train times etc. that's given to passengers - it's much clearer - before there was only one board and I couldn't always see it properly - which was frustrating."],["SOPHIE","But one thing is that there aren't enough places to sit down, especially on the [platforms]."],["MAN","What about the [parking] at the station?"]],"para":[["Reason for travel today","the reason for your visit here today"],["Name of station returning to","which station you're travelling back to"],["Least satisfied with","anything you weren't satisfied with"],["lack of seats","there aren't enough places to sit down"],["Neither satisfied nor dissatisfied","I don't really have an opinion as I never use it"]],"answerSource":"transcript","audio":{"src":"audio/sa-c15t4.mp3","segs":{"A":[95.7,164.3],"B":[162.9,246.7],"C":[245.3,404.8]},"conv":[96.6,403.5]},"phrases":[["Do you mind if I + V?","Bạn có phiền không nếu tôi …? Xin phép rất lịch sự.","Do you mind if I ask you some questions about your journey today?","Chị có phiền không nếu tôi hỏi vài et an idea first."],["","Well, that's fine."],["","We've got plenty here when you come."],["","If you've got a minute, could I just check a couple of points about insurance?"],["","I got one policy through the post but I'd like to see if yours is better."],["","Fine."],["","What would you like to know?"],["","Well, the one I've got has benefits and then the maximum amount you can claim."],["","Is that like yours?"],["","Yes, that's how most of them are."],["","Well, the first thing is cancellation."],["","If the holiday's cancelled on the policy I've got, you can claim £8,000."],["","We can improve on that, Ms Nash."],["","For Greek Island holidays, our maximum is £10.000."],["","That's good of course our holiday won't even cost £1,000 together!"],["","It's still sensible to have good cover."],["","Now, if you go to hospital, we allow £600."],["","Yes, mine's similar."],["","And we also allow a relative to travel to your holiday resort."],["","My policy just says their representative will help you."],["","You can see there's another difference there."],["","And what happens if you don't get on the plane?"],["","Nothing, as far as I can see on this form."],["","Don't you have missed departure?"],["","No, I'll just jot that down."],["","We pay up to £1,000 for that, depending on the reason."],["","And we're particularly generous about loss of personal belongings - up to £3,000, but not more than £500 for a single item."],["","Then I'd better not take my laptop!"],["","Not unless you insure it separately."],["","OK- thanks very much for your time - you've really been helpful."],["","Can I get back to you?"],["","Your name is?"],["","Ben-Ludlow."],["","That's L-U-D-L-O-W."],["","I'm the Assistant Manager here."],["","I'll give you my number."],["","It's 081260 543216."],["","But didn't I phone 081260 567294?"],["","That's what I've got on the paper."],["","That's the main switchboard."],["","I've given you my direct line."],["","Right, thank you..."]]}],"key":[["300"],[ oạt","Because a lot of parents work, we do offer flexible start and finish times."],["mature","chín chắn, trưởng thành (hơn tuổi)","She's quite mature for her age and she can already write her name and read a little."],["medical conditions","bệnh lý, vấn đề sức khoẻ","Now, does she have any medical conditions we need to know about?"],["asthma","bệnh hen suyễn","Does she have asthma or any hearing problems for example?"],["emergency contact","người liên hệ khi khẩn cấp","Now, I also need emergency contact details."],["get hold of sb","liên lạc được với ai","Just the name and number of a friend or family member we can contact in case we can't get hold of you at any time."],["fees","học phí, phí","How much are the fees each term?"],["term","học kỳ","You can choose to pay at the end of each term or we do offer a slightly discounted rate if you pay every month."],["discounted rate","mức giá được giảm","You can choose to pay at the end of each term or we do offer a slightly discounted rate if you pay every month."],["invoice","hoá đơn (yêu cầu thanh toán)","No, we send out invoices once the children start at the centre."],["budget (v)","tính toán chi tiêu","I find it easier to budget that way and I'm not used to the term dates just yet."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Good morning. Welcome to the Early Learning Childcare Centre…","to":"…because she has swimming on Friday.","lines":[["DIRECTOR","I'll put [four] down because that's how [old] she'll be when she [starts]."],["CAROL","It's [46] [Wombat] Road, that's W-O-M-B-A-T."],["DIRECTOR","Monday's fine, but I think the centre is already [full] for [Wednesday]."],["CAROL","I suppose [Thursday] would be all right because she has [swimming] on Friday."]],"mcq":[["When did Carol first contact the centre?",["This morning","Next year","Seven days ago"],2,"Audio: 'I spoke to you last week' = cách đây bảy ngày."],["What does the director say about Monday?",["It is very popular","There is space that day","The centre is closed"],1,"Audio: 'Monday's fine' = hôm đó còn chỗ."],["Why can't Kate come on Wednesday?",["Kate has swimming","There are no places left","The centre is closed then"],1,"Audio: 'the centre is already full for Wednesday' = hết chỗ rồi."]],"transcript":[["Director","Good morning. Welcome to the Early Learning Childcare Centre. How may I help you?"],["Carol","Hi. I spoke to you last week about enrolling my daughter for next year."],["Director","Oh, yes. I'll just get some details from you. So, you're her mother?"],["Carol","That's right."],["Director","And, can I have your name?"],["Carol","It's Carol, Carol Smith."],["Director","And your daughter's name?"],["Carol","It's Kate."],["Director","Now, we have several groups at the centre and we cater for children from three to five years old. How old is your daughter?"],["Carol","She's three now but she turns four next month."],["Director","I'll put four down because that's how old she'll be when she starts."],["Carol","Fine, she's so excited about her birthday and coming to the centre."],["Director","That's good to hear. And what's your address?"],["Carol","It's 46 Wombat Road, that's W-O-M-B-A-T. Woodside 4032."],["Director","And what's the phone number?"],["Carol","Oh it's... 3345 9865."],["Director","So, have you decided on the days you'd like to bring your daughter here?"],["Carol","I'd prefer Monday and Wednesday if possible."],["Director","Mmm. I'll check, Monday's fine, but I think the centre is already full for Wednesday. Erm. Yes. Sorry. It seems to be a very popular day. We can offer you a Thursday or a Friday as well."],["Carol","Oh dear. I suppose Thursday would be all right because she has swimming on Friday."]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"OK, got that. Because a lot of parents work…","to":"…she can't see much without them.","lines":[["CAROL","I need to get to [work] in the city by 9:00 so I'll drop her off at [8:30]."],["DIRECTOR","Well, I'll put her in the [red] group and we can always change her to the [green] one if there are any problems."],["CAROL","Yes, she'll [only] need [lunch]."],["CAROL","But she does need to [wear] [glasses]."]],"mcq":[["Why are the start and finish times flexible?",["Children are very young","The city is far away","Many parents have jobs"],2,"Audio: 'Because a lot of parents work' = nhiều phụ huynh đi làm."],["Why will Carol have enough time to get to work?",["She starts work at noon","The centre is not far from town","She works at the centre"],1,"Audio: 'You're pretty close to the city here' = trung tâm gần thành phố."],["What does Carol say about Kate?",["She is advanced for a three-year-old","She cannot write yet","She is often ill"],0,"Audio: 'She's quite mature for her age' = phát triển sớm so với tuổi."]],"transcript":[["Director","OK, got that. Because a lot of parents work, we do offer flexible start and finish times. We are open from 7:30 in the morning until 6 o'clock at night. What time would you like your daughter to start?"],["Carol","I need to get to work in the city by 9:00 so I'll drop her off at 8:30.   You're pretty close to the city here so that should give me plenty of time to get there."],["Director","That's fine. Now, we also need to decide which group she'll be in. We have two different groups and they're divided up according to age. There's the green group, which is for three- to four-year-olds. And then there's the red group which is for four- to five-year-olds."],["Carol","She's quite mature for her age and she can already write her name and read a little."],["Director","Well, I'll put her in the red group and we can always change her to the green one if there are any problems."],["Carol","That sounds fine."],["Director","OK. Let's move on to meals. We can provide breakfast, lunch and dinner. As she's finishing pretty early, she won't need dinner, will you give her breakfast before she comes?"],["Carol","Yes, she'll only need lunch."],["Director","Oh, I'll make a note of that. Now, does she have any medical conditions we need to know about? Does she have asthma or any hearing problems for example?"],["Carol","No. But she does need to wear glasses."],["Carol","Yes, she's pretty good about wearing them, she can't see much without them."]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"Right. OK. Now, I also need emergency contact details…","to":"hết Part 1","lines":[["CAROL","That'd better be my [sister]... Jenny [Ball]."],["DIRECTOR","So she is the [child]'s [aunt]?"],["DIRECTOR","Well, for [two] [days] and the [hours] you've chosen, that will be $450 altogether."],["DIRECTOR","You can choose to pay at the end of each [term] or we do offer a slightly [discounted] rate if you pay every [month]."]],"mcq":[["When will the centre use the emergency contact?",["Every day after school","If they cannot reach Carol","When a friend visits"],1,"Audio: 'in case we can't get hold of you' = khi không liên lạc được với Carol."],["When will Carol get the bill?",["At the end of each term","After Kate begins at the centre","Today, before she leaves"],1,"Audio: 'we send out invoices once the children start' = sau khi bé bắt đầu đi học."],["Why does Carol like her payment choice?",["It helps her plan her money","It is the only choice","She knows the term dates well"],0,"Audio: 'I find it easier to budget that way' = giúp cô dễ tính toán chi tiêu."]],"transcript":[["Director","Right. OK. Now, I also need emergency contact details."],["Carol","So what sort of information do you need?"],["Director","Just the name and number of a friend or family member we can contact in case we can't get hold of you at any time."],["Carol","OK. That'd better be my sister... Jenny Ball. That's B-A-double L.   Her phone number is 3346 7523."],["Director","Great. So she is the child's aunt?"],["Carol","Yes, that's right."],["Director","I'll make a note of that as well. Now, is there anything you'd like to ask?"],["Carol","What about payment? How much are the fees each term?"],["Director","Well, for two days and the hours you've chosen, that will be $450 altogether."],["Carol","OK, and do I have to pay that now?"],["Director","No, we send out invoices once the children start at the centre. You can choose to pay at the end of each term or we do offer a slightly discounted rate if you pay every month."],["Carol","Oh. I'll do that then. I find it easier to budget that way and I'm not used to the term dates just yet."],["Director","Good, it makes it a lot simpler for us as well. Well, that's everything. Would you like me to show you around...?"]]}],"key":[["4","four"],["46 Wombat"],["Thursday"],["8.30","8:30"],["red"],["lunch"],["glasses"],["Ball"],["aunt"],["month"]],"anyOrder":[],"keyNote":"Q2: phải có cả số nhà và tên đường, Wombat viết hoa (W-O-M-B-A-T). Q3: thứ trong tuần viết hoa. Q8: họ riêng viết hoa, đánh vần B-A-double L.","answerLines":[["DIRECTOR","I'll put [four] down because that's how old she'll be when she starts."],["CAROL","It's [46] [Wombat] Road, that's W-O-M-B-A-T."],["CAROL","I suppose [Thursday] would be all right because she has swimming on Friday."],["CAROL","I need to get to work in the city by 9:00 so I'll drop her off at [8:30]."],["DIRECTOR","Well, I'll put her in the [red] group and we can always change her to the green one if there are any problems."],["CAROL","Yes, she'll only need [lunch]."],["CAROL","But she does need to wear [glasses]."],["CAROL","That'd better be my sister... Jenny [Ball]."],["DIRECTOR","So she is the child's [aunt]?"],["DIRECTOR","You can choose to pay at the end of each term or we do offer a slightly discounted rate if you pay every [month]."]],"para":[["Start time","What time would you like your daughter to start?"],["Which meal/s are required each day?","we can provide breakfast, lunch and dinner … she'll only need …"],["Medical conditions","any medical conditions … asthma or any hearing problems"],["Relationship to child","So she is the child's …?"],["Will pay each …","if you pay every ember the first."],["raise money for a charity","gây quỹ cho tổ chức từ thiện","Well, we're organising a dinner to raise money for a charity, and we're hoping for at least 150 people, so I think we'll go for the Main Hall."],["deposit (returnable)","tiền đặt cọc (được trả lại)","And I have to tell you there's also a deposit of £250, which is returnable of course as long as there's no damage."],["insist","yêu cầu bắt buộc, khăng khăng","But we do insist that this is paid in cash, we don't take cards for that."],["licence","giấy phép","For example, you'll have to see about getting a licence if you're planning to have any music during the meal."],["straightforward","đơn giản, dễ làm","It's quite straightforward, I'll give you the details later on."],["caretaker","người trông coi toà nhà","And about a week or ten days before your event you'll need to contact the caretaker, that's Mr Evans, to make the arrangements for entry - he'll sort that out with you."],["fiddle about with","nghịch, táy máy (đồ vật)","you must make sure that no one fiddles about with the black box by the fire door"],["legal requirement","yêu cầu theo luật","It's a legal requirement."],["premises","khu nhà, cơ sở (toà nhà và khuôn viên)","Right, now when the event is over we do ask that the premises are left in good condition."],["detergent","chất tẩy rửa","It's got all the cleaning equipment, brushes and detergent and so on."],["rubbish","rác","Then you'll be provided with black plastic bags, so all the rubbish must be collected up and left outside the door."],["stack up","xếp chồng lên","And the chairs and tables should be stacked up neatly at the back of the room."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–4","from":"Hello? Oh, hello. I wanted to enquire about hiring…","to":"…Yeah, that's all included.","lines":[["OFFICIAL","The [Charlton] Room - C-H-A-R-L-T-O-N. That's got [seating] for up to one [hundred]."],["OFFICIAL","So from six pm to midnight that'd be £[115] - that's the [weekend]
