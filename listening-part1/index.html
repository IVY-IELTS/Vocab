o lives locally, is going to start the races."],["launch","thả (xuống nước)","All the ducks will be launched into the river at the back of the cinema"],["float","trôi, nổi trên nước","then they'll float along the river for 500 metres, as far as the railway bridge."],["finishing line","vạch đích","Yes, the first duck in each race to arrive at the finishing line wins its owner free tickets for the concert on the last night of the festival."],["stall","quầy hàng, sạp","They're on sale at a stall in the market."],["enormous","rất to, khổng lồ","it's got an enormous sign showing a couple of ducks."],["admission","việc vào cửa / phí vào cửa","Well, admission is free, and the show is being held in Bythwaite Hall."],["recognise","nhận ra","It's the only old building in the town, so it's easy to recognise."],["award (v)","trao (giải thưởng)","if you'd like to see the prizes being awarded for the best flowers, you'll need to be there at 5 o'clock."],["babysitter","người trông trẻ","and leave your children with a babysitter"],["frightening","đáng sợ","and children might find it rather frightening."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Good morning. Stretton Festival box office…","to":"…as far as the railway bridge.","lines":[["Rob","Yes, that's right, the [secondary] [school]."],["Rob","Make sure you don't go to the [primary] school by [mistake]!"],["Melanie","Doesn't she play the [oboe], or [flute] or something?"],["Rob","All the [ducks] will be launched into the river at the back of the [cinema], then they'll float along the river for 500 metres, as far as the railway [bridge]."]],"mcq":[["What does Rob say about the £12 jazz seats?",["They cost £15 now","They are at the primary school","None of them are left"],2,"Audio: 'The £12 seats have all been sold' = không còn vé nào (none are left)."],["What is new for Carolyn Hart at this event?",["She usually plays on the radio","She has never played jazz before","She will sing with the band"],1,"Audio: 'this is her first time with a jazz band' = trước đây chưa từng chơi jazz (never played jazz before)."],["Who will start the duck races?",["A local sports star","Melanie's children","A swimmer from another town"],0,"Audio: 'a champion swimmer who lives locally' = ngôi sao thể thao địa phương (local sports star)."]],"transcript":[["Rob","Good morning. Stretton Festival box office. How can I help you?"],["Melanie","Oh, hello. My family and I are on holiday in the area, and we've seen some posters about the festival this week. Could you tell me about some of the events, please?"],["Rob","Of course."],["Melanie","First of all, are there still tickets available for the jazz band on Saturday?"],["Rob","There are, but only £15. The £12 seats have all been sold."],["Melanie","OK. And the venue is the school, isn't it?"],["Rob","Yes, that's right, the secondary school. Make sure you don't go to the primary school by mistake!   And there's an additional performer who isn't mentioned on the posters - Carolyn Hart is going to play with the band."],["Melanie","Oh, I think I've heard her on the radio. Doesn't she play the oboe, or flute or something?"],["Rob","Yes, the flute.   She usually plays with symphony orchestras, and apparently this is her first time with a jazz band."],["Melanie","Well, I'd certainly like to hear her. Then the next thing I want to ask about is the duck races - I saw a poster beside a river. What are they, exactly?"],["Rob","Well, you buy a yellow plastic duck - or as many as you like - they're a pound each. And you write your name on each one. There'll be several races, depending on the number of ducks taking part. And John Stevens, a champion swimmer who lives locally, is going to start the races. All the ducks will be launched into the river at the back of the cinema,   then they'll float along the river for 500 metres, as far as the railway bridge."]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"And are there any prizes?…","to":"…I'll definitely go to the prize-giving.","lines":[["Rob","Yes, the first duck in each race to arrive at the [finishing] line wins its owner free [tickets] for the [concert] on the last night of the festival."],["Rob","They're on sale at a [stall] in the [market]."],["Rob","Well, [admission] is free, and the [show] is being held in [Bythwaite] Hall."],["Rob","The prizes are being given by a [famous] [actor], Kevin Shapless."]],"mcq":[["How can Melanie find the duck stall?",["It has a huge sign","It has two small ducks outside","It is next to the river"],0,"Audio: 'it's got an enormous sign' = có tấm biển rất lớn (huge sign)."],["Where is the flower show building?",["It is hard to find","It is the town's only new building","In the middle of town"],2,"Audio: 'It's right in the centre of Stretton' = ở giữa thị trấn (in the middle of town)."],["Why should Melanie be there at 5 o'clock?",["To buy the best flowers","Because the show closes then","To watch the winners get prizes"],2,"Audio: 'see the prizes being awarded for the best flowers' = xem người thắng nhận giải (watch the winners get prizes)."]],"transcript":[["Melanie","And are there any prizes?"],["Rob","Yes, the first duck in each race to arrive at the finishing line wins its owner free tickets for the concert on the last night of the festival."],["Melanie","You said you can buy a duck? I'm sure my children will both want one."],["Rob","They're on sale at a stall in the market.   You can't miss it - it's got an enormous sign showing a couple of ducks."],["Melanie","OK. I'll go there this afternoon. I remember walking past there yesterday. Now could you tell me something about the flower show, please?"],["Rob","Well, admission is free, and the show is being held in Bythwaite Hall."],["Melanie","Sorry, how do you spell that?"],["Rob","B-Y-T-H-W-A-I-T-E. Bythwaite."],["Melanie","Is it easy to find? I'm not very familiar with the town yet."],["Rob","Oh, you won't have any problem. It's right in the centre of Stretton. It's the only old building in the town, so it's easy to recognise."],["Melanie","I know it. I presume it's open all day."],["Rob","Yes, but if you'd like to see the prizes being awarded for the best flowers, you'll need to be there at 5 o'clock. The prizes are being given by a famous actor, Kevin Shapless.   He lives nearby and gets involved in a lot of community events."],["Melanie","Gosh, I've seen him on TV. I'll definitely go to the prize-giving."],["Rob","Right."]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"I've seen a list of plays that are being performed…","to":"hết Part 1","lines":[["Rob","That's [aimed] at [five] to ten-year-olds."],["Rob","If you'd like something for yourself and your husband, and leave your children with a [babysitter], you might like to see 'Fire and Flood' - it's about events that really [happened] in Stretton two hundred years ago, and children might find it rather [frightening]."],["Rob","That's a [comedy], and it's for [young] and old."],["Rob","In fact, it won an award in the Stretton [Drama] [Festival] a couple of months ago."]],"mcq":[["How old are Melanie's children?",["Five and ten","Seven and eleven","Both under eight"],2,"Audio: 'Five and seven' = cả hai đều dưới 8 tuổi (both under eight)."],["What is 'Fire and Flood' about?",["A fire at the festival","A story set in the future","True history of the town"],2,"Audio: 'events that really happened in Stretton two hundred years ago' = lịch sử có thật của thị trấn (true history)."],["What happened to 'Silly Sailor' recently?",["It got a prize","It was stopped by the town","It opened the drama festival"],0,"Audio: 'it won an award ... a couple of months ago' = đã nhận giải thưởng (got a prize)."]],"transcript":[["Melanie","I've seen a list of plays that are being performed this week, and I'd like to know which are suitable for my children, and which ones my husband and I might go to."],["Rob","How old are your children?"],["Melanie","Five and seven. What about 'The Mystery of Muldoon'?"],["Rob","That's aimed at five to ten-year-olds."],["Melanie","So if I take my children, I can expect them to enjoy it more than I do?"],["Rob","I think so. If you'd like something for yourself and your husband, and leave your children with a babysitter, you might like to see 'Fire and Flood' - it's about events that really happened in Stretton two hundred years ago, and children might find it rather frightening."],["Melanie","Oh, thanks for the warning. And finally, what about 'Silly Sailor'?"],["Rob","That's a comedy, and it's for young and old. In fact, it won an award in the Stretton Drama Festival a couple of months ago."],["Melanie","OK. Well, goodbye, and thanks for all the information. I'm looking forward to the festival!"],["Rob","Goodbye."]]}],"key":[["secondary"],["flute"],["cinema"],["concert"],["market"],["Bythwaite"],["actor"],["A"],["B"],["C"]],"anyOrder":[],"keyNote":"Q6: tên riêng viết hoa, đánh vần B-Y-T-H-W-A-I-T-E. Q8–10: chỉ ghi chữ cái A, B hoặc C.","answerLines":[["ROB","Yes, that's right, the [secondary] school."],["ROB","Yes, the [flute]."],["ROB","All the ducks will be launched into the river at the back of the [cinema], then they'll float along the river for 500 metres, as far as the railway bridge."],["ROB","Yes, the first duck in each race to arrive at the finishing line wins its owner free tickets for the [concert] on the last night of the festival."],["ROB","They're on sale at a stall in the [market]."],["ROB","B-Y-T-H-W-A-I-T-E. [Bythwaite]."],["ROB","The prizes are being given by a famous [actor], Kevin Shapless."],["ROB","That's aimed at [five] to [ten-year-olds]."],["ROB","If you'd like something for yourself and your husband, and leave your children with a babysitter, you might like to see 'Fire and Flood' - it's about events that really happened in Stretton two hundred years ago, and children might find it rather [frightening]."],["ROB","That's a comedy, and it's for [young] and [old]."]],"para":[["Start behind the …","launched into the r i."],["look forward to + N / V-ing","Mong chờ điều gì; sau 'to' là danh từ hoặc V-ing.","I'm looking forward to the festival!","Tôi rất mong chờ lễ hội!"]],"spellnum":[["A","The [£12] seats have all been sold.",["12","£12"],"Giá loại vé đã bán hết",[189.2,199.7]],["B","[B-Y-T-H-W-A-I-T-E]. Bythwaite.",["Bythwaite"],"Tên hội trường (được đánh vần)",[304.1,314.6]],["B","you'll need to be there at [5 o'clock].",["5","5 o'clock","five o'clock","5 pm","5pm"],"Giờ trao giải hoa",[332.2,342.7]],["C","That's aimed at [five to ten]-year-olds.",["5-10","5 to 10","five to ten","5–10"],"Độ tuổi xem vở 'The Mystery of Muldoon'",[397.2,407.7]]],"synonyms":[["have all been sold","none are left","đã bán hết"],["an additional performer","an extra musician","thêm một người biểu diễn"],["a champion swimmer who lives locally","a local sports star","nhà vô địch bơi lội sống ở địa phương"],["at the back of the cinema","behind the cinema","phía sau rạp chiếu phim"],["on sale at a stall","can be bought at a stall","được bán ở một quầy"],["admission is free","no charge to enter","vào cửa miễn phí"],["a famous actor","a well-known actor","một diễn viên nổi tiếng"],["it won an award","it got a prize","nó đã đoạt giải"]],"newtest":{"type":"notes","title":"Stretton Festival – visitor notes","instruction":"Complete the notes below.","limit":"ONE WORD AND/OR A NUMBER","maxWords":1,"example":["Day of jazz band concert:","Saturday"],"sections":[{"heading":"Jazz band","lines":[["Seats still available: £","",["15"]],["Extra performer: Carolyn","",["Hart"]],["She usually plays with symphony orchestras","",null]]},{"heading":"Duck races","lines":[["Colour of plastic ducks:","",["yellow"]],["Price: £","per duck",["1","one"]],["Races started by John Stevens, a local","",["swimmer"]],["Ducks float","metres along the river",["500"]],["Finish: the","bridge",["railway"]]]},{"heading":"Flower show","lines":[["Admission: free","",null],["Bythwaite Hall is in the","of Stretton",["centre","center"]],["It is the only old","in the town",["building"]],["Prize-giving at 5 o'clock","",null]]},{"heading":"Plays","lines":[["'Fire and Flood': about events","years ago",["200","two hundred"]],["'Silly Sailor': a comedy for young and old","",null]]}]}},{"id":"da-c12t6","topic":"Daily Activities","code":"Cam 12 · Test 6 · Part 1","title":"Events during Kenton Festival","intro":"Một người phụ nữ sắp đến Kenton nghỉ lễ gọi điện cho phòng vé Kenton Festival để hỏi về chương trình các sự kiện của lễ hội.","testPdf":"https://drive.google.com/file/d/1P02jR88jC-7eJhHsqKA9lE1Me41bz9pB/view","vocab":[["gather","tụ tập","People start gathering around 2 o'clock, to get a good place to see from"],["spot","chỗ, vị trí","I'll make sure I get there early to get a good spot."],["officially","một cách chính thức","The festival will be officially opened by the mayor."],["town councillor","ủy viên hội đồng thị trấn","All the town councillors will be there, and of course lots of other people."],["choir","dàn hợp xướng","Most years we have a children's choir"],["army cadets","học viên quân đội (thiếu sinh quân)","but this year the local army cadets offered to perform, and they're very good."],["community group","nhóm cộng đồng (người dân địa phương)","After that, a community group from the town will perform a play they've written themselves"],["centenary","lễ kỷ niệm 100 năm","so we're celebrating her centenary."],["biologist","nhà sinh vật học","I'm a biologist, so I've always been interested in her."],["firework display","màn bắn pháo hoa","there'll be a firework display."],["opposite side","phía đối diện, bờ bên kia","and the display takes place on the opposite side of the river."],["relationship","mối quan hệ","all connected with relationships between children and their grandparents."],["demonstration","buổi trình diễn","but there'll be a demonstration of traditional dances from all round the country."],["covered market","chợ có mái che","the outdoor one, not the covered market."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–4","from":"Good morning, Kenton Festival box office…","to":"…I didn't realise she came from Kenton.","lines":[["Man","People start [gathering] around [2] o'clock, to get a good place to see from, and the events will start at [2.45], and finish about 5.30."],["Man","Then there'll be a [performance] by a [band]."],["Man","After that, a [community] group from the town will perform a [play] they've written themselves, just a short one."],["Woman","She was a [scientist] [years] ago."]],"mcq":[["Why do people arrive early on the first day?",["To hear the children's choir","To meet the town councillors","To get a good view"],2,"Audio: 'to get a good place to see from' = để có chỗ xem tốt (get a good view)."],["Who usually performs, but not this year?",["The town councillors","A group of young singers","The local army cadets"],1,"Audio: 'Most years we have a children's choir' = thường có nhóm ca sĩ nhỏ tuổi (group of young singers)."],["Why is Helen Tungate special this year?",["She is a biologist in Kenton","She opened the festival","It is her 100th birthday year"],2,"Audio: 'born in Kenton exactly 100 years ago ... her centenary' = năm kỷ niệm 100 năm ngày sinh (100th birthday year)."]],"transcript":[["Man","Good morning, Kenton Festival box office. How can I help you?"],["Woman","Oh, good morning. I'm coming to Kenton for a few days' holiday next month, and a friend told me there's a festival. She gave me this number to find out about it."],["Man","That's right, the festival begins on the 16th of May and goes on till the 19th."],["Woman","Oh, that's great. I'll be there from the 15th till the 19th. So could you tell me the programme, please?"],["Man","Well, on the first day, there's the opening ceremony, in the town centre. People start gathering around 2 o'clock, to get a good place to see from, and the events will start at 2.45,   and finish about 5.30."],["Woman","OK, thanks. I'll make sure I get there early to get a good spot."],["Man","The festival will be officially opened by the mayor. He'll just speak for a few minutes, welcoming everyone to the festival. All the town councillors will be there, and of course lots of other people."],["Woman","Right."],["Man","Then there'll be a performance by a band.   Most years we have a children's choir, but this year the local army cadets offered to perform, and they're very good."],["Woman","Uhuh."],["Man","After that, a community group from the town will perform a play they've written themselves, just a short one.   It's about Helen Tungate. I don't know if you've heard of her?"],["Woman","I certainly have. She was a scientist years ago."],["Man","That's right. She was born in Kenton exactly 100 years ago, so we're celebrating her centenary."],["Woman","I'm a biologist, so I've always been interested in her. I didn't realise she came from Kenton."]]},{"id":"B","title":"Đoạn B","qs":"Q5–7","from":"Yes. Well, all that will take place in the afternoon…","to":"…It's close to the Town Hall.","lines":[["Man","Yes. Well, all that will take place in the [afternoon], and later, as the sun sets, there'll be a [firework] [display]."],["Man","You should go to the park to watch, as you'll get the best [view] from there, and the display takes place on the [opposite] side of the [river]."],["Man","For example, the students of the art college have produced a number of [videos], all connected with [relationships] between children and their [grandparents]."],["Man","Because the art college is in use for [classes], throughout the festival, the videos are being shown in [Handsworth] House."]],"mcq":[["When is the firework display?",["In the afternoon","In the early evening","At midnight"],1,"Audio: 'later, as the sun sets' = lúc chiều tối khi mặt trời lặn (early evening)."],["Who made the videos?",["Local TV workers","People studying art","Children and their parents"],1,"Audio: 'the students of the art college have produced ... videos' = những người học nghệ thuật (people studying art)."],["Why are the videos not shown at the art college?",["Lessons are still going on there","The college is too small","It is close to the Town Hall"],0,"Audio: 'the art college is in use for classes' = vẫn đang có lớp học ở đó (lessons are still going on)."]],"transcript":[["Man","Yes. Well, all that will take place in the afternoon, and later, as the sun sets, there'll be a firework display. You should go to the park to watch, as you'll get the best view from there, and the display takes place on the opposite side of the river.   It's always one of the most popular events in the festival."],["Woman","Sounds great."],["Woman","And what's happening on the other days?"],["Man","There are several events that go on the whole time. For example, the students of the art college have produced a number of videos, all connected with relationships between children and their grandparents."],["Woman","That sounds interesting. It makes a change from children and parents, doesn't it!"],["Man","Exactly. Because the art college is in use for classes, throughout the festival, the videos are being shown in Handsworth House."],["Woman","How do you spell the name?"],["Man","H-A-N-D-S-W-O-R-T-H. Handsworth House.   It's close to the Town Hall."],["Woman","Right."]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"Now let me see, what else can I tell…","to":"hết Part 1","lines":[["Man","There isn't any [ballet], I'm afraid, but there'll be a demonstration of [traditional] [dances] from all round the country."],["Man","It's in the [market] in the town centre - the [outdoor] one, not the [covered] market."],["Man","And it's on at 2 and 5 every [afternoon] of the festival, apart from the [first] day."],["Man","Yes, you can book [online], or you can buy them when you arrive in Kenton, either at the festival box office, or from any [shops] displaying our [logo] in the windows."]],"mcq":[["When can she see the dance show?",["Every morning at 2","Twice daily, except day one","Only on the first day"],1,"Audio: 'at 2 and 5 every afternoon ... apart from the first day' = hai lần mỗi ngày, trừ ngày đầu (twice daily, except day one)."],["Who will give the concerts?",["Mostly professional musicians","Three groups of local children","Only library staff"],0,"Audio: 'Three performed by professionals, and one by local children' = phần lớn là nhạc công chuyên nghiệp (mostly professional musicians)."],["How can she get concert tickets?",["Only at the door","Only at the library in Park Street","On the internet or in Kenton"],2,"Audio: 'you can book online, or ... buy them when you arrive in Kenton' = mua trên mạng hoặc ở Kenton (on the internet or in Kenton)."]],"transcript":[["Man","Now let me see, what else can I tell you about?"],["Woman","Are there any displays of ballet dancing? I'm particularly interested in that as I do it as a hobby."],["Man","There isn't any ballet, I'm afraid, but there'll be a demonstration of traditional dances from all round the country."],["Woman","Oh, that'd be nice. Where's that being held?"],["Man","It's in the market in the town centre - the outdoor one, not the covered market.   And it's on at 2 and 5 every afternoon of the festival, apart from the first day."],["Woman","Lovely. I'm interested in all kinds of dancing, so I'm sure I'll enjoy that!"],["Man","Mmm. I'm sure you will."],["Woman","And I'd really like to go to some concerts, if there are any."],["Man","Yes, there are several. Three performed by professionals, and one by local children."],["Woman","And where is it being held?"],["Man","It's in the library, which is in Park Street. On the 18th, at 6.30 in the evening."],["Woman","I presume I'll need tickets for that."],["Man","Yes, you can book online, or you can buy them when you arrive in Kenton, either at the festival box office, or from any shops displaying our logo in the windows."],["Woman","Well, I think that'll keep me busy for the whole of my stay in Kenton. Thank you so much for all your help."],["Man","You're welcome. I hope you enjoy your stay."],["Woman","Thank you. Goodbye."]]}],"key":[["2.45","2:45"],["band"],["play"],["scientist"],["river"],["grandparents"],["Handsworth"],["traditional"],["outdoor"],["logo"]],"anyOrder":[],"keyNote":"Q1: giờ viết 2.45 (hoặc 2:45), không phải 2 o'clock. Q6: số nhiều 'grandparents'. Q7: tên riêng viết hoa, đánh vần H-A-N-D-S-W-O-R-T-H.","answerLines":[["MAN","People start gathering around 2 o'clock, to get a good place to see from, and the events will start at [2.45], and finish about 5.30."],["MAN","Then there'll be a performance by a [band]."],["MAN","After that, a community group from the town will perform a [play] they've written themselves, just a short one."],["WOMAN","She was a [scientist] years ago."],["MAN","You should go to the park to watch, as you'll get the best view from there, and the display takes place on the opposite side of the [river]."],["MAN","For example, the students of the art college have produced a number of videos, all connected with relationships between children and their [grandparents]."],["MAN","H-A-N-D-S-W-O-R-T-H. [Handsworth] House."],["MAN","There isn't any ballet, I'm afraid, but there'll be a demonstration of [traditional] dances from all round the country."],["MAN","It's in the market in the town centre - the [outdoor] one, not the covered market."],["MAN","Yes, you can book online, or you can buy them when you arrive in Kenton, either at the festival box office, or from any shops displaying our [logo] in the windows."]],"para":[["The mayor will make a speech","The festival will be officially opened by the mayor. He'll just speak for a few minutes"],["Evening fireworks display","later, as the sun sets, there'll be a firework display"],["situated across the …","takes place on the opposite side of the …"],["every day except 1st day of festival","every afternoon of the festival, apart from the first day"],["shops which have the festival … in their windows","any shops displaying our … in the windows"]],"answerSource":"transcript","audio":{"src":"audio/da-c12t6.mp3","segs":{"A":[164.4,283.6],"B":[282.2,396.7],"C":[395.3,493.9]},"conv":[165.3,492.6]},"phrases":[["make sure + mệnh đề","Đảm bảo / nhớ làm việc gì đó.","I'll make sure I get there early to get a good spot.","Tôi sẽ nhớ đến sớm để có chỗ đứng tốt."],["I don't know if you've heard of…","Không biết bạn đã nghe nói về… chưa; giới thiệu người/vật một cách lịch sự.","I don't know if you've heard of her?","Không biết chị đã nghe nói về bà ấy chưa?"],["It makes a change from + N","Khác lạ, mới mẻ so với (cái thường thấy); dùng để khen điều gì khác thường.","It makes a change from children and parents, doesn't it!","Khác hẳn chủ đề con cái và cha mẹ quen thuộc nhỉ!"],["…, I'm afraid","Tôi e là…; báo tin không vui một cách lịch sự, thường đặt cuối câu.","There isn't any ballet, I'm afraid","Tôi e là không có múa ba lê đâu"],["apart from + N","Ngoại trừ…","And it's on at 2 and 5 every afternoon of the festival, apart from the first day.","Buổi đó diễn ra lúc 2 giờ và 5 giờ mỗi chiều trong lễ hội, trừ ngày đầu tiên."],["I presume + mệnh đề","Tôi đoán / cho rằng… (khá chắc chắn).","I presume I'll need tickets for that.","Tôi đoán là tôi sẽ cần vé cho buổi đó."],["either … or …","Hoặc… hoặc…; đưa ra hai lựa chọn.","either at the festival box office, or from any shops displaying our logo in the windows.","hoặc tại phòng vé lễ hội, hoặc ở bất kỳ cửa hàng nào có dán logo của chúng tôi trên cửa kính."],["keep somebody busy","Khiến ai bận rộn (vì có nhiều việc để làm).","Well, I think that'll keep me busy for the whole of my stay in Kenton.","Chà, tôi nghĩ thế là đủ cho tôi bận rộn suốt thời gian ở Kenton rồi."]],"spellnum":[["A","the festival begins on the [16th of May]",["16 May","16th May","May 16","May 16th","16th of May"],"Ngày bắt đầu lễ hội",[181.5,192]],["A","and goes on till the [19th].",["19","19th","19 May","19th May"],"Ngày kết thúc lễ hội",[184.8,195.3]],["A","I'll be there from the [15th] till the 19th.",["15","15th","15 May","15th May"],"Ngày người phụ nữ đến Kenton",[188,198.5]],["B","[H-A-N-D-S-W-O-R-T-H]. Handsworth House.",["Handsworth"],"Tên tòa nhà chiếu video (được đánh vần)",[384.8,395.3]],["C","And it's on at [2 and 5] every afternoon of the festival",["2 and 5","2 & 5","2, 5"],"Giờ biểu diễn múa truyền thống",[423.4,433.9]],["C","On the [18th], at 6.30 in the evening.",["18","18th","18 May","18th May"],"Ngày diễn ra buổi hòa nhạc",[456.2,466.7]]],"synonyms":[["a few days' holiday","a short break","kỳ nghỉ vài ngày"],["to get a good place to see from","to get a good view","để có chỗ xem tốt"],["officially opened by the mayor","the mayor will open the festival","được thị trưởng chính thức khai mạc"],["as the sun sets","in the early evening","lúc mặt trời lặn"],["on the opposite side of the river","across the river","ở phía bên kia sông"],["in use for classes","lessons are still going on there","đang được dùng để học"],["I do it as a hobby","in my free time","tôi làm việc đó như một sở thích"],["apart from the first day","except day one","trừ ngày đầu tiên"]],"newtest":{"type":"notes","title":"Kenton Festival – programme notes","instruction":"Complete the notes below.","limit":"ONE WORD AND/OR A NUMBER","maxWords":1,"example":["Festival dates:","16th–19th May"],"sections":[{"heading":"Opening ceremony (first day)","lines":[["Place: the town","",["centre","center"]],["Events start at 2.45 and finish at about","",["5.30","5:30"]],["Festival opened by the","",["mayor"]],["Music performed by the local army","",["cadets"]],["Play about Helen Tungate, born","years ago",["100"]]]},{"heading":"Firework display","lines":[["Best view from the","",["park"]]]},{"heading":"Other events","lines":[["Videos made by students of the art","",["college"]],["Shown in Handsworth House – near the Town","",["Hall"]],["Traditional dances in the market in the town centre","",null]]},{"heading":"Concert","lines":[["Venue: the","in Park Street",["library"]],["Date and time: 18th May,","in the evening",["6.30","6:30"]]]}]}},{"id":"da-c12t8","topic":"Daily Activities","code":"Cam 12 · Test 8 · Part 1","title":"Cycle tour leader: Applicant enquiry","intro":"Margaret gọi điện cho Bob ở công ty Pembroke Cycling Holidays để ứng tuyển làm trưởng đoàn cho các chuyến du lịch bằng xe đạp.","testPdf":"https://drive.google.com/file/d/1JHTdqkabPNXHZ9Le5TUIevLAUTxSAKn4/view","vocab":[["advert","quảng cáo (tuyển người)","I've seen your advert for people to lead cycle trips."],["permanent","lâu dài, cố định","Are you looking for a permanent job, Margaret?"],["temporary","tạm thời","No, temporary."],["lawyer","luật sư","I used to be a lawyer"],["career change","sự chuyển nghề","and then I made a complete career change and I'm going to be a doctor."],["apply","nộp đơn (xin việc)","so when I saw you were advertising for tour leaders, I decided to apply."],["challenging","đầy thử thách, khó","I probably need some more experience before I go on a really challenging trip."],["teenager","thanh thiếu niên (13–19 tuổi)","That tour includes several teenagers"],["volunteer","tình nguyện viên","Yes, I'm a volunteer worker in a youth club"],["beginner","người mới bắt đầu","Before that I helped out in a cycling club where I taught beginners."],["fortnight","hai tuần","Now the trip I mentioned is just for a fortnight"],["allergic to","bị dị ứng với","Yes, I'm allergic to cheese."],["application form","đơn đăng ký / đơn xin việc","would you like me to fill in an application form?"],["relevant certificate","chứng chỉ liên quan","but we'll need to see any certificates you've got that are relevant, in cycling, first aid, or whatever."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello, Pembroke Cycling Holidays, Bob speaking…","to":"…I decided to apply.","lines":[["Margaret","No, [temporary]. I've got a [permanent] job starting in a few months' time, and I want to do something else until then."],["Margaret","This will probably sound crazy - I used to be a lawyer, and then I made a complete [career] [change] and I'm going to be a [doctor]."],["Margaret","Yes, I've led several bike [tours] in [Africa]."],["Margaret","The [trip] to India that I had arranged to lead next month has now been [cancelled], so when I saw you were advertising for tour leaders, I decided to apply."]],"mcq":[["Why does Margaret call Bob?",["To book a bike tour","To cancel her trip to India","To apply for a guide job"],2,"Audio: 'your advert for people to lead cycle trips' = xin làm hướng dẫn viên (apply for a guide job)."],["What was Margaret's first career?",["Legal work","Teaching cycling","Leading tours in India"],0,"Audio: 'I used to be a lawyer' = trước đây làm nghề luật (legal work)."],["Why is Margaret free next month?",["Her permanent job starts then","Her India trip will not happen","She has finished all her tours"],1,"Audio: 'The trip to India ... has now been cancelled' = chuyến đi Ấn Độ sẽ không diễn ra (will not happen)."]],"transcript":[["Bob","Hello, Pembroke Cycling Holidays, Bob speaking."],["Margaret","Oh hello. I've seen your advert for people to lead cycle trips. Are you the right person to speak to?"],["Bob","Yes, I am. Could I have your name, please?"],["Margaret","It's Margaret Smith."],["Bob","Are you looking for a permanent job, Margaret?"],["Margaret","No, temporary. I've got a permanent job starting in a few months' time, and I want to do something else until then. ( )"],["Bob","What work do you do?"],["Margaret","This will probably sound crazy - I used to be a lawyer, and then I made a complete career change and I'm going to be a doctor. I've just finished my training. ( )"],["Bob","Right. And have you had any experience of leading cycle trips?"],["Margaret","Yes, I've led several bike tours in Africa. The trip to India that I had arranged to lead next month has now been cancelled, so when I saw you were advertising for tour leaders, I decided to apply. ( )"]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"OK. Now we normally have two or three leaders on a trip…","to":"…we can deal with that.","lines":[["Margaret","Yes, I'm a [volunteer] worker in a [youth] club, where I help people to improve their cycling [skills]."],["Margaret","My job is due to start on [October] the 2nd, and I'm [available] from May the 1st until late [September]."],["Margaret","Yes, I'm [allergic] to [cheese]."],["Bob","No, as long as we have enough [notice], we can [deal] with that."]],"mcq":[["Why do they need an extra leader in Spain?",["Lots of people want to go","A leader is ill","The cyclists are very experienced"],0,"Audio: 'proving so popular we need an additional leader' = rất nhiều người muốn đi (lots of people want to go)."],["Why does the family tour suit Margaret?",["She wants an easier trip first","She has teenagers of her own","She wants a really challenging trip"],0,"Audio: 'I probably need some more experience before ... a really challenging trip' = muốn chuyến dễ hơn trước (easier trip first)."],["How long is the Spain trip?",["Five months","Two weeks","Until late September"],1,"Audio: 'just for a fortnight' = hai tuần (two weeks)."]],"transcript":[["Bob","OK. Now we normally have two or three leaders on a trip, depending on the size of the group. Some tours are for very experienced cyclists, but we've got a tour coming up soon in Spain, which is proving so popular we need an additional leader. It's a cycling holiday for families. Would that suit you?"],["Margaret","It certainly would. I enjoy working with children, and I probably need some more experience before I go on a really challenging trip."],["Bob","That tour includes several teenagers: have you worked with that age group before?"],["Margaret","Yes, I'm a volunteer worker in a youth club, where I help people to improve their cycling skills. Before that I helped out in a cycling club where I taught beginners. ( )"],["Bob","Well that's great. Now the trip I mentioned is just for a fortnight, but there might be the possibility of leading other tours after that. Would that fit in with your plans?"],["Margaret","That'd be fine. I'll be free for five months. My job is due to start on October the 2nd, and I'm available from May the 1st until late September. ( )"],["Bob","Good. Now is there anything I need to know about the food you eat? We usually have one or two people in the group who don't eat meat, or have some sort of food allergy, so we're always very careful about that."],["Margaret","Yes, I'm allergic to cheese. Would that be a problem? ( )"],["Bob","No, as long as we have enough notice, we can deal with that."],["Margaret","That's great."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"It sounds really interesting…","to":"hết Part 1","lines":[["Margaret","Could you [send] it to [27] [Arbuthnot] Place - A-R-B-U-T-H-N-O-T Place, Dumfries."],["Margaret","[DG7] [4PH]."],["Bob","If you could return the application [form] by [Friday] this week, we can interview you on [Tuesday] next week."],["Bob","And at the interview we'd like to find out about your [experience] of being a tour guide, so could you prepare a [ten-minute] [talk] about that, please?"]],"mcq":[["Why will Margaret drive over on Monday?",["To bring her application form","To post the form herself","She lives quite far away"],2,"Audio: 'You're quite a long way from where I live' = cô ấy sống khá xa (lives quite far away)."],["What should Margaret bring to the interview?",["Slides and equipment","Papers showing her qualifications","Her first aid kit"],1,"Audio: 'any certificates you've got that are relevant' = giấy tờ chứng minh bằng cấp (papers showing her qualifications)."],["What does she need for her presentation?",["Just a few written notes","A ten-minute video","Complicated equipment"],0,"Audio: 'You don't need slides ... just some notes' = chỉ cần vài ghi chú viết tay (a few written notes)."]],"transcript":[["Margaret","It sounds really interesting - would you like me to fill in an application form?"],["Bob","Yes, please. Where should I post it to?"],["Margaret","Could you send it to 27 Arbuthnot Place - A-R-B-U-T-H-N-O-T Place, Dumfries. ( )"],["Bob","And what's the postcode, please?"],["Margaret","DG7 4PH. ( )"],["Bob","Was that P Papa or B Bravo?"],["Margaret","P Papa."],["Bob","Got that. If you could return the application form by Friday this week, we can interview you on Tuesday next week. Say half past two. Would that be possible for you? ( )"],["Margaret","Yes, it's fine. You're quite a long way from where I live, so I'll drive over on Monday. Should I bring anything to the interview?"],["Bob","We'll have your application form, of course, but we'll need to see any certificates you've got that are relevant, in cycling, first aid, or whatever."],["Margaret","OK."],["Bob","And at the interview we'd like to find out about your experience of being a tour guide, so could you prepare a ten-minute talk about that, please? You don't need slides or any complicated equipment - just some notes. ( )"],["Margaret","Right. I'll start thinking about that straightaway!"],["Bob","Good. Well, we'll look forward to receiving your application form, and we'll contact you to confirm the interview."],["Margaret","Thanks very much."],["Bob","Thank you, Margaret. Goodbye."],["Margaret","Bye."]]}],"key":[["temporary"],["doctor"],["Africa"],["youth"],["May"],["cheese"],["Arbuthnot"],["DG7 4PH","DG74PH"],["Tuesday"],["talk"]],"anyOrder":[],"keyNote":"Q3, Q5, Q9: viết hoa (Africa, May, Tuesday). Q7: tên riêng đánh vần A-R-B-U-T-H-N-O-T. Q8: mã bưu chính DG7 4PH (P chứ không phải B).","answerLines":[["MARGARET","No, [temporary]."],["MARGARET","This will probably sound crazy - I used to be a lawyer, and then I made a complete career change and I'm going to be a [doctor]."],["MARGARET","Yes, I've led several bike tours in [Africa]."],["MARGARET","Yes, I'm a volunteer worker in a [youth] club, where I help people to improve their cycling skills."],["MARGARET","My job is due to start on October the 2nd, and I'm availa R","maxWords":1,"example":["Name:","Margaret Smith"],"sections":[{"heading":"Background","lines":[["Previous job:","",["lawyer"]],["Has led bike tours in Africa","",null],["Cancelled trip was to","",["India"]]]},{"heading":"Tour offered","lines":[["Country:","",["Spain"]],["Type of holiday: for","",["families"]],["Cycling club experience: taught","",["beginners"]],["Length of tour: a","",["fortnight"]],["Margaret is free for","months",["5","five"]]]},{"heading":"Application and interview","lines":[["Address: 27 Arbuthnot Place,","",["Dumfries"]],["Interview: Tuesday at","",["2.30","2:30","half past two"]],["Bring any relevant","(cycling, first aid)",["certificates"]],["Talk: no slides needed – just notes","",null]]}]}},{"id":"da-c13t4","topic":"Daily Activities","code":"Cam 13 · Test 4 · Part 1","title":"Alex's Training","intro":"Martha gọi điện cho Alex để xin lời khuyên về chương trình đào tạo tại công ty JPNW mà Alex đã tham gia.","testPdf":"https://drive.google.com/file/d/19STIMyLa7yS26zVJQGd1ZkE_LeIYQ1TH/view","vocab":[["initial training","khóa đào tạo ban đầu","but I did my initial training in Finance"],["nervous","lo lắng, hồi hộp","I was pretty nervous to begin with."],["fail (an exam)","thi trượt (môn)","I was really worried because I failed Maths."],["on the job","trong lúc làm việc (vừa làm vừa học)","But it didn't actually matter because I did lots of courses on the job."],["diploma","văn bằng, chứng chỉ","Did you get a diploma at the end of your trainee period?"],["trainee","thực tập sinh, học viên được đào tạo","What about the other trainees?"],["opportunity","cơ hội","It seems like there are a lot of opportunities there."],["organisation","tổ chức, công ty","Because of its size you can work in loads of different areas within the organisation."],["minimum wage","mức lương tối thiểu","I know you get a lower minimum wage than regular employees."],["massively","rất nhiều, đáng kể","And the pay goes up massively if they offer you a job at the end of the training period."],["confidence","sự tự tin","Everyone says by the end of the year you gain so much confidence."],["variety","sự đa dạng","There's a lot of variety too."],["advantage","lợi thế, ưu điểm","so the location's a real advantage."],["casual","giản dị, xuề xòa (quần áo)","Nothing too casual - like jeans, for example."],["terrified","rất sợ hãi","Even if you feel terrified."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hi Alex. It's Martha Clines here…","to":"…I wish I'd done that one instead.","lines":[["Alex","Well, now I work in the [customer] services [department] but I did my initial training in [Finance], I stayed there for the first two years and then moved to where I am now."],["Alex","I didn't do well in my [exams] at school and I was really [worried] because I failed [Maths]."],["Martha","Did you get a [diploma] at the end of your [trainee] period?"],["Martha","I'm hoping to do the one in [business] [skills]."]],"mcq":[["What does Alex say about his JPNW training?",["It was his best choice ever","He did it with James","He stopped working there in 2014"],0,"Audio: 'Best thing I ever did' = lựa chọn tốt nhất (his best choice ever)."],["How did Alex feel at the start?",["Quite anxious","Bored by the courses","Happy with his exam results"],0,"Audio: 'I was pretty nervous to begin with' = khá lo lắng (quite anxious)."],["What does Alex say about his IT diploma?",["It was the best one","He failed it","He wishes he had chosen another"],2,"Audio: 'I took the one on IT skills but I wish I'd done that one instead' = ước đã chọn cái khác (wishes he had chosen another)."]],"transcript":[["Martha","Hi Alex. It's Martha Clines here. James White gave me your number. I hope you don't mind me calling you."],["Alex","Of course not. How are you, Martha?"],["Martha","Good thanks. I'm ringing because I need a bit of advice."],["Alex","Oh yeah. What about?"],["Martha","The training you did at JPNW a few years ago. I'm applying for the same thing."],["Alex","Oh right. Yes, I did mine in 2014. Best thing I ever did. I'm still working there."],["Martha","Really? What are you doing?"],["Alex","Well, now I work in the customer services department but I did my initial training in Finance, I stayed there for the first two years and then moved to where I am now. ( )"],["Martha","That's the same department I'm applying for. Did you enjoy it?"],["Alex","I was pretty nervous to begin with. I didn't do well in my exams at school and I was really worried because I failed Maths. But it didn't actually matter because I did lots of courses on the job. ( )"],["Martha","Did you get a diploma at the end of your trainee period? I'm hoping to do the one in business skills."],["Alex","Yes. That sounds good. I took the one on IT skills but I wish I'd done that one instead. ( )"]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"OK, that's good to know…","to":"…the location's a real advantage.","lines":[["Alex","I was [18] and there was only one person [younger] than me, who was [17]."],["Alex","But you get the same [number] of days' [holiday] as everyone else."],["Martha","Do you have to [spend] any time in [college]?"],["Alex","Yes, it's very close to the [train] [station] so the [location]'s a real advantage."]],"mcq":[["Why are there many opportunities at JPNW?",["The company is very big","You work in one area only","The pay goes up every month"],0,"Audio: 'Because of its size you can work in loads of different areas' = công ty rất lớn (very big)."],["What is bad about the trainee pay?",["It is paid only once a year","It is less than normal staff get","It goes up massively at the start"],1,"Audio: 'a lower minimum wage than regular employees' = ít hơn nhân viên bình thường (less than normal staff)."],["What does Alex say is the most useful part?",["Becoming more confident","The money you earn","The studying part"],0,"Audio: 'you gain so much confidence' = trở nên tự tin hơn (becoming more confident)."]],"transcript":[["Martha","OK, that's good to know. What about the other trainees? How did you get on with them?"],["Alex","There were about 20 of us who started at the same time and we were all around the same age - I was 18 and there was only one person younger than me, who was 17. The rest were between 18 and 20. I made some good friends. ( )"],["Martha","I've heard lots of good things about the training at JPNW. It seems like there are a lot of opportunities there."],["Alex","Yeah, definitely. Because of its size you can work in loads of different areas within the organisation."],["Martha","What about pay? I know you get a lower minimum wage than regular employees."],["Alex","That's right - which isn't great. But you get the same number of days' holiday as everyone else. And the pay goes up massively if they offer you a job at the end of the training period. ( )"],["Martha","Yeah, but I'm not doing it for the money - it's the experience I think will be really useful. Everyone says by the end of the year you gain so much confidence."],["Alex","You're right. That's the most useful part about it. There's a lot of variety too. You're given lots of different things to do. I enjoyed it all - I didn't even mind the studying."],["Martha","Do you have to spend any time in college?"],["Alex","Yes, one day each month. So you get lots of support from both your tutor and your manager. ( )"],["Martha","That's good. And the company is easy to get to, isn't it?"],["Alex","Yes, it's very close to the train station so the location's a real advantage. ( )"]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"Have you got a date for your interview yet?…","to":"hết Part 1","lines":[["Alex","Nothing too [casual] - like [jeans], for example."],["Alex","Erm, well I know it's really [obvious] but arrive in [plenty] of time."],["Alex","They [hate] people who are [late]."],["Alex","And one other useful piece of [advice] my [manager] told me before I had the interview for this job - is to [smile]."]],"mcq":[["When is Martha's interview?",["On the 23rd of next month","Next year","Near the end of this month"],2,"Audio: 'it's on the 23rd of this month' = gần cuối tháng này (near the end of this month)."],["What does Alex say about the people at JPNW?",["They worry a lot","They are well prepared","They are very kind"],2,"Audio: 'Everyone's very friendly' = mọi người rất tử tế (very kind)."],["Who gave Alex his last tip?",["James White","Someone friendly at the interview","His boss"],2,"Audio: 'advice my manager told me' = sếp của anh ấy (his boss)."]],"transcript":[["Alex","Have you got a date for your interview yet?"],["Martha","Yes, it's on the 23rd of this month."],["Alex","So long as you're well prepared there's nothing to worry about. Everyone's very friendly."],["Martha","I am not sure what I should wear. What do you think?"],["Alex","Nothing too casual - like jeans, for example. If you've got a nice jacket, wear that with a skirt or trousers. ( )"],["Martha","OK. Thanks. Any other tips?"],["Alex","Erm, well I know it's really obvious but arrive in plenty of time. They hate people who are late. So make sure you know exactly where you have to get to. And one other useful piece of advice my manager told me before I had the interview for this job - is to smile. Even if you feel terrified. It makes people respond better to you. ( ) ( )"],["Martha","I'll have to practise doing that in the mirror!"],["Alex","Yeah well, good luck. Let me know if you need any more information."],["Martha","Thanks very much."]]}],"key":[["Finance","finance"],["Maths","Math","Mathematics"],["business"],["17","seventeen"],["holiday","holidays"],["college"],["location"],["jeans"],["late"],["smile"]],"anyOrder":[],"keyNote":"Q2: chấp nhận Maths / Math / Mathematics. Q4: nên viết số 17. Q5: holiday hoặc holidays đều đúng.","answerLines":[["ALEX","Well, now I work in the customer services department but I did my initial training in [Finance], I stayed there for the first two years and then moved to where I am now."], lines":[["Pay: lower minimum","than regular employees",["wage"]],["Main benefit: you gain a lot of","",["confidence"]],["There is plenty of","in the work",["variety"]],["College: one day a","",["month"]]]},{"heading":"Interview tips","lines":[["Martha's interview: the","of this month",["23rd","23"]],["Wear a nice","with a skirt or trousers",["jacket"]],["Smile, even if you feel","",["terrified"]]]}]}},{"id":"da-c15t1","topic":"Daily Activities","code":"Cam 15 · Test 1 · Part 1","title":"Bankside Recruitment Agency","intro":"Amber gọi điện cho người bạn William để hỏi thông tin về Bankside, một công ty giới thiệu việc làm tạm thời mà William từng nhắc tới.","testPdf":"https://drive.google.com/file/d/1VsYNsJkqQ4FG_OcW3yGSe_2ttv-G3mqy/view","vocab":[["job agency","công ty môi giới việc làm","you said to phone if I wanted to get more information about the job agency you mentioned."],["be based in","có trụ sở ở","they're based in Docklands"],["direct line","số điện thoại trực tiếp","Do you have her direct line?"],["vacancy","vị trí (việc làm) còn trống","she's always really busy in the morning trying to fill last-minute vacancies."],["clerical","(công việc) văn thư, giấy tờ","It's mainly clerical and admin jobs they deal with, isn't it?"],["recruit","tuyển dụng","but Becky mostly recruits temporary staff for the finance sector"],["receptionist","lễ tân","They'll probably start you as a receptionist, or something like that."],["extend","kéo dài, gia hạn","But you're more likely to be offered something for a week at first, which might get extended."],["hourly rate","mức lương theo giờ","The hourly rate is about £10, 11 if you're lucky."],["registration","sự đăng ký","Do you want me to tell you anything about the registration process?"],["candidate","ứng viên","So there are questions about personality that they always ask candidates"],["benefit","lợi ích","there are lots of benefits to using an agency"],["feedback","nhận xét, góp ý","they'll give you feedback on your performance so you can improve next time."],["advertise","quảng cáo, đăng tuyển","And they'll have access to jobs which aren't advertised."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello William. This is Amber…","to":"…so you'd be fine there.","lines":[["William","The agent I always [deal] with is called Becky [Jamieson]."],["William","I wouldn't call her until the [afternoon] if I were you - she's always really [busy] in the [morning] trying to fill last-minute vacancies."],["William","They'll [probably] [start] you as a receptionist, or something like that."],["William","So what's important for that kind of job isn't so much having [business] skills or knowing lots of different computer systems - it's [communication] that really matters - so you'd be fine there."]],"mcq":[["Why does Amber call William?",["To apply to Bankside","To ask for details of an agency","To get Becky's home address"],1,"Audio: 'get more information about the job agency' = hỏi thông tin chi tiết về công ty (ask for details of an agency)."],["What is Becky like?",["Always too busy to help","Strict and formal","Kind and easy to talk to"],2,"Audio: 'She's really helpful and friendly' = tốt bụng, dễ nói chuyện (kind and easy to talk to)."],["What kind of staff does Becky mostly find?",["Short-term workers for finance","Shop and restaurant staff","Permanent media workers"],0,"Audio: 'mostly recruits temporary staff for the finance sector' = nhân viên ngắn hạn ngành tài chính (short-term workers)."]],"transcript":[["Amber","Hello William. This is Amber - you said to phone if I wanted to get more information about the job agency you mentioned. Is now a good time?"],["William","Oh, hi Amber. Yes. Fine. So the agency I was talking about is called Bankside - they're based in Docklands - I can tell you the address now - 497 Eastside."],["Amber","OK, thanks. So is there anyone in particular I should speak to there?"],["William","The agent I always deal with is called Becky Jamieson."],["Amber","Let me write that down - Becky ..."],["William","Jamieson J-A-M-I-E-S-O-N. ( )"],["Amber","Do you have her direct line?"],["William","Yes, it's in my contacts somewhere - right, here we are: 078 double 6, 510 triple 3. I wouldn't call her until the afternoon if I were you - she's always really busy in the morning trying to fill last-minute vacancies. She's really helpful and friendly so I'm sure it would be worth getting in touch with her for an informal chat. ( )"],["Amber","It's mainly clerical and admin jobs they deal with, isn't it?"],["William","That's right. I know you're hoping to find a full-time job in the media eventually - but Becky mostly recruits temporary staff for the finance sector - which will look good on your CV - and generally pays better too."],["Amber","Yeah - I'm just a bit worried because I don't have much office experience."],["William","I wouldn't worry. They'll probably start you as a receptionist, or something like that. So what's important for that kind of job isn't so much having business skills or knowing lots of different computer systems - it's communication that really matters - so you'd be fine there. And you'll pick up office skills really quickly on the job. It's not that complicated. ( )"]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"OK good. So how long do people generally need temporary staff for?…","to":"…they will ask to see that.","lines":[["William","But you're more likely to be offered something for a [week] at first, which might get [extended]."],["William","The hourly [rate] is about £[10], 11 if you're lucky."],["William","The [interview] usually takes about an hour and you should [arrange] that about a week in [advance]."],["Amber","I suppose I should dress [smartly] if it's for office work - I can probably [borrow] a [suit] from Mum."]],"mcq":[["How does agency pay compare with other jobs?",["The same as office jobs","Lower than in a restaurant","Higher than in shops"],2,"Audio: 'better than working in a shop or a restaurant' = cao hơn làm ở cửa hàng (higher than in shops)."],["How long does the interview usually take?",["About sixty minutes","A whole day","About eight or nine hours"],0,"Audio: 'The interview usually takes about an hour' = khoảng 60 phút (about sixty minutes)."],["What does the agency NOT need to see?",["Her mum's documents","Her registration letter","Her exam papers"],2,"Audio: 'copies of my exam certificates ... they don't need to see those' = giấy tờ thi cử (exam papers)."]],"transcript":[["Amber","OK good. So how long do people generally need temporary staff for? It would be great if I could get something lasting at least a month."],["William","That shouldn't be too difficult. But you're more likely to be offered something for a week at first, which might get extended. It's unusual to be sent somewhere for just a day or two. ( )"],["Amber","Right. I've heard the pay isn't too bad - better than working in a shop or a restaurant."],["William","Oh yes - definitely. The hourly rate is about £10, 11 if you're lucky. ( )"],["Amber","That's pretty good. I was only expecting to get eight or nine pounds an hour."],["William","Do you want me to tell you anything about the registration process?"],["Amber","Yes, please. I know you have to have an interview."],["William","The interview usually takes about an hour and you should arrange that about a week in advance."],["Amber","I suppose I should dress smartly if it's for office work - I can probably borrow a suit from Mum. ( )"],["William","Good idea. It's better to look too smart than too casual."],["Amber","Will I need to bring copies of my exam certificates or anything like that?"],["William","No - they don't need to see those, I don't think."],["Amber","What about my passport? ( )"],["William","Oh yes - they will ask to see that."],["Amber","OK."]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"I wouldn't get stressed about the interview though…","to":"hết Part 1","lines":[["William","So there are questions about [personality] that they always ask [candidates] - fairly basic ones."],["William","Anyway, there are lots of [benefits] to using an agency - for example, the interview will be useful because they'll give you [feedback] on your [performance] so you can improve next time."],["Amber","And they'll have [access] to [jobs] which aren't advertised."],["Amber","And I expect finding a [temporary] job this way takes a lot less [time] - it's much easier than ringing up [individual] companies."]],"mcq":[["Why does the agency do an interview?",["To check her exams","To know her better","To test her for a difficult job"],1,"Audio: 'a chance for them to build a relationship with you' = để hiểu cô ấy hơn (know her better)."],["What will they probably NOT ask about?",["Her favourite food","Her relationship with the boss","What she wants to do later"],2,"Audio: 'won't ask ... what your plans are for the future' = cô ấy muốn làm gì sau này (what she wants to do later)."],["What jobs can the agency offer?",["Jobs not shown in adverts","Jobs at the agency office","Only advertised jobs"],0,"Audio: 'access to jobs which aren't advertised' = việc làm không đăng quảng cáo (not shown in adverts)."]],"transcript":[["William","I wouldn't get stressed about the interview though. It's just a chance for them to build a relationship with you - so they can try and match you to a job which you'll like. So there are questions about personality that they always ask candidates - fairly basic ones. And they probably won't ask anything too difficult like what your plans are for the future. ( )"],["Amber","Hope not."],["William","Anyway, there are lots of benefits to using an agency - for example, the interview will be useful because they'll give you feedback on your performance so you can improve next time. ( )"],["Amber","And they'll have access to jobs which aren't advertised."],["William","Exactly - most temporary jobs aren't advertised."],["Amber","And I expect finding a temporary job this way takes a lot less time - it's much easier than ringing up individual companies. ( )"],["William","Yes indeed. Well I think ..."]]}],"key":[["Jamieson"],["afternoon","afternoons"],["communication"],["week"],["10","ten"],["suit"],["passport"],["personality"],["feedback"],["time"]],"anyOrder":[],"keyNote":"Q1: tên riêng viết hoa, đánh vần J-A-M-I-E-S-O-N. Q5: chỉ viết 10 (không ghi 11, vì đó là mức 'nếu may mắn'). Q4: week số ít (one week).","answerLines":[["WILLIAM","The agent I always deal with is called Becky [Jamieson]."],["WILLIAM","I wouldn't call her until the [afternoon] if I were you - she's always really busy in the morning trying to fill last-minute vacancies."],["WILLIAM","So what's important for that kind of job isn't so much having business skills or knowing lots of different computer systems - it's [communication] that really matters - so you'd be fine there."],["WILLIAM","But you're more likely to be offered something for a [week] at first, which might get extended."],["WILLIAM","The hourly rate is about £[10], 11 if you're lucky."],["AMBER","I suppose I should dress smartly if it's for office work - I can probably borrow a [suit] from Mum."],["AMBER","What about my [passport]?"],["WILLIAM","So there are questions about [personality] that they always ask candidates - fairly basic ones."],["WILLIAM","Anyway, there are lots of benefits to using an agency - for example, the interview will be useful because they'll give you [feedback] on your performance so you can improve next time."],["AMBER","And I expect finding a temporary job this way takes a lot less [time] - it's much easier than ringing up individual companies."]],"para":[["Best to call her in the …","I wouldn't call her until the …"],["Jobs are usually for at least one …","more likely to be offered something for a … at first"],["questions about each applicant's …","questions about … that they always ask candidates"],["… at interview will benefit you","they'll give you … on your performance"],["Less … involved in applying for jobs","takes a lot less …"]],"answerSource":"transcript","audio":{"src":"audio/da-c15t1.mp3","segs":{"A":[104.1,216],"B":[214.6,333.4],"C":[332,390.4]},"conv":[105,389.1]},"phrases":[["Is now a good time?","Bây giờ có tiện nói chuyện không? – hỏi lịch sự khi gọi điện.","Is now a good time?","Bây giờ anh có tiện nói chuyện không?"],["I wouldn't + V … if I were you","Nếu là bạn thì tôi sẽ không…; dùng để đưa lời khuyên.","I wouldn't call her until the afternoon if I were you","Nếu là cậu thì tớ sẽ không gọi cho cô ấy trước buổi chiều đâu"],["it would be worth + V-ing","Đáng để làm gì; 'get in touch with' = liên lạc với ai.","so I'm sure it would be worth getting in touch with her for an informal chat.","nên tớ chắc là rất đáng để liên lạc và trò chuyện thân mật với cô ấy."],["isn't so much A … it's B","Điều quan trọng không hẳn là A, mà là B; dùng để nhấn mạnh B.","what's important for that kind of job isn't so much having business skills or knowing lots of different computer systems - it's communication that really matters","điều quan trọng với loại công việc đó không hẳn là kỹ năng kinh doanh hay biết nhiều hệ thống máy tính – mà chính là giao tiếp"],["pick up + N","Học được (kỹ năng) một cách tự nhiên trong lúc làm.","And you'll pick up office skills really quickly on the job.","Và cậu sẽ học được kỹ năng văn phòng rất nhanh trong lúc làm việc."],["be more likely to + V","Nhiều khả năng sẽ…","But you're more likely to be offered something for a week at first, which might get extended.","Nhưng lúc đầu nhiều khả năng cậu sẽ được nhận việc một tuần, sau đó có thể được gia hạn."],["It's better to A than B","Thà A còn hơn B.","It's better to look too smart than too casual.","Thà trông quá chỉn chu còn hơn quá xuề xòa."],["I expect + mệnh đề","Tôi đoán / cho rằng…","And I expect finding a temporary job this way takes a lot less time","Và tớ đoán tìm việc tạm thời theo cách này tốn ít thời gian hơn nhiều"]],"spellnum":[["A","Jamieson [J-A-M-I-E-S-O-N].",["Jamieson"],"Họ của người môi giới (được đánh vần)",[132.9,143.4]],["B","The hourly rate is about [£10], 11 if you're lucky.",["10","£10"],"Lương theo giờ (mức thường)",[241.2,251.7]],["B","I was only expecting to get [eight or nine] pounds an hour.",["8 or 9","eight or nine","8-9","£8 or £9"],"Mức lương Amber dự tính",[245.6,256.1]],["B","The interview usually takes about [an hour]",["1 hour","an hour","one hour"],"Thời gian phỏng vấn",[299.3,309.8]],["B","you should arrange that about [a week] in advance.",["1 week","a week","one week"],"Cần hẹn phỏng vấn trước bao lâu",[303.2,313.7]]],"synonyms":[["Is now a good time?","Are you free to talk?","Bây giờ có tiện nói chuyện không?"],["really helpful and friendly","kind and easy to talk to","rất nhiệt tình và thân thiện"],["temporary staff for the finance sector","short-term workers for finance","nhân viên tạm thời cho ngành tài chính"],["at least a month","a minimum of four weeks","ít nhất một tháng"],["The hourly rate","pay per hour","mức lương theo giờ"],["dress smartly","wear formal clothes","ăn mặc lịch sự"],["fairly basic ones","simple questions","những câu khá cơ bản"],["jobs which aren't advertised","jobs not shown in adverts","những việc không được đăng tuyển"]],"newtest":{"type":"notes","title":"Bankside Recruitment Agency","instruction":"Complete the notes below.","limit":"ONE WORD AND/OR A NUMBER","maxWords":1,"example":["Name of agency:","Bankside"],"sections":[{"heading":"Contact details","lines":[["Based in","",["Docklands"]],["Address:","Eastside",["497"]],["Agent: Becky Jamieson – direct line:","",["07866510333","07866 510333","078 66 510 333"]],["Best time to call: the afternoon","",null]]},{"heading":"Jobs","lines":[["Mainly clerical and","jobs",["admin"]],["Mostly temporary staff for the","sector",["finance"]],["Amber will probably start as a","",["receptionist"]],["Pay: £10 an hour, or up to £","if lucky",["11"]]]},{"heading":"Registration","lines":[["Interview lasts about an","",["hour"]],["Exam","are not needed",["certificates"]],["Bring your passport","",null]]},{"heading":"Benefits of using an agency","lines":[["Access to jobs which are not","",["advertised"]]]}]}},{"id":"da-c15t3","topic":"Daily Activities","code":"Cam 15 · Test 3 · Part 1","title":"Employment Agency: Possible Jobs","intro":"Sally, nhân viên một công ty giới thiệu việc làm, trao đổi với Joe về hai công việc có thể phù hợp với anh.","testPdf":"https://drive.google.com/file/d/1yT7Z_zOWvrtYLJ57Q_eK_iMkXq1O7eDj/view","vocab":[["agency representative","người đại diện của công ty môi giới","I'm one of the agency representatives, and my name's Sally Baker."],["administrative assistant","trợ lý hành chính","They're looking for an administrative assistant."],["requirement","yêu cầu (của công việc)","it does look as if you fit quite a few of the requirements."],["data entry","nhập dữ liệu","So on your CV it appears you've done some data entry?"],["appoint","tuyển, bổ nhiệm (vào vị trí)","Then they expect the person they appoint to attend meetings and take notes there"],["filing","sắp xếp, lưu trữ hồ sơ","Filing, and keeping records and so on?"],["spreadsheet","bảng tính (Excel)","and they particularly mention spreadsheets."],["interpersonal skills","kỹ năng giao tiếp, ứng xử với người khác","And interpersonal skills - which would be something they'd check with your references."],["teleconferencing","họp từ xa qua điện thoại/video","I think they wanted some experience of teleconferencing."],["commute","quãng đường đi làm hằng ngày","so it would be quite a long commute for me."],["warehouse","nhà kho","that's for a warehouse assistant and that's in South London."],["stock","hàng trong kho","they want someone who can manage the stock, obviously, and also deliveries."],["computer literate","thành thạo máy tính","And they want someone who's computer literate, which we know you are."],["orally","bằng lời nói","they want someone who can communicate well both orally and in writing."],["licence","giấy phép (lái xe)","they mention they want someone with a licence"]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Good morning. Thanks for coming in to see us…","to":"…I don't think you mentioned that, did you?","lines":[["Sally","They're called Home Solutions and they [design] and make [furniture]."],["Sally","So on your [CV] it appears you've done some [data] entry?"],["Sally","Then they expect the person they [appoint] to attend [meetings] and take [notes] there"],["Joe","And in my last job I also had to [manage] the [diary]."]],"mcq":[["What has the agency done with Joe's CV?",["Read it carefully","Sent it back to him","Lost it after the phone call"],0,"Audio: 'We've had quite a careful look at it' = đã đọc kỹ (read it carefully)."],["What job does the first company offer?",["Sales person","Office helper","Designer"],1,"Audio: 'They're looking for an administrative assistant' = người hỗ trợ văn phòng (office helper)."],["What does Sally advise Joe to do?",["Take notes in the office","Call the company himself","Put something extra on his CV"],2,"Audio: 'I'd suggest you add it to your CV' = bổ sung thêm vào CV (put something extra on his CV)."]],"transcript":[["Sally","Good morning. Thanks for coming in to see us here at the agency, Joe. I'm one of the agency representatives, and my name's Sally Baker."],["Joe","Hi Sally. I think we spoke on the phone, didn't we?"],["Sally","That's right, we did. So thank you for sending in your CV. We've had quite a careful look at it and I think we have two jobs that might be suitable for you."],["Joe","OK."],["Sally","The first one is in a company based in North London. They're looking for an administrative assistant."],["Joe","OK. What sort of company is it?"],["Sally","They're called Home Solutions and they design and make furniture. ( )"],["Joe","Oh, I don't know much about that, but it sounds interesting."],["Sally","Yes, well as I said, they want someone in their office, and looking at your past experience it does look as if you fit quite a few of the requirements. So on your CV it appears you've done some data entry?"],["Joe","Yes."],["Sally","So that's one skill they want. Then they expect the person they appoint to attend meetings and take notes there ... ( )"],["Joe","OK. I've done that before, yes."],["Sally","And you'd need to be able to cope with general admin."],["Joe","Filing, and keeping records and so on? That should be OK. And in my last job I also had to manage the diary. ( )"],["Sally","Excellent. That's something they want here too. I'd suggest you add it to your CV - I don't think you mentioned that, did you?"],["Joe","No."]]},{"id":"B","title":"Đoạn B","qs":"Q4–5","from":"So as far as the requirements go…","to":"…quite a long commute for me.","lines":[["Sally","So as far as the requirements go, they want good [computer] skills, of course, and they particularly mention [spreadsheets]."],["Sally","Then they mention that they want someone who is [careful] and takes care with [details] - just looking at your CV, I'd say you're probably alright there."],["Joe","I've got [three] years' [experience] of that."],["Sally","In fact they're only asking for at least [one] [year], so that's great."]],"mcq":[["How will they check his interpersonal skills?",["By asking his past employers","By looking at his CV","In a phone test"],0,"Audio: 'something they'd check with your references' = hỏi người giới thiệu/chủ cũ (asking his past employers)."],["How much teleconferencing experience does Joe have?",["Much more than they need","Exactly what they asked for","Just a little"],0,"Audio: 'three years' ... they're only asking for at least one' = nhiều hơn yêu cầu (more than they need)."],["What problem does Joe see with this job?",["The pay is too low","The travel would take long","North London is too close"],1,"Audio: 'it would be quite a long commute for me' = đi lại mất nhiều thời gian (travel would take long)."]],"transcript":[["Sally","So as far as the requirements go, they want good computer skills, of course, and they particularly mention spreadsheets."],["Joe","That should be fine."],["Sally","And interpersonal skills - which would be something they'd check with your references."],["Joe","I think that should be OK, yes."],["Sally","Then they mention that they want someone who is careful and takes care with details - just looking at your CV, I'd say you're probably alright there. ( )"],["Joe","I think so, yes. Do they want any special experience?"],["Sally","I think they wanted some experience of teleconferencing."],["Joe","I've got three years' experience of that."],["Sally","Let's see, yes, good. In fact they're only asking for at least one year, so that's great. So is that something that might interest you? ( )"],["Joe","It is, yes. The only thing is, you said they were in North London so it would be quite a long commute for me."]]},{"id":"C","title":"Đoạn C","qs":"Q6–10","from":"So the second position might suit you better…","to":"hết Part 1","lines":[["Sally","So as far as the responsibilities for this position go, they want someone who can manage the [stock], obviously, and also [deliveries]."],["Joe","And for the last [warehouse] job I had, one of the things I [enjoyed] most was being part of a [team]."],["Sally","So you're OK moving [heavy] [things]?"],["Sally","And you've got experience of warehouse work ... and the final thing they mention is [customer] [service]."]],"mcq":[["What is Joe good at?",["Fixing computers","Keeping track of trains","Working with figures"],2,"Audio: 'I've always been quite good with numbers' = giỏi làm việc với con số (working with figures)."],["What did Joe handle in his last warehouse job?",["Office computers","Things for homes, like fridges","Small kitchen tools"],1,"Audio: 'bathroom and kitchen equipment, sinks and stoves and fridges' = đồ dùng gia đình (things for homes)."],["What driving experience do they want?",["Training in a warehouse","A London bus licence","Experience on busy city roads"],2,"Audio: 'experience of driving in London ... cope with the traffic' = kinh nghiệm lái trên đường phố đông đúc (busy city roads)."]],"transcript":[["Sally","OK. So the second position might suit you better as far as the location goes; that's for a warehouse assistant and that's in South London."],["Joe","Yes, that would be a lot closer."],["Sally","And you've worked in a warehouse before, haven't you?"],["Joe","Yes."],["Sally","So as far as the responsibilities for this position go, they want someone who can manage the stock, obviously, and also deliveries. ( )"],["Joe","That should be OK. You've got to keep track of stuff, but I've always been quite good with numbers."],["Sally","Good, that's their first requirement. And they want someone who's computer literate, which we know you are."],["Joe","Sure."],["Sally","Then they mention organisational skills. They want someone who's well organised."],["Joe","Yes, I think I am."],["Sally","And tidy? ( )"],["Joe","Yes, they go together really, don't they?"],["Sally","Sure. Then the usual stuff; they want someone who can communicate well both orally and in writing."],["Joe","OK. And for the last warehouse job I had, one of the things I enjoyed most was being part of a team. I found that was really essential for the job. ( )"],["Sally","Excellent. Yes, they do mention that they want someone who's used to that, yes. Now when you were working in a warehouse last time, what sorts of items were you dealing with?"],["Joe","It was mostly bathroom and kitchen equipment, sinks and stoves and fridges."],["Sally","So you're OK moving heavy things? ( )"],["Joe","Sure. I'm quite strong, and I've had the training."],["Sally","Good. Now as far as experience goes, they mention they want someone with a licence, and that you have experience of driving in London - so you can cope with the traffic and so on."],["Joe","Yes, no problem."],["Sally","And you've got experience of warehouse work ... and the final thing they mention
