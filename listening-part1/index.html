ext one on my list."],["Woman","And it's particularly good if you're [busy] during the day, because they also do [appointments] in the [evening]."],["Woman","You can [register] with Doctor [Gormley], that's G-O-R-M-L-E-Y."]],"mcq":[["What does the woman say about Dr Fuller?",["He works on Saturday","He runs a special clinic","He can accept new patients"],2,"Audio: 'Doctor Fuller, who has space on his list' = có thể nhận thêm bệnh nhân (accept new patients)."],["Why are the clinic's facilities modern?",["It is very large","It is only twelve months old","It was very expensive"],1,"Audio: 'The clinic only opened a year ago' = mới mười hai tháng (twelve months old)."],["What does the woman say about the Shore Lane centre?",["Its doctor has worked there for years","It has just opened","People think it is excellent"],2,"Audio: 'the centre has a very good reputation' = mọi người đánh giá rất cao (excellent)."]],"transcript":[["Woman","Can I help you?"],["Man","Yes, I've just moved to this area with my wife and children and I'd like to know where we can all register with a doctor at a Health Centre."],["Woman","Okay. Well, there's Doctor Green at The Harvey Clinic. We always recommend her for babies, because she's very good with them and she runs a special clinic."],["Man","Oh... actually my youngest child is five, so that wouldn't be any good for us."],["Woman","Right."],["Man","Is there anywhere else I could try?"],["Woman","Yes, the Eshcol Health Practice is the next one on my list."],["Man","How do you spell that?"],["Woman","E-S-H-C-O-L. And it's Doctor Fuller, who has space on his list. The clinic only opened a year ago, so the facilities are all very modern."],["Man","That sounds good."],["Woman","And it's particularly good if you're busy during the day, because they also do appointments in the evening. They're closed on Saturday, though. The only other place on the list is the Health Centre on Shore Lane. You can register with Doctor Gormley, that's G-O-R-M-L-E-Y. He's new there, but the centre has a very good reputation."]]},{"id":"B","title":"Đoạn B","qs":"Q5–6","from":"Could you tell me, will all their services be free?…","to":"…pay for insurance medicals though.","lines":[["Man","Could you tell me, will all their [services] be [free]?"],["Woman","If you need to be [vaccinated] before any trips [abroad], you won't have to pay for this."],["Woman","The sports [injury] treatment service operates on a [paying] basis, as does the nutritional therapy service."],["Woman","And finally, if you need to prove you're healthy or haven't had any serious injuries before a new employer will accept you, you can get a [free] [fitness] [check-up] there, but you'd most likely have to pay for insurance medicals though."]],"mcq":[["Which centre does the man choose?",["The Harvey Clinic","The one closed on Saturday","The Shore Lane surgery"],2,"Audio: 'I think I know the road. That would be the best one' = chọn trung tâm ở Shore Lane (surgery)."],["What does the man ask about next?",["Whether the road is busy","Whether services cost money","Whether the doctors are new"],1,"Audio: 'will all their services be free?' = dịch vụ có tốn tiền không (cost money)."],["What does the woman say about charges?",["There are usually a few small fees","Everything is free","They are very expensive"],0,"Audio: 'there are usually some small charges' = thường có vài khoản phí nhỏ (small fees)."]],"transcript":[["Man","Oh yes, I think I know the road. That would be the best one. Thanks. Could you tell me, will all their services be free?"],["Woman","Erm... there are usually some small charges that doctors make. Let me see what it says about the Shore Lane Centre. If you need to be vaccinated before any trips abroad, you won't have to pay for this. Erm, what else? The sports injury treatment service operates on a paying basis, as does the nutritional therapy service. Some health centres do offer alternative therapies like homeopathy as part of their pay-to-use service. Shore Lane are hoping to do this soon - I think they may start with acupuncture. And finally, if you need to prove you're healthy or haven't had any serious injuries before a new employer will accept you, you can get a free fitness check-up there, but you'd most likely have to pay for insurance medicals though."],["Man","Okay, thanks."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"You might also be interested to know…","to":"hết Part 1","lines":[["Woman","It says, the talk will stress the health benefits particularly for people with [asthma] or [heart] [disease]."],["Woman","Erm, actually it's at the [primary] [school] on Shore Lane."],["Woman","Oh, it's a late [afternoon] talk, at four [thirty], and it'll be in Room 6."],["Woman","It also says the talk is [suitable] for all [ages]."]],"mcq":[["What is the first talk about?",["Stopping smoking","Smoking and sport","Asthma medicine"],0,"Audio: 'giving up smoking' = bỏ thuốc lá (stopping smoking)."],["When is the Healthy Eating talk?",["Next week","On the twenty-fifth of February","At the start of March"],2,"Audio: 'on the first of March' = đầu tháng Ba (start of March)."],["Who can go to the Healthy Eating talk?",["Only children","Everyone","Only pupils' parents"],1,"Audio: 'all welcome' = mọi người đều được (everyone)."]],"transcript":[["Woman","You might also be interested to know the Centre is running a pilot scheme of talks for patients. I've got the list here. Actually, they look very interesting."],["Man","What sort of things?"],["Woman","Well, the first one's about giving up smoking. It's next week, the twenty-fifth of February, at 7 pm, and that's in Room 4. It says, the talk will stress the health benefits particularly for people with asthma or heart disease."],["Man","That sounds very interesting."],["Woman","There's also a talk for families with children. It's on Healthy Eating, and takes place on the first of March at five o'clock."],["Man","Will that be at the Health Centre?"],["Woman","Erm, actually it's at the primary school on Shore Lane. I imagine they're inviting the parents of pupils there - it says here 'all welcome'."],["Man","Mmm, I might go to that if I have time."],["Woman","There's a couple of other talks - one giving advice about how to avoid injuries while doing exercise. It's on the ninth of March. Oh, it's a late afternoon talk, at four thirty, and it'll be in Room 6. It also says the talk is suitable for all ages. And finally, there's a talk called 'Stress Management' which is ..."]]}],"key":[["babies"],["Eshcol"],["evening"],["Gormley"],["B"],["E"],["heart disease"],["primary school"],["4.30","4.30 pm","4:30","4.30pm","four thirty","half past four","16:30","16.30"],["ages"]],"anyOrder":[[4,5]],"keyNote":"Q2, Q4: tên riêng viết hoa, đánh vần E-S-H-C-O-L và G-O-R-M-L-E-Y. Q5–6: B (employment medicals) và E (vaccinations), thứ tự tùy ý. Q9: 4.30 / four thirty. Q10: số nhiều 'ages'. Câu 5–6 không cần đúng thứ tự.","answerLines":[["WOMAN","We always recommend her for [babies], because she's very good with them and she runs a special clinic."],["WOMAN","Yes, the [Eshcol] Health Practice is the next one on my list."],["WOMAN","And it's particularly good if you're busy during the day, because they also do appointments in the [evening]."],["WOMAN","You can register with Doctor [Gormley], that's G-O-R-M-L-E-Y."],["WOMAN","If you need to be [vaccinated] before any trips abroad, you won't have to pay for this."],["WOMAN","And finally, if you need to prove you're healthy or haven't had any serious injuries before a new employer will accept you, you can get a [free] [fitness] [check-up] there, but you'd most likely have to pay for insurance medicals though."],["WOMAN","It says, the talk will stress the health benefits particularly for people with asthma or [heart] [disease]."],["WOMAN","Erm, actually it's at the [primary] [school] on Shore Lane."],["WOMAN","Oh, it's a late afternoon talk, at [four] [thirty], and it'll be in Room 6."],["WOMAN","It also s ld)."],["Why did Julie decide to see a doctor?",["A friend told her to","Her left leg was broken","The pain has increased"],2,"Audio: 'it's gotten worse' = cơn đau tăng lên (increased)."],["Why did Julie ignore the pain at first?",["It was very serious","It began slowly","A doctor told her to"],1,"Audio: 'It came on quite gradually' = cơn đau bắt đầu từ từ (slowly)."]],"transcript":[["Carl","Excellent, thank you so much. Now Julie, let's look at how we can help you. So tell me a little about what brought you here today."],["Julie","Well, I've been getting a pain in my knee, the left one. Not very serious at first, but it's gotten worse, so I thought I ought to see someone about it."],["Carl","That's certainly the right decision. So how long have you been aware of this pain? Is it just a few days, or is it longer than that?"],["Julie","Longer. It's been worse for the last couple of days, but it's three weeks since I first noticed it. It came on quite gradually though, so I kind of ignored it at first."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"And have you taken any medication yourself…","to":"hết Part 1","lines":[["Julie","Yes, I [play] a lot of [tennis]."],["Julie","But normally I go [running] a few times a week, maybe [three] or [four] times."],["Julie","I did have an [accident] last year when I [slipped] and hurt my [shoulder], but that's better now."],["Julie","Well, I [take] [vitamins] but that's all."]],"mcq":[["How does Julie feel about her pain medicine?",["She prefers not to use it often","It doesn't work at all","She takes it every hour"],0,"Audio: 'I don't like to keep taking it' = cô ấy không muốn dùng thường xuyên."],["What has Julie put on the painful area?",["Heat, several times a day","Something very cold","Nothing at all"],1,"Audio: 'I have been using ice on it' = dùng thứ gì đó rất lạnh (đá)."],["When does Julie usually go swimming?",["Every day at the club","When she is on holiday","After work"],1,"Audio: 'usually just when I'm on vacation' = khi đi nghỉ (holiday)."]],"transcript":[["Carl","And have you taken any medication yourself, or treated it in anyway?"],["Julie","Yeah, I've been taking medication to deal with the pain, Tylenol, and that works OK for a few hours. But I don't like to keep taking it."],["Carl","OK. And what about heat treatment? Have you tried applying heat at all?"],["Julie","No, but I have been using ice on it for the last few days."],["Carl","And does that seem to help the pain at all?"],["Julie","A little, yes."],["Carl","Good. Now you look as if you're quite fit normally?"],["Julie","I am, yes."],["Carl","So do you do any sport on a regular basis?"],["Julie","Yes, I play a lot of tennis. I belong to a club so I go there a lot. I'm quite competitive so I enjoy that side of it as well as the exercise. But I haven't gone since this started."],["Carl","Sure. And do you do any other types of exercise?"],["Julie","Yeah, I sometimes do a little swimming, but usually just when I'm on vacation. But normally I go running a few times a week, maybe three or four times."],["Carl","Hmm. So your legs are getting quite a pounding. But you haven't had any problems up to now?"],["Julie","No, not with my legs. I did have an accident last year when I slipped and hurt my shoulder, but that's better now."],["Carl","Excellent. And do you have any allergies?"],["Julie","No, none that I'm aware of."],["Carl","And do you take any medication on a regular basis?"],["Julie","Well, I take vitamins but that's all. I'm generally very healthy."],["Carl","OK, well let's have a closer look and see what might be causing this problem. If you can just get up..."]]}],"key":[["2194429785","219 442 9785","219-442-9785"],["10 October","October 10","10th October","October 10th","October tenth","tenth October","10/10"],["manager"],["Cawley"],["knee"],["3 weeks","three weeks"],["tennis"],["running"],["shoulder"],["vitamins"]],"anyOrder":[],"keyNote":"Q1: số điện thoại 219 442 9785. Q2: 10 October / October 10th (năm 1 let curSrc=null,blobUrl=null;
function setAudio(src){if(curSrc===src){enablePlayer(true);return}curSrc=src;stopAt=null;au.src=src;au.load();enablePlayer(true);pTime.textContent="0:00";
  const toBlob=()=>{if(curSrc!==src||au.src.startsWith("blob:"))return;const t=au.currentTime,playing=!au.paused;fetch(src).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{if(curSrc!==src)return;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(b);au.src=blobUrl;if(pendingSeek)au.addEventListener("loadedmetadata",()=>{const g=pendingSeek;pendingSeek=null;g()},{once:true})}).catch(()=>{pTime.textContent="không tải được audio"})};
  au.onerror=toBlob;au.addEventListener("loadedmetadata",()=>{if(curSrc===src&&!au.src.startsWith("blob:")&&(au.seekable.length===0||au.seekable.end(au.seekable.length-1)<au.duration-1))toBlob()},{once:true})}
let pendingSeek=null;
function clearAudio(){curSrc=null;au.removeAttribute("src");enablePlayer(false);pTime.textContent="chưa có audio"}
function playRange(s,e){if(!au.src.startsWith("blob:")&&au.readyState>=1&&(au.seekable.length===0||au.seekable.end(au.seekable.length-1)<au.duration-1)){pendingSeek=()=>playRange(s,e);return}if(!au.getAttribute("src")){toast("Audio đang tải, em đợi vài giây rồi bấm lại nhé.");return}stopAt=e;const go=()=>{au.currentTime=Math.max(0,s);au.play().catch(()=>{})};if(au.readyState>=1)go();else{au.addEventListener("loadedmetadata",go,{once:true});au.load()}}
pFile.onchange=()=>{const f=pFile.files&&pFile.files[0];if(!f)return;au.src=URL.createObjectURL(f);stopAt=null;[pPlay,pBack,pFwd,pRate,pSeek].forEach(b=>b.disabled=false);pTime.textContent="0:00 / …";toast("Đã mở: "+f.name)};
pPlay.onclick=()=>{if(au.paused){stopAt=null;au.play()}else au.pause();return;if(au.paused)au.play().catch(()=>{});else au.pause()};
au.onplay=()=>pPlay.textContent="Dừng";au.onpause=()=>pPlay.textContent="Phát";
pBack.onclick=()=>{au.currentTime=Math.max(0,au.currentTime-3)};pFwd.onclick=()=>{au.currentTime=Math.min(au.duration||0,au.currentTime+3)};
const RATES=[1,.85,.75];let ri=0;pRate.onclick=()=>{ri=(ri+1)%RATES.length;au.playbackRate=RATES[ri];pRate.textContent=RATES[ri]+"×"};
au.ontimeupdate=()=>{if(stopAt!=null&&au.currentTime>=stopAt){au.pause();stopAt=null}if(au.duration){pSeek.value=au.currentTime/au.duration*100;pTime.textContent=fmt(au.currentTime)+" / "+fmt(au.duration)}};
au.onloadedmetadata=()=>{pTime.textContent="0:00 / "+fmt(au.duration)};
pSeek.oninput=()=>{stopAt=null;if(au.duration)au.currentTime=pSeek.value/100*au.duration};
document.addEventListener("keydown",e=>{if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!(e.ctrlKey||e.metaKey))return;});
route();
})();
</script>
</body></html>
