<style>
/* Layout: navy "departure board" header, sticky step chips, one column of exercise cards; amber = signage accent */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#14213D; --muted:#596379; --line:#DAE0EA;
  --board:#14213D; --board-ink:#F4F6FB; --amber:#F2A900; --amber-ink:#14213D; --accent-text:#8A5A00;
  --ok:#1E7A4C; --ok-bg:#E3F4EA; --bad:#B42318; --bad-bg:#FCE8E6; --field:#FFFFFF; --soft:#EEF1F7;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1424; --surface:#151F36; --ink:#E7EBF3; --muted:#9BA5BA; --line:#26324C;
  --board:#0A1020; --board-ink:#F4F6FB; --amber:#F5B82E; --amber-ink:#14213D; --accent-text:#F5B82E;
  --ok:#5BCB93; --ok-bg:#12352A; --bad:#F4776C; --bad-bg:#3A1A1C; --field:#0F182B; --soft:#1B2742; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#151F36; --ink:#E7EBF3; --muted:#9BA5BA; --line:#26324C;
  --board:#0A1020; --board-ink:#F4F6FB; --amber:#F5B82E; --amber-ink:#14213D; --accent-text:#F5B82E;
  --ok:#5BCB93; --ok-bg:#12352A; --bad:#F4776C; --bad-bg:#3A1A1C; --field:#0F182B; --soft:#1B2742; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.board{background:var(--board);color:var(--board-ink)}
header.board .wrap{padding-block:24px 22px;display:grid;gap:12px}
.platform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.platform .chip{background:var(--amber);color:var(--amber-ink);font-weight:700;padding:3px 10px;border-radius:4px;text-transform:none;letter-spacing:.02em}
.platform .code{opacity:.8;font-variant-numeric:tabular-nums}
.platform a.home{color:var(--board-ink);opacity:.85;text-decoration:none;font-weight:600;text-transform:none;letter-spacing:0;font-size:14px;margin-right:4px}
.platform a.home:hover{opacity:1;text-decoration:underline}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:0;max-width:62ch;opacity:.88}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.who label{font-size:14px;opacity:.85}
.who input{flex:1 1 220px;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:var(--board-ink);border-radius:8px;padding:9px 12px;font:inherit}
.who input::placeholder{color:rgba(244,246,251,.55)}
nav.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.steps .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.steps a{flex:0 0 auto;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
nav.steps a .n{color:var(--accent-text)}
nav.steps a .s{font-weight:500;color:var(--muted);font-size:12px}
nav.steps a.done{border-color:var(--ok)}
nav.steps a.done .s{color:var(--ok)}
main .wrap{padding-block:20px 130px;display:grid;gap:36px}
section.step{display:grid;gap:14px;scroll-margin-top:70px}
.step-head{display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);font-weight:700}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.step-head p{margin:0;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.card h3{margin:0;font-size:17px;font-weight:700}
.card .hint{margin:-8px 0 0;color:var(--muted);font-size:14px}
.seg-note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink)}
.seg-note b{color:var(--accent-text)}
.q{display:grid;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q .prompt{font-weight:500}
.q .num{display:inline-block;min-width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:15px;text-align:left;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
input.t,textarea.t,select.t{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea.t{min-height:72px;resize:vertical}
input.t:focus,textarea.t:focus,select.t:focus,.opt:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.t.right{border-color:var(--ok);background:var(--ok-bg)}
.t.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:14px;color:var(--muted)}
.fb.right{color:var(--ok)} .fb.wrong{color:var(--bad)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center}
.row2 .lab{font-weight:600}
.row2 .lab small{display:block;font-weight:400;color:var(--muted)}
@media (max-width:520px){.row2{grid-template-columns:1fr;gap:6px}}
.passage{line-height:2.2}
.passage .sp{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-right:6px}
.passage p{margin:0 0 6px}
.passage input.t{display:inline-block;width:8.5em;padding:2px 8px;font-size:15px;vertical-align:baseline}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:4px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.score{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.score.full{background:var(--ok-bg);color:var(--ok)}
.speak{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.speak svg{width:18px;height:18px}
.spellrow{display:flex;gap:10px;align-items:center}
.diff{line-height:1.9}
.diff span{padding:1px 3px;border-radius:4px}
.diff .hit{color:var(--ok)}
.diff .miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline}
.locked{opacity:.55}
.lockmsg{font-size:14px;color:var(--accent-text);font-weight:600;margin:0}
a.ext{color:var(--accent-text);font-weight:600}
.test-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.test-grid label{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:center;gap:6px;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:520px){.test-grid{grid-template-columns:1fr}}
.summary table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.summary td{padding:8px 0;border-bottom:1px solid var(--line)}
.summary td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:12px}
.summary tr.total td{border-bottom:0;font-size:18px}
/* home */
.lesson-list{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lesson:hover{border-color:var(--muted)}
.lesson .wk{font-family:var(--display);font-weight:800;font-size:20px;min-width:2.4em;text-align:center;color:var(--accent-text);font-variant-numeric:tabular-nums}
.lesson .nm{font-weight:600;line-height:1.3}
.lesson .cd{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.lesson .pr{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson .pr.ok{color:var(--ok)}
.how{display:grid;gap:8px;margin:0;padding-left:1.2em;color:var(--muted);max-width:65ch}
/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--board);color:var(--board-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.player .pbtn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:7px 11px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--board-ink);cursor:pointer;font-variant-numeric:tabular-nums}
.player .pbtn.main{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.player .pbtn[disabled]{opacity:.4;cursor:default}
.player .time{font-size:14px;font-variant-numeric:tabular-nums;opacity:.85;min-width:7.5em}
.player .src{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
.player .src a{color:var(--amber)}
.player input[type=file]{display:none}
.player input[type=range]{flex:1 1 120px;min-width:80px;accent-color:var(--amber)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.dl{display:grid;gap:10px}
.dline{display:grid;grid-template-columns:2em minmax(0,1fr);gap:6px;align-items:baseline;line-height:2.3;padding-top:8px;border-top:1px dashed var(--line)}
.dline:first-child{border-top:0;padding-top:0}
.dline .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.dline .sp{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-right:6px}
.dline input.t{display:inline-block;padding:2px 8px;font-size:15px;vertical-align:baseline;width:auto}
.ans{font-size:13px;color:var(--bad);margin-left:4px}
.topic-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.topic-head a{font-size:14px;color:var(--accent-text);font-weight:600}
.para{width:100%;border-collapse:collapse;font-size:15px}
.para th,.para td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.para th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.seg-play{display:inline-flex;gap:6px;align-items:center;padding:7px 14px;font-size:14px}
.tscript summary{cursor:pointer;font-weight:700}
.tscript p{margin:0;line-height:1.7}
.tscript .sp{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-right:6px}
.tscript mark{background:var(--ok-bg);color:var(--ink);padding:0 2px;border-radius:3px}
.prompt .sp{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-right:4px}
.amask.hide{color:transparent;background:var(--soft);border-radius:3px;user-select:none}
.tscript .hint2{font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
.btn.sm{padding:6px 12px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center}
.tk{cursor:pointer;border-radius:3px}
.tk:hover{background:var(--soft)}
.tk.kw{text-decoration:underline;text-decoration-color:var(--ok);text-decoration-thickness:2px;text-underline-offset:3px}
.tk.hl{background:#FFE58A;color:#14213D}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:8;width:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px;display:grid;gap:10px}
.pop-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop-w{font-size:18px}
.pop-x{font:inherit;font-size:22px;line-height:1;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 8px}
.pop-m{font-size:15px}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--field)}
.nt{display:grid;gap:10px}
.nt-row{display:grid;grid-template-columns:2em minmax(0,1fr);gap:6px;align-items:baseline;line-height:2.2}
.nt-row .no{color:var(--muted);font-variant-numeric:tabular-nums}
.nt-row input.t{display:inline-block;width:auto;padding:2px 8px;font-size:15px}
.speak.slow{font-weight:700;font-size:14px}
.ex-en{margin-top:4px;color:var(--ink)}
.ex-vi{font-size:14px;color:var(--muted)}
.ielts .ie-q{font-weight:800;font-size:17px}
.ielts .ie-ins{font-size:15px}
.ie-paper{border:1.5px solid var(--ink);border-radius:4px;padding:16px;background:var(--field);display:grid;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:16px}
.ie-title{text-align:center;font-weight:700;font-size:18px;letter-spacing:.02em}
.ie-ex{font-size:15px}
.ie-exans{white-space:nowrap}
.ie-h{font-weight:700;margin-top:6px}
.ie-ul{margin:0;padding-left:1.2em;display:grid;gap:6px;line-height:2.1}
.ie-n{display:inline-block;min-width:1.6em;text-align:center;font-family:var(--body);font-size:13px;border:1px solid var(--ink);border-radius:3px;margin-right:4px;line-height:1.5}
.ie-ul input.t{display:inline-block;width:auto;padding:2px 8px;font-size:15px;font-family:var(--body)}
.summary th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.summary th:not(:first-child),.summary td:not(:first-child){text-align:right;padding-left:12px;white-space:nowrap}
</style>

r subject (n)","môn chính / môn phụ (ở đại học)","And I suppose you're also taking a minor subject, aren't you?"],["long-distance (adj)","đường dài","and also long-distance, from here to London, for instance."],["impressive (adj)","ấn tượng","That's pretty impressive!"],["disabled (adj)","khuyết tật","Well, my sister is blind, so I'm particularly interested in working with disabled young people, to try and improve the quality of their lives."],["nominate (v)","đề cử","Well, the best way to get involved is to be nominated by some people who you know."],["Elections Officer (n)","cán bộ phụ trách bầu cử","You should talk to Jeffrey, our Elections Officer."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Good Morning. Youth Council…","to":"…And what's the postcode?","lines":[["Roger","Oh, hello, I'm interested in standing for [election] to the Youth [Council], and I was told to give you a call."],["Roger","At the moment I'm looking for a [flat] to rent here, so I'm in a [hostel] from Monday to Friday, I go back to my parents' place at the weekend."],["Roger","Oh, to my parents' address, please. That's 17, [Buckleigh] Street - B-U-C-K-L-E-I-G-H Street, Stamford, [Lincolnshire], though you don't really need the county."],["Roger","[PE9] [7QT]"]],"mcq":[["Why does Roger call?",["He wants a job at the town council","He wants to talk to Stephanie","He wants to run in the council election"],2,"Audio: 'standing for election' = ra ứng cử (run in the election)."],["Who told Roger about the Council?",["The person who leads the Council","Caroline","His parents"],0,"Audio: 'Stephanie - she's the chair of the Council' = người đứng đầu (leads) Hội đồng."],["How old is Roger?",["He recently became eighteen","He is thirteen","He is nineteen"],0,"Audio: 'I've just turned 18' = vừa mới tròn mười tám (recently became eighteen)."]],"transcript":[["Caroline","Good Morning. Youth Council. Caroline speaking."],["Roger","Oh, hello, I'm interested in standing for election to the Youth Council, and I was told to give you a call."],["Caroline","That's good. Could I have your name, please?"],["Roger","Yes, it's Roger Brown."],["Caroline","Thank you. I'm Caroline, the Youth Council administrator. So do you know much about what the Council does, Roger?"],["Roger","I've talked to Stephanie - I think she's the chair of the Council."],["Caroline","That's right."],["Roger","And she told me a lot about it. How it's a way for young people to discuss local issues, for example, and make suggestions to the town council. That's what made me interested."],["Caroline","Fine. Well let me take down some of your details. First of all, how old are you? You know the Council is for young people aged from 13 to 18?"],["Roger","I've just turned 18."],["Caroline","And where do you live, Roger?"],["Roger","Well, that's a bit complicated. At the moment I'm looking for a flat to rent here, so I'm in a hostel from Monday to Friday, I go back to my parents' place at the weekend."],["Caroline","OK, so where's the best place to send you some information about the Council?"],["Roger","Oh, to my parents' address, please. That's 17, Buckleigh Street - B-U-C-K-L-E-I-G-H Street, Stamford, Lincolnshire, though you don't really need the county."],["Caroline","Oh, I know Stamford - it's a lovely town. And what's the postcode?"],["Roger","PE9 7QT"]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"So are you working here…","to":"…from here to London, for instance.","lines":[["Roger","I've just finished a short-term [contract] as a courier, and now I'm working as a [waiter] in one of the big hotels."],["Roger","I [manage] to [fit] it all in."],["Roger","My ambition is to go into [parliament] eventually, so my major subject is [politics]."],["Roger","Well, I spend quite a lot of time [cycling] - both around town to get to [university] and to work, and also long-distance, from here to London, for instance."]],"mcq":[["What did Roger do before his job now?",["He worked in a big hotel","He studied economics","He delivered things for a short time"],2,"Audio: 'a short-term contract as a courier' = giao hàng (delivered things) trong thời gian ngắn."],["Does Roger have enough time to study?",["Yes, he can do everything","He stopped his part-time job","No, he has no time"],0,"Audio: 'I manage to fit it all in' = anh ấy xoay xở làm được mọi việc (everything)."],["How does Roger feel about his second subject?",["It is a bit disappointing","He prefers economics","He loves history a lot"],0,"Audio: 'not finding it as interesting as I expected' = hơi thất vọng (disappointing)."]],"transcript":[["Caroline","Right, thank you. So are you working here, or are you a student?"],["Roger","I started studying at the university a couple of weeks ago, and I've got a part-time job for a few hours a week."],["Caroline","What do you do?"],["Roger","Well, I've done several different things. I've just finished a short-term contract as a courier, and now I'm working as a waiter in one of the big hotels."],["Caroline","Uhuh. That can't leave you much time for studying!"],["Roger","Oh, it's not too bad. I manage to fit it all in."],["Caroline","What are you studying?"],["Roger","My ambition is to go into parliament eventually, so my major subject is politics.   That's partly why I think the Youth Council is important and want to be a part of it."],["Caroline","And I suppose you're also taking a minor subject, aren't you? I know a lot of people study economics too."],["Roger","I chose history. To be honest, I'm not finding it as interesting as I expected!"],["Caroline","OK, so with your studying and your part-time job, do you have time for any other interests or hobbies?"],["Roger","Well, I spend quite a lot of time cycling - both around town to get to university and to work, and also long-distance, from here to London, for instance."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"That's pretty impressive…","to":"hết Part 1","lines":[["Roger","For relaxation I'm also keen on s ago",["6","six"]],["Has a lot of specialist","",["staff"]],["Not about low-calorie diets or weight","",["loss"]],["Free talk every Thursday evening – arrive at","",["7.30","7:30"]]]},{"heading":"Third centre","lines":[["Has a very good","",["reputation"]],["Also teaches some meat and","cookery",["fish"]],["Two-hour course: buying, sharpening and","techniques",["chopping"]],["Course gets booked up","",["quickly"]]]}]}},{"id":"sl-c13t2","topic":"Student Life","code":"Cam 13 · Test 2 · Part 1","title":"South City Cycling Club","intro":"Một người phụ nữ gọi điện cho Jim, thư ký câu lạc bộ đạp xe South City, để hỏi về việc trở thành thành viên và các buổi đạp xe tập luyện.","testPdf":"https://drive.google.com/file/d/15x0eF4ZHa_EpyGMlzhfB6j7WboZUpNO8/view","vocab":[["club secretary (n)","thư ký câu lạc bộ","I'm the club secretary and my name's Jim Hunter."],["membership (n)","tư cách hội viên, thẻ hội viên","So, are you interested in membership for yourself?"],["race (n)","cuộc đua","That costs 260 dollars and that covers you not just for ordinary cycling but also for races both here in the city and also in other parts of Australia."],["recreational (adj)","để giải trí, thư giãn","So, in that case you'd be better with the Recreational membership."],["quarterly (adv)","theo quý (3 tháng một lần)","It's paid quarterly, and you can upgrade it later to the Full membership if you want to, of course."],["upgrade (v)","nâng cấp","It's paid quarterly, and you can upgrade it later to the Full membership if you want to, of course."],["insurance (n)","bảo hiểm","They also provide insurance in case you have an accident, though we hope you won't need that, of course."],["kit (n)","bộ đồng phục (thể thao)","And once you're a member of the club, you're also permitted to wear our kit when you're out cycling."],["made to order","làm theo đơn đặt hàng","No, it's made to order by a company in Brisbane."],["fitness (n)","thể lực, sức khỏe","they're a really good way of improving your cycling skills as well as your general level of fitness"],["novice (n)","người mới bắt đầu","and then level C are the novices, who stay at about 15 kilometres per hour."],["meeting point (n)","điểm tập trung","There's one on Tuesdays, and for that one you meet at 5.30 am, and the meeting point's the stadium"],["stadium (n)","sân vận động","There's one on Tuesdays, and for that one you meet at 5.30 am, and the meeting point's the stadium"],["route (n)","tuyến đường, lộ trình","If you check the club website, you'll see that the route for each ride is clearly marked."],["sunrise (n)","bình minh, lúc mặt trời mọc","And in winter, it's well before sunrise when we set out, so you need to make sure your bike's got lights."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello, South City Cycling Club…","to":"…put in an order on their website.","lines":[["Jim","That costs 260 dollars and that covers you not just for ordinary [cycling] but also for [races] both here in the city and also in other parts of [Australia]."],["Jim","So, in that case you'd be better with the [Recreational] [membership]."],["Jim","They also provide [insurance] in case you have an [accident], though we hope you won't need that, of course."],["Jim","You can find them [online]: they're called [Jerriz]."]],"mcq":[["Why doesn't she choose Full membership?",["It is too serious for the city","It needs a club kit","She is not good enough yet"],2,"Audio: 'I'm not really up to that standard' = cô ấy chưa đủ giỏi (not good enough)."],["How often is the Recreational membership paid?",["Every week","Every three months","Once a year"],1,"Audio: 'It's paid quarterly' = mỗi ba tháng (every three months)."],["Where can she get the green and white kit?",["At the club","From a firm on the internet","From a shop in the city"],1,"Audio: 'made to order by a company... find them online' = một công ty trên mạng (firm on the internet)."]],"transcript":[["Jim","Hello, South City Cycling Club."],["Woman","Oh, hi. Er... I want to find out about joining the club."],["Jim","Right. I can help you there. I'm the club secretary and my name's Jim Hunter."],["Woman","Oh, hi Jim."],["Jim","So, are you interested in membership for yourself?"],["Woman","That's right."],["Jim","OK. Well there are basically two types of adult membership. If you're pretty serious about cycling, there's the Full membership. That costs 260 dollars and that covers you not just for ordinary cycling but also for races both here in the city and also in other parts of Australia. ( )"],["Woman","Right. Well, I'm not really up to that standard. I was more interested in just joining a group to do some cycling in my free time."],["Jim","Sure. That's why most people join. So, in that case you'd be better with the Recreational membership. That's 108 dollars if you're over 19, and 95 dollars if you're under."],["Woman","I'm 25."],["Jim","OK. It's paid quarterly, and you can upgrade it later to the Full membership if you want to, of course. Now both types of membership include the club fee of 20 dollars. They also provide insurance in case you have an accident, though we hope you won't need that, of course. ( )"],["Woman","No. OK, well, I'll go with the Recreational membership, I think. And that allows me to join in the club activities, and so on?"],["Jim","That's right. And once you're a member of the club, you're also permitted to wear our kit when you're out cycling. It's green and white."],["Woman","Yes, I've seen cyclists wearing it. So, can I buy that at the club?"],["Jim","No, it's made to order by a company in Brisbane. You can find them online: they're called Jerriz. That's J-E-R-R-I-Z. ( ) You can use your membership number to put in an order on their website."],["Woman","OK. Now, can you tell me a bit about the rides I can do?"]]},{"id":"B","title":"Đoạn B","qs":"Q4–6","from":"Sure. So we have training rides…","to":"…That's it.","lines":[["Jim","If you can do about [25] kilometres an hour, you'd probably be level B, and then level C are the [novices], who stay at about 15 kilometres per hour."],["Jim","There's one on [Tuesdays], and for that one you meet at 5.30 am, and the meeting point's the [stadium]"],["Woman","Yes, it's quite [near] my [home], in fact."],["Jim","It starts at the same [time], but they meet at the main [gate] to the [park]."]],"mcq":[["What are training rides good for?",["Learning to fix bikes","Getting fitter and more skilful","Making new friends at the club"],1,"Audio: 'improving your cycling skills as well as your general level of fitness' = khỏe hơn và giỏi hơn (fitter, more skilful)."],["Who is level C for?",["Beginners","Very fast riders","Riders over thirty"],0,"Audio: 'level C are the novices' = người mới bắt đầu (beginners)."],["What does she say about the Tuesday meeting place?",["It is far from her home","She doesn't know where it is","It is close to her house"],2,"Audio: 'it's quite near my home' = gần nhà (close to her house)."]],"transcript":[["Jim","Sure. So we have training rides pretty well every morning, and they're a really good way of improving your cycling skills as well as your general level of fitness, but they're different levels. Level A is pretty fast - you're looking at about 30 or 35 kilometres an hour. If you can do about 25 kilometres an hour, you'd probably be level B, ( ) and then level C are the novices, who stay at about 15 kilometres per hour."],["Woman","Right. Well I reckon I'd be level B. So, when are the sessions for that level?"],["Jim","There are a couple each week. They're both early morning sessions. There's one on Tuesdays, and for that one you meet at 5.30 am, and the meeting point's the stadium ( ) - do you know where that is?"],["Woman","Yes, it's quite near my home, in fact. OK, and how about the other one?"],["Jim","That's on Thursdays. It starts at the same time, but they meet at the main gate to the park. ( )"],["Woman","Is that the one just past the shopping mall?"],["Jim","That's it."]]},{"id":"C","title":"Đoạn C","qs":"Q7–10","from":"So how long are the rides?…","to":"hết Part 1","lines":[["Jim","And the members often go somewhere for [coffee] afterwards, so it's quite a [social] event."],["Woman","And does each [ride] have a [leader]?"],["Jim","If you check the club [website], you'll see that the [route] for each ride is clearly marked."],["Jim","And in winter, it's well before [sunrise] when we set out, so you need to make sure your bike's got [lights]."]],"mcq":[["How long are the rides?",["Half a day","About an hour","About ninety minutes"],2,"Audio: 'about an hour and a half' = khoảng chín mươi phút (ninety minutes)."],["Why is the social side good for her?",["She has many friends at work","She wants a job","She is new in the city"],2,"Audio: 'I've only just moved to the city' = cô ấy mới đến thành phố (new in the city)."],["How do the group members behave on a ride?",["They help each other","They ride alone","They follow the fastest rider"],0,"Audio: 'the group members on the ride support one another' = giúp đỡ nhau (help each other)."]],"transcript":[["Woman","So how long are the rides?"],["Jim","They're about an hour and a half. So, if you have a job it's easy to fit in before you go to work. And the members often go somewhere for coffee afterwards, so it's quite a social event. ( )"],["Woman","OK. That sounds good. I've only just moved to the city so I don't actually know many people yet."],["Jim","Well, it's a great way to meet people."],["Woman","And does each ride have a leader?"],["Jim","Sometimes, but not always. ( ) But you don't really need one; the group members on the ride support one another, anyway."],["Woman","How would we know where to go?"],["Jim","If you check the club website, you'll see that the route for each ride is clearly marked. ( ) So you can just print that out and take it along with you. It's similar from one week to another, but it's not always exactly the same."],["Woman","And what do I need to bring?"],["Jim","Well, bring a bottle of water, and your phone. You shouldn't use it while you're cycling, but have it with you."],["Woman","Right."],["Jim","And in winter, it's well before sunrise when we set out, so you need to make sure your bike's got lights. ( )"],["Woman","That's OK. Well, thanks Jim. I'd definitely like to join. So what's the best way of going about it?"],["Jim","You can ..."]]}],"key":[["races"],["insurance"],["Jerriz"],["25","twenty-five","twenty five"],["stadium"],["park"],["coffee"],["leader"],["route"],["lights"]],"anyOrder":[],"keyNote":"Q3: tên riêng viết hoa, đánh vần J-E-R-R-I-Z. Q4: chỉ ghi số 25 (không cần 'km/h'). Q10: dùng số nhiều 'lights'.","answerLines":[["JIM","That costs 260 dollars and that covers you not just for ordinary cycling but also for [races] both here in the city and also in other parts of Australia."],["JIM","They also provide [insurance] in case you have an accident, though we hope you won't need that, of course."],["JIM","You can find them online: they're called [Jerriz]."],["JIM","If you can do about [25] kilometres an hour, you'd probably be level B, and then level C are the novices, who stay at about 15 kilometres per hour."],["JIM","There's one on Tuesdays, and for that one you meet at 5.30 am, and the meeting point's the [stadium] - do you know where that is?"],["JIM","It starts at the same time, but they meet at the main gate to the [park]."],["JIM","And the members often go somewhere for [coffee] afterwards, so it's quite a social event."],["WOMAN","And does each ride have a [leader]?"],["JIM","If you check the club website, you'll see that the [route] for each ride is clearly marked."],["JIM","And in winter, it's well before sunrise when we set out, so you need to make sure your bike's got [lights]."]],"para":[["all over Australia","in other parts of Australia"],["the entrance to the …","the main gate to the …"],["speed about …","if you can do about … kilometres an hour"],["There is not always a …","Sometimes, but not always"],["check rkshop (n)","lớp học thực hành","I wanted some information about the workshops in the school holidays."],["cover (n)","lớp bọc, vỏ bọc","they work together to design a special cover that goes round an egg"],["drop something from a height","thả vật gì từ trên cao xuống","so that when it's inside they can drop it from a height and it doesn't break."],["competition (n)","cuộc thi","Well, they have a competition to see who can make the highest tower."],["be attached to (v)","được gắn vào","one thing they do is to design and build a car that's attached to a balloon"],["force (n) / power (v)","lực / cung cấp năng lượng để chạy","and the force of the air in that actually powers the car and makes it move along."],["advanced (adj)","nâng cao","Some are the same, but a bit more advanced."],["vehicle (n)","xe cộ, phương tiện","So they work out how to build model vehicles, things like cars and trucks"],["construct (v)","xây dựng, lắp ráp","but also how to construct animals using the same sorts of material and technique"],["coding (n) / program (v)","lập trình","So they learn a bit of coding?"],["recycled materials (n)","vật liệu tái chế","it's to use recycled materials like card and wood to build a bridge, and the longest one gets a prize."],["animation software (n)","phần mềm làm phim hoạt hình","think up an idea for a five-minute movie and then film it, using special animation software."],["clear up (v)","dọn dẹp","we found it didn't give our staff enough time to clear up after the first workshop, so we moved them to Wednesdays."],["industrial estate (n)","khu công nghiệp","and that's in Fradstone Industrial Estate."],["enrol (v)","đăng ký (khóa học)","So would you like to enrol Lydia and Carly now?"]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello. Children's Engineering Workshops…","to":"…They go really fast too.","lines":[["Father","The [younger] one's Lydia, she's four - do you take [children] as young as that?"],["Sarah","For example, they work together to design a special [cover] that goes round an [egg], so that when it's inside they can drop it from a [height] and it doesn't break."],["Sarah","Well, they have a [competition] to see who can make the [highest] [tower]."],["Sarah","For example, one thing they do is to design and build a [car] that's attached to a [balloon], and the force of the air in that actually powers the car and makes it move along."]],"mcq":[["When are the workshops?",["After school every day","At weekends only","During the school vacations"],2,"Audio: 'in the school holidays' = trong kỳ nghỉ (vacations)."],["Is Lydia old enough for the workshops?",["No, she is too young","Yes, there is a group for her age","Only with her older sister"],1,"Audio: 'our Tiny Engineers workshop is for four to five-year-olds' = có nhóm cho tuổi (age) của bé."],["What does Sarah say about things breaking?",["It is part of the enjoyment","It never breaks","Parents must pay for it"],0,"Audio: 'that's part of the fun' = đó là một phần niềm vui (enjoyment)."]],"transcript":[["Sarah","Hello. Children's Engineering Workshops."],["Father","Oh hello. I wanted some information about the workshops in the school holidays."],["Sarah","Sure."],["Father","I have two daughters who are interested. The younger one's Lydia, she's four - do you take children as young as that?"],["Sarah","Yes, our Tiny Engineers workshop is for four to five-year-olds."],["Father","What sorts of activities do they do?"],["Sarah","All sorts. For example, they work together to design a special cover that goes round an egg, so that when it's inside they can drop it from a height and it doesn't break. ( ) Well, sometimes it does break but that's part of the fun!"],["Father","Right. And Lydia loves building things. Is there any opportunity for her to do that?"],["Sarah","Well, they have a competition to see who can make the highest tower. ( ) You'd be amazed how high they can go."],["Father","Right."],["Sarah","But they're learning all the time as well as having fun. For example, one thing they do is to design and build a car that's attached to a balloon, and the force of the air in that actually powers the car and makes it move along. ( ) They go really fast too."]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"OK, well, all this sounds perfect…","to":"…move its arms and legs.","lines":[["Sarah","So they work out how to build model [vehicles], things like cars and trucks, but also how to construct [animals] using the same sorts of material and technique,"],["Sarah","Yes, with the Junior Engineers, it's to use [recycled] materials like card and wood to build a [bridge], and the [longest] one gets a prize."],["Sarah","Then they have something a bit different, which is to think up an idea for a [five-minute] [movie] and then film it, using special animation software."],["Sarah","And then they also build a [robot] in the shape of a human, and they [decorate] it and program it so that it can move its arms and legs."]],"mcq":[["How are the Junior activities different?",["They are shorter","They are all the same","They are harder"],2,"Audio: 'a bit more advanced' = khó hơn (harder)."],["How do the children learn coding?",["Only from books","From each other, too","From their parents at home"],1,"Audio: 'they learn from one another too' = học từ nhau (each other)."],["What materials do they use in the competition?",["Old things used again","Metal from trucks","New plastic"],0,"Audio: 'recycled materials like card and wood' = đồ cũ được dùng lại (used again)."]],"transcript":[["Father","OK, well, all this sounds perfect. Now Carly, that's my older daughter, has just had her seventh birthday, so presumably she'd be in a different group?"],["Sarah","Yes, she'd be in the Junior Engineers. That's for children from six to eight."],["Father","And do they do the same sorts of activities?"],["Sarah","Some are the same, but a bit more advanced. So they work out how to build model vehicles, things like cars and trucks, but also how to construct animals using the same sorts of material and technique, ( ) and then they learn how they can program them and make them move."],["Father","So they learn a bit of coding?"],["Sarah","They do. They pick it up really quickly. We're there to help if they need it, but they learn from one another too."],["Father","Right. And do they have competitions too?"],["Sarah","Yes, with the Junior Engineers, it's to use recycled materials like card and wood to build a bridge, and the longest one gets a prize. ( )"],["Father","That sounds fun. I wouldn't mind doing that myself!"],["Sarah","Then they have something a bit different, which is to think up an idea for a five-minute movie and then film it, using special animation software. ( ) You'd be amazed what they come up with."],["Father","And of course, that's something they can put on their phone and take home to show all their friends."],["Sarah","Exactly. And then they also build a robot in the shape of a human, and they decorate it and program it so that it can move its arms and legs. ( )"]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"Perfect. So, is it the same price as the Tiny Engineers?…","to":"hết Part 1","lines":[["Sarah","It's just a bit more: £50 for the [five] [weeks]."],["Sarah","They used to be, but we found it didn't give our staff enough time to [clear] up after the first workshop, so we moved them to [Wednesdays]."],["Sarah","They're in building 10A - there's a big [sign] on the door, you can't miss it, and that's in [Fradstone] Industrial Estate."],["Father","And will I have any [parking] [problems] there?"]],"mcq":[["How much is the Junior course?",["A little more than Tiny Engineers","Much cheaper","The same price as Tiny Engineers"],0,"Audio: 'It's just a bit more' = đắt hơn một chút (a little more)."],["Why did they change the class day?",["The room was too small","The children were busy on Monday","Staff needed more time to tidy"],2,"Audio: 'didn't give our staff enough time to clear up' = nhân viên cần thêm thời gian dọn dẹp (tidy)."],["Where is the area?",["In the city centre","Beyond the station","Next to the station"],1,"Audio: 'up past the station' = qua khỏi nhà ga (beyond the station)."]],"transcript":[["Father","Perfect. So, is it the same price as the Tiny Engineers?"],["Sarah","It's just a bit more: £50 for the five weeks."],["Father","And are the classes on a Monday, too?"],["Sarah","They used to be, but we found it didn't give our staff enough time to clear up after the first workshop, so we moved them to Wednesdays. ( ) The classes are held in the morning from ten to eleven."],["Father","OK. That's better for me actually. And what about the location? Where exactly are the workshops held?"],["Sarah","They're in building 10A - there's a big sign on the door, you can't miss it, and that's in Fradstone Industrial Estate. ( )"],["Father","Sorry?"],["Sarah","Fradstone - that's F-R-A-D-S-T-O-N-E."],["Father","And that's in Grasford, isn't it?"],["Sarah","Yes, up past the station."],["Father","And will I have any parking problems there?"],["Sarah","No, there's always plenty available. ( )"],["Father","OK."],["Sarah","So would you like to enrol Lydia and Carly now? So can I have your full name..."]]}],"key":[["egg"],["tower"],["car"],["animals"],["bridge"],["movie","film"],["decorate"],["Wednesdays","Wednesday"],["Fradstone"],["parking"]],"anyOrder":[],"keyNote":"Q4: số nhiều 'animals'. Q8: thứ trong tuần viết hoa (Wednesday/Wednesdays). Q9: tên riêng viết hoa, đánh vần F-R-A-D-S-T-O-N-E.","answerLines":[["SARAH","For example, they work together to design a special cover that goes round an [egg], so that when it's inside they can drop it from a height and it doesn't break."],["SARAH","Well, they have a competition to see who can make the highest [tower]."],["SARAH","For example, one thing they do is to design and build a [car] that's attached to a balloon, and the force of the air in that actually powers the car and makes it move along."],["SARAH","So they work out how to build model vehicles, things like cars and trucks, but also how to construct [animals] using the same sorts of material and technique, and then they learn how they can program them and make them move."],["SARAH","Yes, with the Junior Engineers, it's to use recycled materials like card and wood to build a [bridge], and the longest one gets a prize."],["SARAH","Then they have something a bit different, which is to think up an idea for a five-minute [movie] and then film it, using special animation software."],["SARAH","And then they also build a robot in the shape of a human, and they [decorate] it and program it so that it can move its arms and legs."],["SARAH","They used to be, but we found it didn't give our staff enough time to clear up after the first workshop, so we moved them to [Wednesdays]."],["SARAH","They're in building 10A - there's a big sign on the door, you can't miss it, and that's in [Fradstone] Industrial Estate."],["FATHER","And will I have any [parking] problems there?"]],"para":[["the tallest …","the highest …"],["powered by a balloon","attached to a balloon, and the force of the air … powers the car"],["a short …","a five-minute …"],["a humanoid robot","a robot in the shape of a human"],["Plenty of … is available","there's always plenty available"]],"answerSource":"transcript","audio":{"src":"audio/sl-c16t1.mp3","segs":{"A":[86.3,166.2],"B":[164.8,317.6],"C":[316.2,383.3]},"conv":[87.2,382]},"phrases":[["as young as + age","nhỏ tới mức… tuổi – hỏi giới hạn độ tuổi.","do you take children as young as that?","bên chị có nhận trẻ nhỏ như vậy không?"],["You'd be amazed how/what…","Bạn sẽ ngạc nhiên lắm khi thấy… – nhấn mạnh điều gì đó rất ấn tượng.","You'd be amazed how high they can go.","Chị sẽ ngạc nhiên khi thấy các bé xếp cao được đến đâu."],["as well as + V-ing","cũng như, đồng thời với việc…","But they're learning all the time as well as having fun.","Nhưng các bé vừa học suốt mà vừa được vui chơi."],["work out how to + V","tìm ra cách làm gì.","So they work out how to build model vehicles, things like cars and trucks","Vậy các bé tìm ra cách chế tạo mô hình xe, như ô tô và xe tải."],["pick something up","học được cái gì một cách tự nhiên, nhanh.","They pick it up really quickly.","Các bé học rất nhanh."],["I wouldn't mind + V-ing","Tôi cũng muốn… (cách nói nhẹ nhàng thể hiện mong muốn).","I wouldn't mind doing that myself!","Chính tôi cũng muốn làm thử đấy!"],["think up / come up with","nghĩ ra (ý tưởng).","You'd be amazed what they come up with.","Chị sẽ ngạc nhiên với những gì các bé nghĩ ra."],["They used to be, but…","Trước đây thì vậy, nhưng… – dùng để nói về thay đổi.","They used to be, but we found it didn't give our staff enough time to clear up after the first workshop","Trước đây thì vậy, nhưng chúng tôi thấy nhân viên không đủ thời gian dọn dẹp sau buổi đầu tiên."],["you can't miss it","bạn không thể không thấy (rất dễ tìm).","there's a big sign on the door, you can't miss it","có một tấm biển lớn trên cửa, chị không thể bỏ lỡ được đâu."]],"spellnum":[["A","Yes, our Tiny Engineers workshop is for [four to five]-year-olds.",["4-5","4 to 5","four to five"],"Độ tuổi lớp Tiny Engineers",[103.9,114.4]],["B","That's for children from [six to eight].",["6-8","6 to 8","six to eight"],"Độ tuổi lớp Junior Engineers",[225.5,236]],["C","The classes are held in the morning from [ten to eleven].",["10-11","10 to 11","ten to eleven","10am to 11am"],"Giờ học",[332.1,342.6]],["C","They're in building [10A]",["10A"],"Số tòa nhà",[345.1,355.6]],["C","Fradstone - that's [F-R-A-D-S-T-O-N-E].",["Fradstone"],"Tên khu công nghiệp",[357.4,367.9]]],"synonyms":[["in the school holidays","during the school vacations","trong kỳ nghỉ của trường"],["Lydia loves building things","enjoys constructing things","thích lắp ráp, xây dựng đồ vật"],["that's part of the fun","it is part of the enjoyment","đó là một phần niềm vui"],["has just had her seventh birthday","recently turned seven","vừa tròn bảy tuổi"],["a bit more advanced","more difficult","nâng cao hơn một chút"],["they learn from one another","learn from each other","học hỏi lẫn nhau"],["in the shape of a human","humanoid","có hình dáng con người"],["up past the station","beyond the station","đi qua khỏi nhà ga"]],"newtest":{"type":"notes","title":"Children's Engineering Workshops","instruction":"Complete the notes below.","limit":"ONE WORD AND/OR A NUMBER","maxWords":1,"example":["Workshops take place in the:","school holidays"],"sections":[{"heading":"Tiny Engineers","lines":[["Lydia's age:","",["4","four"]],["Egg dropped from a height must not","",["break"]],["Car is moved by the force of the","in a balloon",["air"]]]},{"heading":"Junior Engineers","lines":[["Carly's age:","",["7","seven"]],["Build model vehicles, e.g. cars and","",["trucks"]],["Children learn a bit of","",["coding"]],["Bridge made from card and","",["wood"]],["Film made with special animation","",["software"]],["Robot in the shape of a","",["human"]]]},{"heading":"Practical details","lines":[["Cost: £","for the five weeks",["50"]],["Classes: 10–11 am, building 10A, Grasford","",null]]}]}},{"id":"sl-c16t3","topic":"Student Life","code":"Cam 16 · Test 3 · Part 1","title":"Junior Cycle Camp","intro":"Một người mẹ gọi điện cho Jake ở trại đạp xe Junior Cycle Camp để hỏi thông tin trước khi cho con trai Charlie tham gia.","testPdf":"https://drive.google.com/file/d/1Kw31a6-io9u4kRyBpADgFqpodySIXVzf/view","vocab":[["summer vacation (n)","kỳ nghỉ hè","Well, it's held every weekday morning over the summer vacation and we focus on basic cycling skills and safety."],["safety (n)","sự an toàn","Well, it's held every weekday morning over the summer vacation and we focus on basic cycling skills and safety."],["instructor (n)","huấn luyện viên, người hướng dẫn","Right. And can you tell me a bit about the instructors?"],["supervisor (n)","người giám sát","So, we have three supervisors, and they have red shirts."],["stand in for (v)","làm thay, thay thế ai","They support the instructors, and they also stand in for me if I'm not around."],["be responsible for","chịu trách nhiệm về","Then the instructors themselves are in blue shirts, and one of these is responsible for each class."],["submit (v)","nộp","all our instructors have to submit a reference from someone who's seen them work with children"],["reference (n)","thư giới thiệu (xác nhận năng lực)","all our instructors have to submit a reference from someone who's seen them work with children"],["well-being (n)","sức khỏe và hạnh phúc, sự an toàn","and generally care for the well-being of the kids in their class."],["limit (n)","giới hạn","We have a limit of eight children in each class, so their instructor really gets to know them well."],["waterproofs (n)","quần áo chống nước","We don't let that put us off - we just put on our waterproofs and keep cycling."],["spare clothes (n)","quần áo dự phòng","Well, maybe some spare clothes, especially if the weather's not so good."],["medication (n)","thuốc (đang dùng)","And just at present Charlie has to take medication every few hours, so I'll make sure he has that."],["helmet (n)","mũ bảo hiểm","The most important is that we have a very careful check to make sure that every child's helmet fits properly."],["adjust (v)","điều chỉnh","If it doesn't fit, we'll try to adjust it, or we'll find him another one"],["fill up (v)","kín dần, đầy dần","But the places are filling up quite quickly."]],"segments":[{"id":"A","title":"Đoạn A","qs":"Q1–3","from":"Hello, Junior Cycle camp, Jake speaking…","to":"…They do a great job, I have to say.","lines":[["Woman","He can [ride] a bike, but he needs a little more [training] before he's safe to go on the [road]."],["Jake","They start off practising on the [site] here, and we aim to get them riding on the road, but first they're taken to ride in the [park], away from the [traffic]."],["Jake","Then the instructors themselves are in [blue] [shirts], and one of these is responsible for each class."],["Jake","In order to be accepted, all our instructors have to [submit] a [reference] from someone who's seen them work with children - like if they've worked as a [babysitter], for example."]],"mcq":[["When is the camp held?",["Every weekend in summer","Monday to Friday mornings in summer","Every evening"],1,"Audio: 'every weekday morning over the summer vacation' = sáng thứ Hai đến thứ Sáu (Monday to Friday)."],["What does Charlie need?",["He cannot ride a bike yet","More practice before riding in traffic","A new bike"],1,"Audio: 'needs a little more training before he's safe to go on the road' = cần luyện tập thêm (more practice)."],["What do the supervisors do?",["Help instructors and replace Jake when needed","Teach each class alone","Plan the road rides"],0,"Audio: 'support the instructors... stand in for me' = hỗ trợ và thay thế (replace) Jake."]],"transcript":[["Jake","Hello, Junior Cycle camp, Jake speaking."],["Woman","Hi. I'm calling for some information about the cycle camp - I'm thinking of sending my son."],["Jake","Great. Well, it's held every weekday morning over the summer vacation and we focus on basic cycling skills and safety. We have eight levels for children from three years upwards. How old's your son?"],["Woman","Charlie? He's seven. He can ride a bike, but he needs a little more training before he's safe to go on the road."],["Jake","He'd probably be best in Level 5. They start off practising on the site here, and we aim to get them riding on the road, but first they're taken to ride in the park, away from the traffic. ( )"],["Woman","Right. And can you tell me a bit about the instructors?"],["Jake","Well, all our staff wear different coloured shirts. So, we have three supervisors, and they have red shirts. They support the instructors, and they also stand in for me if I'm not around. Then the instructors themselves are in blue shirts, and one of these is responsible for each class. ( )"],["Woman","OK."],["Jake","In order to be accepted, all our instructors have to submit a reference from someone who's seen them work with children - like if they've worked as a babysitter, for example. ( ) Then they have to complete our training course, including how to do lesson plans, and generally care for the well-being of the kids in their class. They do a great job, I have to say."]]},{"id":"B","title":"Đoạn B","qs":"Q4–7","from":"Right. And tell me a bit about the classes…","to":"…we'll make sure he does.","lines":[["Jake","They're out riding most of the time but they have [quiet] times too, where their instructor might tell them a [story] that's got something to do with cycling, or get them to play a game together."],["Woman","Now, what happens if there's [rain]? Do the classes still [run]?"],["Jake","Well, maybe some [spare] clothes, especially if the weather's not so good. And a [snack] for break time."],["Woman","And just at present Charlie has to take [medication] every few [hours], so I'll make sure he has that."]],"mcq":[["What might children do during quiet times?",["Play a group game","Sleep for an hour","Watch a cycling show"],0,"Audio: 'get them to play a game together' = chơi trò chơi theo nhóm (group game)."],["What might Charlie need if the weather is bad?",["A drink","Sandals","Extra clothes"],2,"Audio: 'some spare clothes, especially if the weather's not so good' = quần áo thêm (extra clothes)."],["What does the camp give the children?",["They give out shoes","They supply drinks","They bring spare clothes"],1,"Audio: 'How about a drink? - No, we'll provide that' = trại cung cấp (supply) đồ uống."]],"transcript":[["Woman","Right. And tell me a bit about the classes. What size will Charlie's class be?"],["Jake","We have a limit of eight children in each class, so their instructor really gets to know them well. They're out riding most of the time but they have quiet times too, where their instructor might tell them a story that's got something to do with cycling, or get them to play a game together. ( ) It's a lot of fun."],["Woman","It must be. Now, what happens if there's rain? Do the classes still run?"],["Jake","Oh yes. We don't let that put us off - we just put on our waterproofs and keep cycling. ( )"],["Woman","And is there anything special Charlie should bring along with him?"],["Jake","Well, maybe some spare clothes, especially if the weather's not so good. And a snack for break time. ( )"],["Woman","How about a drink?"],["Jake","No, we'll provide that. And make sure he has shoes, not sandals."],["Woman","Sure. And just at present Charlie has to take medication every few hours, so I'll make sure he has that. ( )"],["Jake","Absolutely. Just give us details of when he has to take it and we'll make sure he does."],["Woman","Thanks."]]},{"id":"C","title":"Đoạn C","qs":"Q8–10","from":"Now, there are a few things you should know about Day 1…","to":"hết Part 1","lines":[["Jake","The [classes] normally start at [9.30] every morning, but on Day 1 you should aim to get Charlie here by 9.20."],["Jake","The most important is that we have a very careful [check] to make sure that every child's [helmet] fits properly."],["Jake","Then after that, all the instructors will be waiting to meet their [classes], and they'll meet up in the [tent] - you can't miss it."],["Jake","[One] [hundred] [ninety-nine] dollars."]],"mcq":[["When should Charlie arrive on Day 1?",["Ten minutes earlier than usual","At 9.30 as usual","At 12.30"],0,"Audio: 'aim to get Charlie here by 9.20' (thay vì 9.30) = sớm hơn mười phút (ten minutes earlier)."],["Why do they need additional time on Day 1?",["The instructors arrive late","The children need breakfast","There are more jobs to do first"],2,"Audio: 'there are a few extra things to do' = có thêm việc cần làm (more jobs)."],["How has the price changed since last year?",["It is much cheaper","It has gone up a little","It is twice as much"],1,"Audio: 'more or less the same as last year' (190 → nay hơn một chút) = tăng nhẹ (gone up a little)."]],"transcript":[["Jake","Now, there are a few things you should know about Day 1 of the camp. The classes normally start at 9.30 every morning, but on Day 1 you should aim to get Charlie here by 9.20. The finishing time will be 12.30 as usual. We need the additional time because there are a few extra things to do. The most important is that we have a very careful check to make sure that every child's helmet fits properly. ( ) If it doesn't fit, we'll try to adjust it, or we'll find him another one - but he must wear it all the time he's on the bike."],["Woman","Of course."],["Jake","Then after that, all the instructors will be waiting to meet their classes, and they'll meet up in the tent - you can't miss it. ( ) And each instructor will take their class away and get started."],["Woman","OK. Well that all sounds good. Now can you tell me how much the camp costs a week?"],["Jake","One hundred ninety-nine dollars. ( ) We've managed to keep the price more or less the same as last year - it was one hundred ninety then. But the places are filling up quite quickly."],["Woman","Right. OK, well I'd like to book for..."]]}],"key":[["park"],["blue"],["reference"],["story"],["rain"],["snack"],["medication"],["helmet"],["tent"],["199"]],"anyOrder":[],"keyNote":"Q10: viết bằng số 199 (đề đã có sẵn ký hiệu $). Q3: 'reference' (thư giới thiệu), chú ý chính tả.","answerLines":[["JAKE","They start off practising on the site here, and we aim to get them riding on the road, but first they're taken to ride in the [park], away from the traffic."],["JAKE","Then the instructors themselves are in [blue] shirts, and one of these is responsible for each class."],["JAKE","In order to be accepted, all our instructors have to submit a [reference] from someone who's seen them work with children - like if they've worked as a babysitter, for example."],["JAKE","They're out riding most of the time but they have quiet times too, where their instructor might tell them a [story] that's got something to do with cycling, or get them to play a game together."],["WOMAN","Now, what happens if there's [rain]?"],["JAKE","And a [snack] for break time."],["WOMAN","And just at present Charlie has to take [medication] every few hours, so I'll make sure he has that."],["JAKE","The most important is that we have a very careful check to make sure that every child's [helmet] fits properly."],["JAKE","Then after that, all the instructors will be waiting to meet their classes, and they'll meet up in the [tent] - you can't miss it."],["JAKE","[One] [hundred] [ninety-nine] dollars."]],"para":[["Classes are held even if there is …","what happens if there's …? Do the classes still run? - Oh yes."],["a change of clothing","some spare clothes"],["shoes (not sandals)","make sure he has shoes, not sandals"],["required","have to submit"],["will be checked","a very careful check"]],"answerSource":"transcript","audio":{"src":"audio/sl-c16t3.mp3","segs":{"A":[86.4,214.9],"B":[213.5,353.3],"C":[351.9,454.5]},"conv":[87.3,453.2]},"phrases":[["I'm thinking of + V-ing","Tôi đang tính làm gì – nói về kế hoạch chưa chắc chắn.","I'm calling for some information about the cycle camp - I'm thinking of sending my son.","Tôi gọi để hỏi thông tin về trại xe đạp – tôi đang tính cho con trai tham gia."],["He'd probably be best in + N","Có lẽ phù hợp nhất với… – đưa ra gợi ý, lời khuyên.","He'd probably be best in Level 5.","Có lẽ cậu bé hợp nhất với Cấp độ 5."],["In order to + V","Để làm gì (chỉ mục đích, trang trọng hơn 'to').","In order to be accepted, all our instructors have to submit a reference","Để được nhận, tất cả huấn luyện viên phải nộp thư giới thiệu."],["have something to do with + N","có liên quan đến cái gì.","their instructor might tell them a story that's got something to do with cycling","huấn luyện viên có thể kể cho các em một câu chuyện liên quan đến đạp xe."],["put somebody off","làm ai nản, ngăn cản ai.","We don't let that put us off","Chúng tôi không để chuyện đó làm mình rst one I told you about is a self-drive tour through California which lasts twelve days and covers 2,020 kilometres. ( ) The shortest journey is 206 km and the longest is 632 kilometres. The cost is £525 per person. That includes accommodation, car rental and a flight but no meals. ( )"],["Andrea","OK. And the other trip?"],["Travel Agent","That lasts nine days but you spend only three days on the road. You cover about 980 kilometres altogether."],["Andrea","So is that cheaper then?"],["Travel Agent","Yes, it's almost a hundred pounds cheaper. It's £429 per person, which is a good deal. ( )"],["Andrea","So that covers accommodation and car hire. What about flights?"],["Travel Agent","They aren't included. But these hotels offer dinner in the price. ( )"],["Andrea","OK. Well, thank you very much. I'll be in touch when I've had a chance to look at the brochure."],["Travel Agent","I'm pleased to help. Goodbye."],["Andrea","Goodbye."]]}],"key":[["Ardleigh"],["newspaper"],["theme"],["tent"],["castle"],["beach","beaches"],["2,020","2020"],["flight"],["429"],["dinner"]],"anyOrder":[],"keyNote":"Q1: tên riêng viết hoa, đánh vần A-R-D-L-E-I-G-H. Q6: chấp nhận beach hoặc beaches. Q7: 2,020 (hai nghìn không trăm hai mươi). Q9: chỉ ghi số 429.","answerLines":[["ANDREA","24, [Ardleigh] Road."],["ANDREA","No, I read about you in the [newspaper]."],["TRAVEL AGENT","The first one begins in Los Angeles and there's plenty of time to visit some of the [theme] parks there."],["ANDREA","I don't like the idea of staying in a [tent]."],["ANDREA","Someone told me there's a really nice [castle] near Cambria."],["ANDREA","That's good for [beaches] isn't it?"],["TRAVEL AGENT","The first one I told you about is a self-drive tour through California which lasts twelve days and covers [2,020] kilometres."],["TRAVEL AGENT","That includes accommodation, car rental and a [flight] but no meals."],["TRAVEL AGENT","It's £[429] per person, which is a good deal."],["TRAVEL AGENT","But these hotels offer
